<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bench</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M80 300 L60 360 L68 360 L90 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M130 350 L120 400 L128 400 L138 350 Z' fill='%232c2c2c'/%3E%3Cpath d='M410 290 L360 280 L362 288 L415 298 Z' fill='%232c2c2c'/%3E%3Cpath d='M460 280 L460 310 L468 310 L468 280 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 260 Q 200 380 440 250 L 440 230 Q 210 360 70 240 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 240 L 80 240 L 80 300 L 70 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M440 240 L 450 240 L 450 290 L 440 290 Z' fill='%232c2c2c'/%3E%3Cpath d='M90 280 L 480 220 L 495 230 L 120 310 Z' fill='%23b05c3a'/%3E%3Cpath d='M90 280 L 120 310 L 120 300 L 90 270 Z' fill='%239c4e2f'/%3E%3Cpath d='M40 220 L 410 160 L 410 120 L 50 180 Z' fill='%23b05c3a'/%3E%3Cpath d='M45 180 L 400 120 L 400 80 L 55 140 Z' fill='%23c46a45'/%3E%3Ccircle cx='65' cy='190' r='5' fill='%23808080'/%3E%3Ccircle cx='65' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='110' cy='280' r='5' fill='%23808080'/%3E%3Ccircle cx='150' cy='295' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='135' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='175' r='5' fill='%23808080'/%3E%3Ccircle cx='450' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='470' cy='225' r='5' fill='%23808080'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* --- TOUT LE CSS EXISTANT (inchangé) --- */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ede4;
      --surface: #faf7f2;
      --surface2: #f0ebe1;
      --ink: #1c1712;
      --ink2: #5a5044;
      --ink3: #9c8f80;
      --forest: #1d3d2c;
      --forest2: #2e6047;
      --forest3: #4a8c6a;
      --gold: #b8813a;
      --gold2: #d4a054;
      --gold3: #f2c97e;
      --rust: #9e3b1f;
      --border: rgba(90,80,68,0.14);
      --shadow: 0 2px 20px rgba(28,23,18,0.10);
      --shadow-deep: 0 8px 40px rgba(28,23,18,0.18);
      --r: 20px;
      --r-sm: 12px;
      --nav-h: 74px;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--forest3);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 calc(var(--nav-h) + 16px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .screen::-webkit-scrollbar { display: none; }

    .app-hero {
      position: relative;
      background: var(--forest);
      padding: 52px 20px 28px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .app-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 10% 0%, rgba(184,129,58,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(74,140,106,0.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-deco {
      position: absolute;
      width: 6rem;
      height: 6rem;
      opacity: 0.05;
      bottom: 10px;
      right: 10px;
      transform: rotate(-15deg);
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }
    .hero-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }
    .hero-logo img { width: 1.1rem; height: 1.1rem; opacity: 0.8; }
    .hero-logo em { color: var(--gold3); font-style: normal; }
    .user-menu-wrap { position: relative; }
    .user-menu-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 5px 12px 5px 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-menu-btn:active { background: rgba(255,255,255,0.18); }
    .user-avatar {
      width: 26px; height: 26px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .user-menu-chevron {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      transition: transform 0.2s;
    }
    .user-menu-btn[aria-expanded="true"] .user-menu-chevron { transform: rotate(180deg); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-deep);
      overflow: hidden;
      z-index: 60;
      min-width: 190px;
      animation: dropIn 0.18s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-user-info {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-user-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink3);
      margin-bottom: 2px;
    }
    .dropdown-user-name {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--ink2);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .dropdown-item:active { background: var(--bg); }
    .dropdown-item.danger { color: var(--rust); }
    .dropdown-item .item-icon { font-size: 1rem; width: 20px; text-align: center; }

    .hero-greeting { position: relative; }
    .hero-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold3);
      margin-bottom: 5px;
      opacity: 0.85;
    }
    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 18px;
    }
    .hero-title em { font-style: normal; color: var(--gold3); }
    .hero-stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .hero-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .hero-stat-num {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .screen-content { padding: 20px 16px 0; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(250,247,242,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: var(--r-sm);
      border: none;
      background: none;
    }
    .nav-item .nav-icon {
      font-size: 1.3rem;
      line-height: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-item .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink3);
      transition: color 0.2s;
    }
    .nav-item.active .nav-icon { transform: scale(1.2); }
    .nav-item.active .nav-label { color: var(--forest); font-weight: 700; }
    .fab {
      width: 58px; height: 58px;
      background: var(--forest);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(29,61,44,0.4);
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      margin-bottom: 4px;
      color: white;
    }
    .fab:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(29,61,44,0.3); }

    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--ink3);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 12px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-field:focus { border-color: var(--forest3); box-shadow: 0 0 0 3px rgba(74,140,106,0.12); }
    .search-field::placeholder { color: var(--ink3); }
    .search-clear {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: var(--ink3);
      border: none;
      color: white;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink2);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      scroll-snap-align: start;
      font-family: 'Inter', sans-serif;
    }
    .chip.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .chip:active { transform: scale(0.94); }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest);
    }
    .section-count {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: white;
      font-size: 0.62rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
    }

    .bench-card {
      background: var(--surface);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      animation: slideup 0.4s cubic-bezier(0.22,1,0.36,1) both;
      will-change: transform;
      transition: transform 0.2s, box-shadow 0.3s;
      backface-visibility: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      display: block;
      position: relative;
    }
    .bench-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-deep); }
    @keyframes slideup {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-media {
      position: relative;
      height: 200px;
      background: var(--surface2);
      overflow: hidden;
    }
    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28,23,18,0.5);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      font-size: 1rem;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
    }
    .carousel-btn:hover { background: rgba(28,23,18,0.8); }
    .carousel-btn:active { transform: translateY(-50%) scale(0.9); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .carousel-dot.active {
      background: #fff;
      width: 14px;
      border-radius: 999px;
    }

    .card-badge-moment {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(28,23,18,0.72);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
    }
    .heart-btn {
      position: absolute;
      top: 10px; left: 10px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(28,23,18,0.55);
      backdrop-filter: blur(6px);
      border: none;
      color: #fff;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 4;
      transition: transform 0.15s, background 0.15s;
    }
    .heart-btn:active { transform: scale(0.88); }
    .heart-btn.is-fav { background: rgba(158,59,31,0.85); }

    .score-ring {
      position: absolute;
      bottom: 12px; left: 12px;
      width: 42px; height: 42px;
      background: rgba(28,23,18,0.7);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid rgba(184,129,58,0.6);
      z-index: 2;
    }
    .score-ring-num { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--gold3); line-height: 1; }
    .score-ring-label { font-size: 0.42rem; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    .card-body { padding: 14px 16px 16px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .card-name { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--ink); line-height: 1.2; flex: 1; }
    .card-rating { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stars { color: var(--gold); font-size: 0.85rem; letter-spacing: -1px; }
    .rating-num { font-size: 0.85rem; font-weight: 700; color: var(--ink2); }
    .card-comment {
      font-size: 0.83rem; color: var(--ink2); font-style: italic; line-height: 1.5;
      margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-criteria {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px;
      margin-bottom: 12px; background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px;
    }
    .crit-row { display: flex; justify-content: space-between; align-items: center; }
    .crit-label { font-size: 0.7rem; color: var(--ink3); }
    .crit-bar-wrap { display: flex; align-items: center; gap: 5px; }
    .crit-bar { width: 36px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .crit-fill { height: 100%; background: var(--forest3); border-radius: 999px; }
    .crit-val { font-size: 0.68rem; font-weight: 700; color: var(--forest2); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(74,140,106,0.1); border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: var(--forest2); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-author { font-size: 0.68rem; color: var(--ink3); }
    .card-author strong { color: var(--ink2); }
    .card-location { font-size: 0.68rem; color: var(--ink3); }

    .admin-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(158, 59, 31, 0.85);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .admin-delete-btn:hover { background: var(--rust); }
    .admin-delete-btn:active { transform: scale(0.94); }

    .bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bench-grid .bench-card { margin-bottom: 0; }
    .bench-grid .card-media { height: 130px; }
    .bench-grid .card-comment, .bench-grid .card-criteria, .bench-grid .card-tags { display: none; }
    .bench-grid .card-footer { flex-direction: column; align-items: flex-start; gap: 6px; }
    .bench-grid .card-name { font-size: 0.95rem; }
    .bench-grid .admin-delete-btn { font-size: 0.6rem; padding: 4px 8px; top: 6px; right: 6px; }

    .sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .sort-bar::-webkit-scrollbar { display: none; }
    .sort-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); white-space: nowrap; flex-shrink: 0; }
    .sort-btn {

    function daysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }
    function haversineKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }
    function starsFor(rating) {
      const r = Math.round(rating);
      return '★'.repeat(r) + '☆'.repeat(5 - r);

    // ============================================================
    // 4. COMPOSANT CARROUSEL
    // ============================================================
    function ImageCarousel({ images, altText }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const safeImages = images && images.length > 0 ? images : [
        "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80"
      ];
      const prevSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === 0 ? safeImages.length - 1 : prev - 1)); };
      const nextSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === safeImages.length - 1 ? 0 : prev + 1)); };
      const goToSlide = (index, e) => { e.stopPropagation(); setCurrentIndex(index); };
      return (
        <div className="card-media">
          <img src={safeImages[currentIndex]} alt={`${altText} - photo ${currentIndex + 1}`} className="carousel-img" />
          {safeImages.length > 1 && (
            <>
              <button className="carousel-btn prev" onClick={prevSlide} aria-label="Photo précédente">‹</button>
              <button className="carousel-btn next" onClick={nextSlide} aria-label="Photo suivante">›</button>
              <div className="carousel-dots">
                {safeImages.map((_, idx) => (
                  <button key={idx} className={`carousel-dot ${idx === currentIndex ? 'active' : ''}`} onClick={(e) => goToSlide(idx, e)} aria-label={`Aller à la photo ${idx + 1}`} />
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    // ============================================================

      // ============================================================
      // 6. EFFETS : SESSION UTILISATEUR

        if (db) {
          db.auth.getSession().then(({ data: { session } }) => {
            if (session?.user) {
              setUser(session.user);
              checkUserProfile(session.user);
            }
          });
          const { data: authListener } = db.auth.onAuthStateChange(async (_event, session) => {
            if (session?.user) {
              setUser(session.user);
              await checkUserProfile(session.user);
            } else {
              setUser(null);
              setPseudo(null);
              setIsLoggedIn(false);
              setShowPseudoPage(false);
            }
          });
          return () => authListener.subscription.unsubscribe();
        } else {
          const fake = getFakeUser();
          if (fake) {
            setUser(fake);
            const profiles = getFakeProfiles();
            if (profiles[fake.id]?.pseudo) {
              const p = profiles[fake.id].pseudo;
              setPseudo(p);
              setIsLoggedIn(true);
              setShowPseudoPage(false);
            } else {
              setShowPseudoPage(true);
            }
          }
        }
      }, []);

      async function checkUserProfile(user) {
        if (!db) return;
        const { data, error } = await db.from('profiles').select('pseudo').eq('id', user.id).maybeSingle();
        if (error) {
          console.error('Erreur récupération profil:', error);
          return;
        }
        if (data?.pseudo) {
          setPseudo(data.pseudo);
          setIsLoggedIn(true);
          setShowPseudoPage(false);
        } else {
          setShowPseudoPage(true);
          setIsLoggedIn(false);
        }
      }

      // ============================================================
      // 7. AUTHENTIFICATION
      // ============================================================
      async function handleAuthSubmit(e) {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        if (!email || !password) {
          setAuthError('Veuillez remplir tous les champs.');
          return;
        }

        if (!isValidEmail(email)) {
          setAuthError('L\'email doit contenir au moins 4 caractères avant le @ et un domaine valide (ex: abcd@domaine.com).');
          return;
        }

        if (db) {
          try {
            if (authMode === 'login') {
              const { data, error } = await db.auth.signInWithPassword({ email, password });
              if (error) {
                if (error.message.includes('Invalid login credentials')) {
                  setAuthError('Email ou mot de passe incorrect.');
                } else {
                  setAuthError(error.message);
                }
                return;
              }
              await checkUserProfile(data.user);
              setAuthSuccess('Connexion réussie !');
            } else if (authMode === 'register') {
              const { data, error } = await db.auth.signUp({ email, password });
              if (error) {
                if (error.message.includes('User already registered')) {
                  setAuthError('Désolé, cette adresse email est déjà utilisée.');
                } else {
                  setAuthError(error.message);
                }
                return;
              }
              if (data.user) {
                setUser(data.user);
                setShowPseudoPage(true);
                setAuthSuccess('Inscription réussie ! Choisissez votre pseudo.');
              }
            } else if (authMode === 'forgot') {
              const { error } = await db.auth.resetPasswordForEmail(email);
              if (error) {
                setAuthError(error.message);
                return;
              }
              setAuthSuccess('Un email de réinitialisation a été envoyé à votre adresse.');
            }
          } catch (err) {
            setAuthError(err.message);
          }
        } else {
          // Mode démo
          const users = getFakeUsers();
          if (authMode === 'login') {
            if (users[email] && users[email].password === password) {
              const userObj = { id: email, email };
              setFakeUser(userObj);
              setUser(userObj);
              const profiles = getFakeProfiles();
              if (profiles[email]?.pseudo) {
                setPseudo(profiles[email].pseudo);
                setIsLoggedIn(true);
                setShowPseudoPage(false);
                setAuthSuccess('Connexion réussie !');
              } else {
                setShowPseudoPage(true);
                setAuthSuccess('Première connexion, choisissez votre pseudo.');
              }
            } else {
              setAuthError('Email ou mot de passe incorrect.');
            }
          } else if (authMode === 'register') {
            if (users[email]) {
              setAuthError('Désolé, cette adresse email est déjà utilisée.');
              return;
            }
            users[email] = { password };
            setFakeUsers(users);
            const userObj = { id: email, email };
            setFakeUser(userObj);
            setUser(userObj);
            setShowPseudoPage(true);
            setAuthSuccess('Inscription réussie ! Choisissez votre pseudo.');
          } else if (authMode === 'forgot') {
            if (users[email]) {
              setAuthSuccess('Un email de réinitialisation a été envoyé (simulé).');
            } else {
              setAuthError('Aucun compte associé à cette adresse.');
            }
          }
        }
      }

      // ============================================================
      // 8. GESTION DU PSEUDO
      // ============================================================
      async function isPseudoAvailable(pseudoToCheck) {
        if (db) {
          const { data, error } = await db.from('profiles').select('pseudo').eq('pseudo', pseudoToCheck).maybeSingle();
          if (error) {
            console.error('Erreur vérification pseudo:', error);
            return false;
          }
          return !data;
        } else {
          const profiles = getFakeProfiles();
          return !Object.values(profiles).some(p => p.pseudo === pseudoToCheck);
        }
      }

      async function handlePseudoChange(newPseudo) {
        setPseudo(newPseudo);
        const available = await isPseudoAvailable(newPseudo);
        if (!available) {
          const suggestions = [];
          for (let i = 1; i <= 2; i++) {
            const candidate = newPseudo + i;
            const avail = await isPseudoAvailable(candidate);
            if (avail) suggestions.push(candidate);
          }
          setPseudoSuggestions(suggestions);
          setSelectedSuggestion(null);
          setAuthError('Ce pseudo est déjà pris. Voici quelques suggestions :');
        } else {
          setPseudoSuggestions([]);
          setSelectedSuggestion(null);
          setAuthError('');
        }
      }

      async function handleSavePseudo(e) {
        e.preventDefault();
        let finalPseudo = pseudo;
        if (selectedSuggestion) {
          finalPseudo = selectedSuggestion;
          setPseudo(selectedSuggestion);
        }
        if (!finalPseudo.trim()) {
          setAuthError('Veuillez saisir un pseudo.');
          return;
        }

        const available = await isPseudoAvailable(finalPseudo);
        if (!available) {
          setAuthError('Ce pseudo est déjà pris. Veuillez en choisir un autre.');
          return;
        }

        if (db) {
          const { error } = await db.from('profiles').upsert({ id: user.id, pseudo: finalPseudo.trim() });
          if (error) {
            setAuthError('Erreur lors de l\'enregistrement du pseudo : ' + error.message);
            return;
          }
          setPseudo(finalPseudo.trim());
          setIsLoggedIn(true);
          setShowPseudoPage(false);
          setAuthSuccess('Pseudo enregistré !');
        } else {
          const profiles = getFakeProfiles();
          profiles[user.id] = { pseudo: finalPseudo.trim() };
          setFakeProfiles(profiles);
          setPseudo(finalPseudo.trim());
          setIsLoggedIn(true);
          setShowPseudoPage(false);
          setAuthSuccess('Pseudo enregistré !');
        }
      }

      // ============================================================
      // 9. FONCTIONS DE L'APPLICATION
      // ============================================================
      function showToast(msg) { setToast(msg); }

      async function handleLogout() {
        setMenuOpen(false);
        setSelectedBench(null);
        setConfirmingDelete(false);
        setShowAddForm(false);
        setView('list');
        setQuery('');
        setActiveCategory('tous');

        if (db) {
          await db.auth.signOut();
        } else {
          setFakeUser(null);
        }
        setUser(null);
        setPseudo(null);
        setIsLoggedIn(false);
        setShowPseudoPage(false);
        setAuthMode('login');
        setEmail('');
        setPassword('');
        setAuthError('');
        setAuthSuccess('');
      }

      async function handleDeleteBench(benchId) {
        if (!user || user.email !== ADMIN_EMAIL) {
          showToast("Action réservée à l'administrateur.");
          return;
        }
        if (!confirm("Es-tu sûr de vouloir supprimer ce banc ?")) return;

        if (db) {
          const { error } = await db.from('benches').delete().eq('id', benchId);
          if (error) {
            showToast("Erreur lors de la suppression : " + error.message);
          } else {
            setBenches(prev => prev.filter(b => b.id !== benchId));
            if (selectedBench && selectedBench.id === benchId) setSelectedBench(null);
            showToast("Banc supprimé avec succès.");
          }
        } else {
          setBenches(prev => prev.filter(b => b.id !== benchId));
          if (selectedBench && selectedBench.id === benchId) setSelectedBench(null);
          showToast("Banc supprimé (démo).");
        }
      }

      function showUserStats(authorPseudo) {
        if (!authorPseudo) return;
        const userBenches = benches.filter(b => b.author === authorPseudo);
        const count = userBenches.length;
        const avg = count > 0 ? (userBenches.reduce((s, b) => s + b.rating, 0) / count).toFixed(1) : 0;
        setUserStats({ pseudo: authorPseudo, count, avg });
        setSelectedUserPseudo(authorPseudo);
      }

      // ============================================================
      // 11. AUTRES COMPOSANTS

      function EmptyState({ icon, title, text }) {
        return (
          <div className="empty-state">

      function Pagination() {
        if (totalPages <= 1) return null;
        return (
          <div className="pagination">
            <button className="page-btn" disabled={pageSafe === 1} onClick={() => setPage(p => Math.max(1, p - 1))}>←</button>
            {Array.from({ length: totalPages }, (_, i) => i + 1).map(n => (
              <button key={n} className={`page-btn ${n === pageSafe ? 'active' : ''}`} onClick={() => setPage(n)}>{n}</button>
            ))}
            <button className="page-btn" disabled={pageSafe === totalPages} onClick={() => setPage(p => Math.min(totalPages, p + 1))}>→</button>
          </div>
        );
      }

      // ============================================================
      // 12. LOGIQUE DE FILTRE, TRI, MAP
      // ============================================================
      useEffect(() => {
        const onClick = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') {
            setMenuOpen(false);
            setSelectedBench(null);
            setShowAddForm(false);
            setShowAdminModal(false);
            setSelectedUserPseudo(null);
            setUserStats(null);
          }
        };
        document.addEventListener("mousedown", onClick);
        document.addEventListener("keydown", onKey);
        return () => {
          document.removeEventListener("mousedown", onClick);
          document.removeEventListener("keydown", onKey);
        };
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => { setPage(1); }, [query, activeCategory, sortBy, view]);

      const baseList = view === 'favoris' ? benches.filter(b => b.favorite) : benches;
      const filteredSorted = useMemo(() => {
        let out = baseList;
        if (view === 'list') {
          if (query.trim()) {
            const q = query.trim().toLowerCase();
            out = out.filter(b => b.name.toLowerCase().includes(q) || b.location.toLowerCase().includes(q));
          }
          if (activeCategory !== 'tous') {
            out = out.filter(b => b.category === activeCategory);
          }
          out = [...out];
          if (sortBy === 'note') out.sort((a, b) => b.rating - a.rating);
          else if (sortBy === 'recent') out.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
          else if (sortBy === 'distance') {
            if (userLocation) {
              out.sort((a, b) => {
                const da = (a.lat != null) ? haversineKm(userLocation, a) : Infinity;
                const db = (b.lat != null) ? haversineKm(userLocation, b) : Infinity;
                return da - db;
              });
            } else {
              out.sort((a, b) => a.location.localeCompare(b.location));
            }
          }
        }
        return out;
      }, [baseList, query, activeCategory, sortBy, userLocation, view]);

      const totalPages = Math.max(1, Math.ceil(filteredSorted.length / PAGE_SIZE));
      const pageSafe = Math.min(page, totalPages);
      const pageItems = filteredSorted.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
      const avgRating = benches.length ? (benches.reduce((s, b) => s + b.rating, 0) / benches.length).toFixed(1) : 0;

      // Leaflet
      useEffect(() => {
        if (view !== 'map') return;
        const t = setTimeout(() => {
          if (!mapInstance.current && document.getElementById('map-container')) {
            const worldBounds = L.latLngBounds([-89, -180], [89, 180]);
            mapInstance.current = L.map('map-container', {
              zoomControl: true,
              minZoom: 2,
              maxZoom: 18,
              maxBounds: worldBounds,
              maxBoundsViscosity: 1.0,
              worldCopyJump: false,
            }).setView([46.6, 2.4], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              minZoom: 2,
              maxZoom: 18,
              noWrap: true,
              bounds: worldBounds,
              detectRetina: true,
              attribution: '&copy; OpenStreetMap'
            }).addTo(mapInstance.current);
            markersLayer.current = L.layerGroup().addTo(mapInstance.current);
          }
          if (mapInstance.current) {
            mapInstance.current.invalidateSize();
            renderMarkers();
          }
        }, 100);
        return () => {
          clearTimeout(t);
          if (mapInstance.current) {
            mapInstance.current.remove();
            mapInstance.current = null;
          }
        };
      }, [view]);

      useEffect(() => {
        if (view === 'map' && mapInstance.current) renderMarkers();
      }, [benches]);

      function renderMarkers() {
        if (!markersLayer.current) return;
        markersLayer.current.clearLayers();
        const withCoords = benches.filter(b => b.lat != null && b.lng != null);
        withCoords.forEach(b => {
          const icon = L.divIcon({
            className: '',
            html: `<div style="width:34px;height:34px;background:#1d3d2c;border:2px solid #f2c97e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(28,23,18,0.35);"><img src="${benchImageSrc}" style="width:16px;height:16px;transform:rotate(45deg);"/></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 32]
          });
          const m = L.marker([b.lat, b.lng], { icon }).addTo(markersLayer.current);
          m.on('click', () => setSelectedBench(b));
        });
        if (withCoords.length && mapInstance.current) {
          const bounds = L.latLngBounds(withCoords.map(b => [b.lat, b.lng]));
          mapInstance.current.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
        }
      }

      function locateMe(forSort) {
        if (!navigator.geolocation) {
          showToast("Localisation non disponible sur cet appareil");
          return;
        }
        setLocationStatus('pending');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setUserLocation(loc);
            setLocationStatus('granted');
            if (mapInstance.current) {
              mapInstance.current.flyTo([loc.lat, loc.lng], 12);
              if (userMarker.current) userMarker.current.remove();
              userMarker.current = L.circleMarker([loc.lat, loc.lng], {
                radius: 8, color: '#b8813a', fillColor: '#f2c97e', fillOpacity: 0.9, weight: 2
              }).addTo(mapInstance.current);
            }
            if (forSort) showToast("Tri par distance activé");
          },
          () => {
            setLocationStatus('denied');
            showToast("Localisation refusée ou indisponible");
          },
          { timeout: 8000 }
        );
      }

      function handleSortClick(key) {
        setSortBy(key);
        if (key === 'distance' && !userLocation) locateMe(true);
      }

      function toggleFavorite(id, e) {
        if (e) e.stopPropagation();
        setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: !b.favorite } : b));
        setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: !sb.favorite } : sb);
      }

      function openAddForm() {
        setFormData(EMPTY_FORM);
        setFormError('');
        setShowAddForm(true);
      }

      // Gestion des fichiers photo
      function handlePhotoFile(index, file) {
        if (!file) {
          // Supprimer l'image si aucun fichier sélectionné
          const key = `img${index + 1}`;
          setFormData(f => ({ ...f, [key]: '' }));
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          const key = `img${index + 1}`;
          setFormData(f => ({ ...f, [key]: reader.result }));
        };
        reader.readAsDataURL(file);
      }

      function handleAddSubmit(e) {
        e.preventDefault();
        if (!formData.name.trim() || !formData.location.trim()) {
          setFormError("Le nom du banc et la ville sont obligatoires.");
          return;
        }
        // Vérifier qu'au moins une photo est présente
        if (!formData.img1 && !formData.img2 && !formData.img3) {
          setFormError("Veuillez ajouter au moins une photo.");
          return;
        }

        const authorName = pseudo || user?.email || 'Anonyme';
        // Récupérer les images non vides
        const userImages = [formData.img1, formData.img2, formData.img3].filter(url => url && url.trim() !== '');
        // Si aucune image, on utilise les images par défaut (normalement on ne devrait pas arriver ici à cause de la validation)
        const defaultImgs = [
          "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80"
        ];
        const finalImages = userImages.length > 0 ? userImages : defaultImgs;

        const newBench = {
          id: Date.now(),
          name: formData.name.trim(),
          location: formData.location.trim(),
          category: formData.category,
          rating: formData.rating,
          comment: formData.comment.trim(),
          criteria: { confort: formData.confort, solidite: formData.solidite },
          author: authorName,
          tags: formData.tags,
          dateAdded: new Date().toISOString(),
          favorite: false,
          lat: formData.lat,
          lng: formData.lng,
          images: finalImages
        };
        setBenches(bs => [newBench, ...bs]);
        setShowAddForm(false);
        setView('list');
        setActiveCategory('tous');
        showToast("Banc ajouté avec succès");
      }

      function useMyPositionForForm() {
        if (!navigator.geolocation) {
          showToast("Localisation non disponible");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => setFormData(f => ({ ...f, lat: pos.coords.latitude, lng: pos.coords.longitude })),
          () => showToast("Impossible de récupérer votre position"),
          { timeout: 8000 }
        );
      }

      function toggleTag(tag) {
        setFormData(f => {
          const current = f.tags || [];
          if (current.includes(tag)) {
            return { ...f, tags: current.filter(t => t !== tag) };
          } else {
            return { ...f, tags: [...current, tag] };
          }
        });
      }

      // ============================================================
      // 13. RENDU
      // ============================================================

      // --- Page de choix du pseudo ---
      if (showPseudoPage) {
        return (
          <div className="pseudo-page">
            <div className="home-blob home-blob-1"></div>
            <div className="home-blob home-blob-2"></div>
            <img src={benchImageSrc} className="home-watermark" alt="" />
            <div className="pseudo-content">
              <div className="home-logo-badge" style={{ animationDelay: '0.05s' }}>
                <img src={benchImageSrc} alt="" />
              </div>
              <div className="home-eyebrow" style={{ animationDelay: '0.15s' }}>Bienvenue sur My Bench</div>
              <h1 className="home-title" style={{ animationDelay: '0.25s' }}>Choisis ton <em>pseudo</em></h1>
              <p className="home-subtitle" style={{ animationDelay: '0.35s' }}>
                Ce nom sera affiché lors de l'ajout de tes bancs.
              </p>

              <form className="auth-form" onSubmit={handleSavePseudo} style={{ animationDelay: '0.45s' }}>

                {authSuccess && <div className="form-error" style={{ color: '#a3e4b0' }}>{authSuccess}</div>}

                <div className="form-field">
                  <label className="form-label" htmlFor="pseudo-input">Pseudo</label>

                    id="pseudo-input"
                    className="form-input"
                    type="text"
                    placeholder="Ton pseudo"
                    value={pseudo || ''}
                    onChange={(e) => handlePseudoChange(e.target.value)}

                  />
                </div>

                {pseudoSuggestions.length > 0 && (
                  <div style={{ marginBottom: '12px' }}>

                <button type="submit" className="btn-primary">Valider mon pseudo</button>

          </div>

      // --- Page d'accueil (connexion / inscription) ---
      if (!isLoggedIn) {

            <div className="home-blob home-blob-2"></div>

              <div className="home-logo-badge" style={{ animationDelay: '0.05s' }}>
                <img src={benchImageSrc} alt="" />
              </div>
              <div className="home-eyebrow" style={{ animationDelay: '0.15s' }}>Le carnet des amoureux du repos</div>
              <h1 className="home-title" style={{ animationDelay: '0.25s' }}>My <em>Bench</em></h1>
              <p className="home-subtitle" style={{ animationDelay: '0.35s' }}>

              <form className="auth-form" onSubmit={handleAuthSubmit} style={{ animationDelay: '0.45s' }}>

                    </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12, flexWrap: 'wrap', gap: 6 }}>
                  <button type="button" className="auth-toggle" onClick={() => {
                    setAuthMode(authMode === 'login' ? 'register' : 'login');
                    setAuthError('');
                    setAuthSuccess('');
                  }}>
                    {authMode === 'login' ? 'Créer un compte' : 'Déjà un compte ? Se connecter'}

                  {authMode !== 'forgot' && (
                    <button type="button" className="forgot-link" onClick={() => {

                      setAuthError('');
                      setAuthSuccess('');

                      Mot de passe oublié ?
                    </button>
                  )}

                    <button type="button" className="forgot-link" onClick={() => {
                      setAuthMode('login');
                      setAuthError('');
                      setAuthSuccess('');
                    }}>
                      Retour à la connexion
                    </button>
                  )}
                </div>
              </form>

              <div className="home-hint" style={{ animationDelay: '0.55s' }}>
                {db ? 'Connecte-toi pour contribuer' : ''}
              </div>
            </div>
          </div>
        );
      }

      // ============================================================
      // 14. APPLICATION PRINCIPALE (connecté)
      // ============================================================
      return (
        <>
          {toast && <div className="toast" role="status">{toast}</div>}

          <div className="screen">
            <div className="app-hero">
              <img src={benchImageSrc} className="hero-deco" alt="" />
              <div className="hero-top">
                <div className="hero-logo">
                  <img src={benchImageSrc} alt="" />My <em>Bench</em>
                </div>
                <div className="user-menu-wrap" ref={menuRef}>
                  <button
                    className="user-menu-btn"
                    onClick={() => setMenuOpen(o => !o)}
                    aria-haspopup="menu"
                    aria-expanded={menuOpen}
                  >
                    <div className="user-avatar">{pseudo ? pseudo[0] : '?'}</div>
                    <span className="user-name">{pseudo || 'Utilisateur'}</span>
                    <span className="user-menu-chevron">▼</span>
                  </button>
                  {menuOpen && (
                    <div className="user-dropdown" role="menu">
                      <div className="dropdown-user-info">
                        <div className="dropdown-user-label">Connecté en tant que</div>
                        <div className="dropdown-user-name">{pseudo || user?.email || 'Utilisateur'}</div>
                      </div>
                      <button className="dropdown-item" onClick={() => { setView('profil'); setMenuOpen(false); }}>
                        <span className="item-icon">👤</span>Mon profil
                      </button>
                      {user?.email === ADMIN_EMAIL && (
                        <button className="dropdown-item" onClick={() => { setShowAdminModal(true); setMenuOpen(false); }}>
                          <span className="item-icon">🔐</span>Admin
                        </button>
                      )}
                      <button className="dropdown-item danger" onClick={handleLogout}>
                        <span className="item-icon">🚪</span>Se déconnecter
                      </button>
                    </div>
                  )}
                </div>
              </div>
              <div className="hero-greeting">
                <div className="hero-eyebrow">Trouvez votre spot</div>
                <h1 className="hero-title">Les plus beaux <em>bancs</em> du monde</h1>
                <div className="hero-stats">
                  <div className="hero-stat">
                    <span className="hero-stat-num">{benches.length}</span>
                    <span className="hero-stat-label">Bancs</span>
                  </div>
                  <div className="hero-stat">
                    <span className="hero-stat-num">{avgRating}</span>
                    <span className="hero-stat-label">Note</span>
                  </div>
                  <div className="hero-stat">
                    <span className="hero-stat-num">{benches.filter(b => b.favorite).length}</span>
                    <span className="hero-stat-label">Favoris</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="screen-content">
              {view === 'list' && (
                <>
                  <div className="search-wrap">
                    <span className="search-icon">🔍</span>
                    <input
                      className="search-field"
                      type="text"
                      placeholder="Rechercher un banc, une ville..."
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      aria-label="Rechercher un banc"
                    />
                    {query && (
                      <button className="search-clear" onClick={() => setQuery('')} aria-label="Effacer la recherche">✕</button>
                    )}
                  </div>

                  <div className="chips-row">
                    <div className={`chip ${activeCategory === 'tous' ? 'active' : ''}`} onClick={() => setActiveCategory('tous')}>Tous</div>
                    {Object.entries(CATEGORY_META).map(([key, meta]) => (
                      <div key={key} className={`chip ${activeCategory === key ? 'active' : ''}`} onClick={() => setActiveCategory(key)}>
                        {meta.icon} {meta.label}
                      </div>
                    ))}
                  </div>

                  <div className="section-header">
                    <h2 className="section-title">Bancs à proximité</h2>
                    <span className="section-count">
                      <span className="count-badge">{filteredSorted.length}</span> résultats
                    </span>
                  </div>

                  <div className="sort-bar">
                    <span className="sort-label">Trier par :</span>
                    <button className={`sort-btn ${sortBy === 'note' ? 'active' : ''}`} onClick={() => handleSortClick('note')}>⭐ Note</button>
                    <button className={`sort-btn ${sortBy === 'distance' ? 'active' : ''}`} onClick={() => handleSortClick('distance')}>📍 Distance</button>
                    <button className={`sort-btn ${sortBy === 'recent' ? 'active' : ''}`} onClick={() => handleSortClick('recent')}>🆕 Nouveautés</button>

                    <div className="view-toggle">
                      <button className={`view-btn ${viewMode === 'list' ? 'active' : ''}`} onClick={() => setViewMode('list')} aria-label="Vue liste" aria-pressed={viewMode === 'list'}>☰</button>
                      <button className={`view-btn ${viewMode === 'grid' ? 'active' : ''}`} onClick={() => setViewMode('grid')} aria-label="Vue grille" aria-pressed={viewMode === 'grid'}>▦</button>
                    </div>
                  </div>

                  {sortBy === 'distance' && !userLocation && locationStatus === 'denied' && (
                    <div className="location-note">Active la localisation pour trier par distance réelle — tri alphabétique utilisé en attendant.</div>
                  )}

                  {pageItems.length === 0 ? (
                    <EmptyState icon="🪑" title="Aucun banc trouvé" text="Essaie un autre mot-clé ou une autre catégorie, ou ajoute le premier banc correspondant." />
                  ) : (
                    <div className={viewMode === 'grid' ? 'bench-grid' : ''}>
                      {pageItems.map(item => <BenchCard item={item} key={item.id} />)}
                    </div>
                  )}

                  <Pagination />
                </>
              )}

              {view === 'favoris' && (
                <>
                  <div className="section-header">
                    <h2 className="section-title">Vos favoris</h2>
                    <span className="section-count"><span className="count-badge">{filteredSorted.length}</span> résultats</span>
                  </div>
                  {pageItems.length === 0 ? (
                    <EmptyState icon="♡" title="Aucun favori pour l'instant" text="Touche le cœur sur un banc pour l'ajouter ici et le retrouver facilement." />
                  ) : (
                    <>
                      <div className={viewMode === 'grid' ? 'bench-grid' : ''}>
                        {pageItems.map(item => <BenchCard item={item} key={item.id} />)}
                      </div>
                      <Pagination />
                    </>
                  )}
                </>
              )}

              {view === 'profil' && (
                <>
                  <div className="section-header"><h2 className="section-title">Profil</h2></div>
                  <div className="profile-card">
                    <div className="profile-avatar">{pseudo ? pseudo[0] : '?'}</div>
                    <div className="profile-name">{pseudo || 'Utilisateur'}</div>
                    <div className="profile-sub">{user?.email}</div>
                    <div className="profile-stats">
                      <div className="profile-stat">
                        <div className="profile-stat-num">{benches.filter(b => b.author === pseudo).length}</div>
                        <div className="profile-stat-label">Bancs ajoutés</div>
                      </div>
                      <div className="profile-stat">
                        <div className="profile-stat-num">{benches.filter(b => b.favorite).length}</div>
                        <div className="profile-stat-label">Favoris</div>

                    <button className="profile-logout" onClick={handleLogout}>Se déconnecter</button>
                  </div>

              )}

              {view === 'map' && (
                <>
                  <div className="section-header"><h2 className="section-title">Carte des bancs</h2></div>
                  <div className="map-wrap">
                    <div id="map-container"></div>

          </div>

          <div className="bottom-nav">
            <button className={`nav-item ${view === 'list' ? 'active' : ''}`} onClick={() => setView('list')}>
              <span className="nav-icon">🪑</span>
              <span className="nav-label">Bancs</span>

            <button className={`nav-item ${view === 'map' ? 'active' : ''}`} onClick={() => setView('map')}>
              <span className="nav-icon">🗺️</span>
              <span className="nav-label">Carte</span>

            <button className="fab" onClick={openAddForm} aria-label="Ajouter un banc">+</button>
            <button className={`nav-item ${view === 'favoris' ? 'active' : ''}`} onClick={() => setView('favoris')}>
              <span className="nav-icon">❤️</span>
              <span className="nav-label">Favoris</span>
            </button>

              <span className="nav-icon">👤</span>
              <span className="nav-label">Profil</span>
            </button>
          </div>

          {/* MODAL ADMIN */}
          {showAdminModal && (
            <div className="sheet-overlay" onClick={() => setShowAdminModal(false)}>
              <div className="sheet-panel" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">

                  <button type="button" className="sheet-close" onClick={() => setShowAdminModal(false)} aria-label="Fermer">✕</button>

                <div className="form-field">
                  <label className="form-label" htmlFor="admin-email">Email</label>

                    id="admin-password"
                    className="form-input"
                    type="password"
                    placeholder="••••••••"
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                  />

                <div className="detail-actions">
                  <button type="button" className="btn-secondary" onClick={() => setShowAdminModal(false)}>Annuler</button>
                  <button
                    type="button"
                    className="btn-primary"

                      if (db) {
                        const { error } = await db.auth.signInWithPassword({ email: adminEmail, password: adminPassword });
                        if (error) setAdminError(error.message);
                        else { setShowAdminModal(false); setAdminError(''); showToast('Admin connecté'); }
                      } else {
                        if (adminEmail === ADMIN_EMAIL && adminPassword === 'admin123') {
                          setShowAdminModal(false);
                          setAdminError('');
                          showToast('Admin connecté (démo)');
                        } else {
                          setAdminError('Identifiants admin incorrects');
                        }
                      }
                    }}
                  >
                    Se connecter en tant qu'admin
                  </button>
                </div>
              </div>
            </div>

          {/* MODAL DÉTAILS d'un banc */}
          {selectedBench && (
            <div className="sheet-overlay" onClick={() => { setSelectedBench(null); setConfirmingDelete(false); }}>
              <div className="sheet-panel" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div>
                    <div className="detail-name">{selectedBench.name}</div>
                    <div className="detail-meta">
                      📍 {selectedBench.location} — Ajouté le {formatDate(selectedBench.dateAdded)} par{' '}
                      <strong
                        className="clickable-pseudo"
                        onClick={(e) => {
                          e.stopPropagation();
                          showUserStats(selectedBench.author);
                        }}
                      >
                        {selectedBench.author}
                      </strong>
                    </div>
                  </div>
                  <button className="sheet-close" onClick={() => { setSelectedBench(null); setConfirmingDelete(false); }} aria-label="Fermer">✕</button>
                </div>
                <div style={{ position: 'relative', marginBottom: 16 }}>
                  <ImageCarousel images={selectedBench.images} altText={selectedBench.name} />
                  <div className="score-ring">
                    <span className="score-ring-num">{selectedBench.rating}</span>
                    <span className="score-ring-label">Note</span>
                  </div>
                </div>
                <div className="card-rating" style={{ marginBottom: 14 }}>
                  <span className="stars" style={{ fontSize: '1rem' }}>{starsFor(selectedBench.rating)}</span>
                  <span className="rating-num">{selectedBench.rating} / 5</span>
                </div>
                {selectedBench.comment && <div className="detail-comment">"{selectedBench.comment}"</div>}
                <div className="card-criteria">
                  <div className="crit-row">
                    <span className="crit-label">Confort</span>
                    <div className="crit-bar-wrap">
                      <div className="crit-bar"><div className="crit-fill" style={{ width: selectedBench.criteria.confort + '%' }}></div></div>
                      <span className="crit-val">{selectedBench.criteria.confort}%</span>
                    </div>
                  </div>
                  <div className="crit-row">
                    <span className="crit-label">Solidité</span>
                    <div className="crit-bar-wrap">
                      <div className="crit-bar"><div className="crit-fill" style={{ width: selectedBench.criteria.solidite + '%' }}></div></div>
                      <span className="crit-val">{selectedBench.criteria.solidite}%</span>
                    </div>
                  </div>
                </div>
                {selectedBench.tags && selectedBench.tags.length > 0 && (
                  <div className="card-tags">
                    {selectedBench.tags.map((t, i) => <span className="tag" key={i}>{t}</span>)}
                  </div>
                )}
                <div className="detail-actions">
                  <button className="btn-secondary" onClick={(e) => toggleFavorite(selectedBench.id, e)}>
                    {selectedBench.favorite ? '💔 Retirer des favoris' : '❤️ Ajouter aux favoris'}
                  </button>
                  {user && user.email === ADMIN_EMAIL && (
                    <button
                      className={`btn-danger ${confirmingDelete ? 'confirming' : ''}`}
                      onClick={() => confirmingDelete ? handleDeleteBench(selectedBench.id) : setConfirmingDelete(true)}
                    >
                      {confirmingDelete ? 'Confirmer la suppression ?' : '🗑️ Supprimer'}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL STATS UTILISATEUR */}
          {selectedUserPseudo && userStats && (
            <div className="sheet-overlay" onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }}>
              <div className="sheet-panel" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div>
                    <div className="detail-name" style={{ fontSize: '1.4rem' }}>👤 {userStats.pseudo}</div>
                    <div className="detail-meta">Contributions de l'utilisateur</div>
                  </div>
                  <button className="sheet-close" onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }} aria-label="Fermer">✕</button>
                </div>
                <div className="user-stats-grid">
                  <div className="user-stat-card">
                    <div className="user-stat-number">{userStats.count}</div>
                    <div className="user-stat-label">Bancs ajoutés</div>
                  </div>
                  <div className="user-stat-card">
                    <div className="user-stat-number">{userStats.avg}</div>
                    <div className="user-stat-label">Note moyenne</div>
                  </div>
                </div>
                <button className="btn-secondary" style={{ width: '100%' }} onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }}>
                  Fermer
                </button>
              </div>
            </div>
          )}

          {/* MODAL AJOUT (formulaire modifié) */}
          {showAddForm && (
            <div className="sheet-overlay" onClick={() => setShowAddForm(false)}>
              <form className="sheet-panel" onClick={(e) => e.stopPropagation()} onSubmit={handleAddSubmit}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div className="detail-name" style={{ fontSize: '1.4rem' }}>Ajouter un banc</div>
                  <button type="button" className="sheet-close" onClick={() => setShowAddForm(false)} aria-label="Fermer">✕</button>
                </div>
                {formError && <div className="form-error">{formError}</div>}

                <div className="form-field">
                  <label className="form-label" htmlFor="bench-name">Nom du banc</label>
                  <input id="bench-name" className="form-input" type="text" placeholder="Ex. Banc de la place du marché" value={formData.name} onChange={(e) => setFormData(f => ({ ...f, name: e.target.value }))} />
                </div>

                <div className="form-field">
                  <label className="form-label" htmlFor="bench-location">Ville</label>
                  <input id="bench-location" className="form-input" type="text" placeholder="Ex. Nantes, France" value={formData.location} onChange={(e) => setFormData(f => ({ ...f, location: e.target.value }))} />
                </div>

                {/* NOTE GLOBALE AVANT CATÉGORIE */}
                <div className="form-field">
                  <label className="form-label">Note globale</label>
                  <div className="star-picker">
                    {[1, 2, 3, 4, 5].map(n => (
                      <button type="button" key={n} className={n <= formData.rating ? 'filled' : ''} onClick={() => setFormData(f => ({ ...f, rating: n }))} aria-label={`${n} étoiles`}>★</button>
                    ))}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">Catégorie</label>
                  <div className="chips-row" style={{ marginBottom: 0 }}>
                    {Object.entries(CATEGORY_META).map(([key, meta]) => (
                      <div key={key} className={`chip ${formData.category === key ? 'active' : ''}`} onClick={() => setFormData(f => ({ ...f, category: key }))}>
                        {meta.icon} {meta.label}
                      </div>
                    ))}
                  </div>
                </div>

                {/* AMBIANCE (tags) SOUS CATÉGORIE */}
                <div className="form-field">
                  <label className="form-label">Ambiance</label>
                  <div className="tag-toggle-group">
                    {['Calme', 'Vue', 'Atypique'].map(tag => (
                      <button
                        key={tag}
                        type="button"
                        className={`tag-toggle ${formData.tags.includes(tag) ? 'active' : ''}`}
                        onClick={() => toggleTag(tag)}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                {/* PHOTOS (fichiers) */}
                <div className="form-field">
                  <label className="form-label">Photos (au moins une)</label>
                  {[0, 1, 2].map(idx => {
                    const key = `img${idx + 1}`;
                    const value = formData[key];
                    return (
                      <div key={idx} className="photo-upload">
                        <div className="photo-input-wrapper">
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => handlePhotoFile(idx, e.target.files[0])}
                          />
                          {value && (
                            <img src={value} alt={`Aperçu ${idx + 1}`} className="photo-preview" />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="form-row">
                  <div className="form-field">
                    <label className="form-label">Confort</label>
                    <div className="range-row">
                      <input type="range" min="0" max="100" value={formData.confort} onChange={(e) => setFormData(f => ({ ...f, confort: Number(e.target.value) }))} />
                      <span className="range-val">{formData.confort}%</span>
                    </div>
                  </div>
                  <div className="form-field">
                    <label className="form-label">Solidité</label>
                    <div className="range-row">
                      <input type="range" min="0" max="100" value={formData.solidite} onChange={(e) => setFormData(f => ({ ...f, solidite: Number(e.target.value) }))} />
                      <span className="range-val">{formData.solidite}%</span>
                    </div>
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label" htmlFor="bench-comment">Commentaire (optionnel)</label>
                  <textarea id="bench-comment" className="form-textarea" placeholder="Qu'as-tu pensé de ce banc ?" value={formData.comment} onChange={(e) => setFormData(f => ({ ...f, comment: e.target.value }))}></textarea>
                </div>

                <div className="form-field">
                  <button type="button" className={`geo-btn ${formData.lat != null ? 'done' : ''}`} onClick={useMyPositionForForm}>
                    📍 {formData.lat != null ? 'Position ajoutée ✓' : 'Utiliser ma position actuelle'}
                  </button>
                </div>

                <div className="detail-actions">
                  <button type="button" className="btn-secondary" onClick={() => setShowAddForm(false)}>Annuler</button>
                  <button type="submit" className="btn-primary">Ajouter ce banc</button>
                </div>
              </form>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
