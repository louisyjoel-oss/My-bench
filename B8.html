      },
      {
        id: 'romancier', icon: '📖', label: 'Romancier', descBase: 'commentaires de plus de 100 caractères',
        getValue: (ctx) => ctx.myBenches.filter(b => (b.comment || '').length > 100).length,
        levels: [
          { tier: 'bronze', threshold: 1 }, { tier: 'argent', threshold: 3 },
          { tier: 'or', threshold: 6 }, { tier: 'platine', threshold: 10 },
        ],
      },
      {
        id: 'collectionneur', icon: '📌', label: 'Collectionneur', descBase: 'favoris enregistrés',
        getValue: (ctx) => ctx.favoritesCount,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 15 },
          { tier: 'or', threshold: 30 }, { tier: 'platine', threshold: 50 },
        ],
      },
      {
        id: 'coupdecoeur', icon: '❤️', label: 'Coup de cœur', descBase: 'fois où tes bancs ont été mis en favori',
        getValue: (ctx) => ctx.favoritesReceived,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 15 },
          { tier: 'or', threshold: 30 }, { tier: 'platine', threshold: 50 },
        ],
      },
      {
        id: 'fidele', icon: '☕', label: 'Fidèle', descBase: "jours d'affilée à contribuer",
        getValue: (ctx) => ctx.maxStreakDays,
        levels: [
          { tier: 'bronze', threshold: 3 }, { tier: 'argent', threshold: 7 },
          { tier: 'or', threshold: 14 }, { tier: 'platine', threshold: 30 },
        ],
      },
      {
        id: 'pionnier', icon: '📍', label: 'Pionnier', descBase: 'villes où vous êtes le premier contributeur',
        getValue: (ctx) => ctx.pioneerCitiesCount,
        levels: [
          { tier: 'bronze', threshold: 10 }, { tier: 'argent', threshold: 20 },
          { tier: 'or', threshold: 30 }, { tier: 'platine', threshold: 50 },
        ],
      },
    ];

    // Construit le contexte de calcul des badges à partir de la liste complète des bancs
    // (nécessaire pour le badge "Pionnier", qui compare l'utilisateur aux autres) et de l'utilisateur courant.
    function computeGamificationContext(benches, user) {
      const myBenches = user ? benches.filter(b => b.userId === user.id) : [];

      const categoryCounts = myBenches.reduce((acc, b) => {
        acc[b.category] = (acc[b.category] || 0) + 1;
        return acc;
      }, {});

      const favoritesCount = benches.filter(b => b.favorite).length;

      // Plus longue série de jours consécutifs : on regarde les jours calendaires (distincts)
      // où l'utilisateur a ajouté au moins un banc, et on retient la plus longue série trouvée
      // (utilisé pour déterminer le sous-palier du badge "Fidèle").
      const uniqueDays = Array.from(new Set(myBenches.map(b => new Date(b.dateAdded).toDateString())))
        .map(d => new Date(d).getTime())
        .sort((a, b) => a - b);
      let maxStreakDays = uniqueDays.length > 0 ? 1 : 0;
      let streak = uniqueDays.length > 0 ? 1 : 0;
      for (let i = 1; i < uniqueDays.length; i++) {
        const diffDays = Math.round((uniqueDays[i] - uniqueDays[i - 1]) / 86400000);
        streak = diffDays === 1 ? streak + 1 : 1;
        if (streak > maxStreakDays) maxStreakDays = streak;
      }

      // Pionnier : pour chaque ville, on retient le banc le plus ancien (date_added) ; le nombre
      // de villes où ce "premier banc" appartient à l'utilisateur détermine son sous-palier.
      let pioneerCitiesCount = 0;
      if (user) {
        const firstByLocation = new Map();
        benches.forEach(b => {
          const key = (b.location || '').trim().toLowerCase();
          if (!key) return;
          const existing = firstByLocation.get(key);
          if (!existing || new Date(b.dateAdded) < new Date(existing.dateAdded)) {
            firstByLocation.set(key, b);
          }
        });
        pioneerCitiesCount = Array.from(firstByLocation.values()).filter(b => b.userId === user.id).length;
      }

      // Total de fois où les bancs publiés par l'utilisateur ont été mis en favori
      // par la communauté (compteur global maintenu par trigger SQL).
      const favoritesReceived = myBenches.reduce((sum, b) => sum + (b.favoritesCount || 0), 0);

      return { myBenches, categoryCounts, favoritesCount, favoritesReceived, maxStreakDays, pioneerCitiesCount };
    }

    // Détermine le niveau actuel et le prochain niveau à débloquer, pour la barre de progression.
    function getTierProgress(count) {
      let currentTier = null;
      let nextTier = null;
      for (const tier of TIER_BADGES) {
        if (count >= tier.threshold) currentTier = tier;
        else { nextTier = tier; break; }
      }
      return { currentTier, nextTier };
    }

    // Renvoie l'ensemble des badges/sous-paliers actuellement débloqués (tous types confondus,
    // avec leurs métadonnées complètes : icon, label...). Chaque entrée porte un `notifyId`
    // unique servant de clé de suivi "déjà vu" : pour un badge à sous-paliers, chaque palier
    // (bronze, argent, or, platine) a son propre notifyId, afin qu'une progression d'un palier
    // au suivant redéclenche bien une nouvelle célébration. Utilisé par le détecteur global de
    // déblocage (au niveau de App), pour que la célébration puisse s'afficher quelle que soit
    // la page sur laquelle se trouve l'utilisateur au moment du déblocage.
    function getAllUnlockedBadges(benches, user) {
      const ctx = computeGamificationContext(benches, user);
      const totalCount = ctx.myBenches.length;
      const unlocked = [];
      TIER_BADGES.forEach(b => {
        if (totalCount >= b.threshold) unlocked.push({ ...b, notifyId: b.id });
      });
      [...CATEGORY_BADGES, ...QUALITY_BADGES].forEach(b => {
        const info = getBadgeTierInfo(b, ctx);
        if (info.current) {
          unlocked.push({ ...b, tierReached: info.current.tier, notifyId: `${b.id}:${info.current.tier}` });
        }
      });
      return unlocked;
    }

    // ============================================================
    // 3ter. Bandeau de déblocage de badge (icône + nom, auto-disparaît après 4s)
    // ============================================================
    const BADGE_BANNER_DURATION = 4000;

    function BadgeUnlockBanner({ badge, onClose }) {
      const [leaving, setLeaving] = useState(false);

      function startClosing() {
        setLeaving(true);
        setTimeout(onClose, 280); // laisse le temps à l'animation de sortie CSS de jouer
      }

      useEffect(() => {
        const t = setTimeout(startClosing, BADGE_BANNER_DURATION);
        return () => clearTimeout(t);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [badge.notifyId]);

      // Pour un badge à sous-paliers, on met en avant le palier atteint (icône + libellé
      // Bronze/Argent/Or/Platine) plutôt que le badge "brut".
      const tier = badge.tierReached ? tierMeta(badge.tierReached) : null;

      return (
        <div className="badge-banner-wrap">
          <div
            className={`badge-banner ${leaving ? 'leaving' : ''}`}
            role="status"
            aria-live="polite"
            onClick={startClosing}
          >
            <span className="badge-banner-icon">
              <BadgeIcon id={badge.id} icon={tier ? tier.icon : badge.icon} cls="badge-banner-art" />
            </span>
            <div className="badge-banner-text">
              <div className="badge-banner-title">{tier ? `Palier ${tier.label} débloqué` : 'Badge débloqué'}</div>
              <div className="badge-banner-name">{badge.label}</div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 3quater. COMPOSANT GamificationCard (profil)
    // ============================================================
    // Affiche le medaillon illustre d'un badge, ou son emoji en repli.
    function BadgeIcon({ id, icon, cls }) {
      const src = BADGE_ART[id];
      if (src) return <img src={src} className={cls} alt="" />;
      return <span className={cls === 'badge-art' ? 'badge-icon' : ''}>{icon}</span>;
    }

    function GamificationCard({ benches, user }) {
      const [openBadge, setOpenBadge] = useState(null); // badge affiché en détail (overlay)

      const ctx = useMemo(() => computeGamificationContext(benches, user), [benches, user]);
      const totalCount = ctx.myBenches.length;
      const { currentTier, nextTier } = useMemo(() => getTierProgress(totalCount), [totalCount]);

      const prevThreshold = currentTier ? currentTier.threshold : 0;
      const progressPct = nextTier
        ? Math.min(100, Math.round(((totalCount - prevThreshold) / (nextTier.threshold - prevThreshold)) * 100))
        : 100;

      function renderBadge(badge, unlocked) {
        return (
          <button
            key={badge.id}
            type="button"
            className={`badge-item ${unlocked ? '' : 'locked'}`}
            onClick={() => setOpenBadge({ ...badge, unlocked, tiered: false })}
          >
            <BadgeIcon id={badge.id} icon={badge.icon} cls="badge-art" />
            <span className="badge-label">{badge.label}</span>
          </button>
        );
      }

      // Rendu d'un badge à sous-paliers (Bronze → Argent → Or → Platine) : la pastille
      // sous le libellé indique le palier actuellement atteint, ou "Verrouillé" si aucun.
      function renderTieredBadge(badge) {
        const info = getBadgeTierInfo(badge, ctx);
        const tier = info.current ? tierMeta(info.current.tier) : null;
        return (
          <button
            key={badge.id}
            type="button"
            className={`badge-item ${tier ? 'tier-' + tier.key : 'locked'}`}
            onClick={() => setOpenBadge({ ...badge, tiered: true, info })}
          >
            <BadgeIcon id={badge.id} icon={badge.icon} cls="badge-art" />
            <span className="badge-label">{badge.label}</span>
            {tier ? (
              <span className={`badge-tier-pill tier-${tier.key}`}>{tier.icon} {tier.label}</span>
            ) : (
              <span className="badge-tier-pill tier-locked">🔒 Verrouillé</span>
            )}
          </button>
        );
      }

      return (
        <div className="gami-card">
          <div className="gami-tier-row">
            {currentTier
              ? <BadgeIcon id={currentTier.id} icon={currentTier.icon} cls="gami-tier-art" />
              : <span className="gami-tier-icon">🌱</span>}
            <div>
              <div className="gami-tier-name">{currentTier ? currentTier.label : 'Pas encore de banc ajouté'}</div>
              <div className="gami-tier-sub">{totalCount} banc{totalCount > 1 ? 's' : ''} ajouté{totalCount > 1 ? 's' : ''}</div>
            </div>
          </div>
          <div className="gami-progress-track">
            <div className="gami-progress-fill" style={ { width: `${progressPct}%` } } />
          </div>
          <div className="gami-progress-label">
            {nextTier ? `${totalCount}/${nextTier.threshold} vers "${nextTier.label}"` : 'Niveau maximum atteint 👑'}
          </div>

          <div className="gami-section-title">Niveaux</div>
          <div className="badge-grid">
            {TIER_BADGES.map(b => renderBadge(b, totalCount >= b.threshold))}
          </div>

          <div className="gami-section-title">Badges thématiques</div>
          <div className="badge-grid">
            {CATEGORY_BADGES.map(b => renderTieredBadge(b))}
          </div>

          <div className="gami-section-title">Qualité & interaction</div>
          <div className="badge-grid">
            {QUALITY_BADGES.map(b => renderTieredBadge(b))}
          </div>

          {openBadge && (
            <div className="badge-detail-overlay" onClick={() => setOpenBadge(null)}>
              <div className="badge-detail-card" onClick={(e) => e.stopPropagation()}>
                {openBadge.tiered ? (
                  <>
                    <div style={ { opacity: openBadge.info.current ? 1 : 0.4, filter: openBadge.info.current ? 'none' : 'grayscale(1) brightness(0.75)' } }>
                      <BadgeIcon id={openBadge.id} icon={openBadge.icon} cls="badge-detail-art" />
                    </div>
                    <div className="badge-detail-name">{openBadge.label}</div>
                    {openBadge.info.current ? (
                      <span className={`badge-tier-pill badge-detail-tier-pill tier-${openBadge.info.current.tier}`}>
                        {tierMeta(openBadge.info.current.tier).icon} Palier {tierMeta(openBadge.info.current.tier).label}
                      </span>
                    ) : (
                      <span className="badge-tier-pill badge-detail-tier-pill tier-locked">🔒 Aucun palier atteint</span>
                    )}
                    <div className="badge-detail-desc">{openBadge.info.value} {openBadge.descBase}</div>

                    <div className="badge-detail-progress-track">
                      <div className="badge-detail-progress-fill" style={ { width: `${openBadge.info.progressPct}%` } } />
                    </div>
                    <div className="badge-detail-progress-label">
                      {openBadge.info.next
                        ? `${openBadge.info.value}/${openBadge.info.next.threshold} vers le palier ${tierMeta(openBadge.info.next.tier).label}`
                        : 'Palier maximum atteint 💠'}
                    </div>

                    <div className="badge-detail-levels">
                      {openBadge.levels.map(lvl => {
                        const meta = tierMeta(lvl.tier);
                        const reached = openBadge.info.value >= lvl.threshold;
                        return (
                          <div key={lvl.tier} className={`badge-level-row ${reached ? 'reached' : ''}`}>
                            <span>{meta.icon} {meta.label}</span>
                            <span>{lvl.threshold}{reached && <span className="lvl-check">✓</span>}</span>
                          </div>
                        );
                      })}
                    </div>
                  </>
                ) : (
                  <>
                    <div style={ { opacity: openBadge.unlocked ? 1 : 0.4, filter: openBadge.unlocked ? 'none' : 'grayscale(1) brightness(0.75)' } }>
                      <BadgeIcon id={openBadge.id} icon={openBadge.icon} cls="badge-detail-art" />
                    </div>
                    <div className="badge-detail-name">{openBadge.label}</div>
                    <div className="badge-detail-desc">{openBadge.desc || `${openBadge.threshold} banc${openBadge.threshold > 1 ? 's' : ''} ajouté${openBadge.threshold > 1 ? 's' : ''}`}</div>
                    <div className={`badge-detail-status ${openBadge.unlocked ? 'unlocked' : 'locked'}`}>
                      {openBadge.unlocked ? '✓ Débloqué' : '🔒 Verrouillé'}
                    </div>
                  </>
                )}
                <button className="btn-secondary" style={ { width: '100%' } } onClick={() => setOpenBadge(null)}>Fermer</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const EMPTY_FORM = {
      name: '', location: '', category: 'parc', rating: 5,
      confort: 70, solidite: 70, comment: '',
      tags: [],
      lat: null, lng: null,

    // ============================================================
    // 4. COMPOSANT CARROUSEL
    // ============================================================
    function ImageCarousel({ images, altText }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const safeImages = images && images.length > 0 ? images : [
        "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80"
      ];
      const prevSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === 0 ? safeImages.length - 1 : prev - 1)); };
      const nextSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === safeImages.length - 1 ? 0 : prev + 1)); };
      const goToSlide = (index, e) => { e.stopPropagation(); setCurrentIndex(index); };
      return (
        <div className="card-media">
          <img src={safeImages[currentIndex]} alt={`${altText} - photo ${currentIndex + 1}`} className="carousel-img" />
          {safeImages.length > 1 && (
            <>
              <button className="carousel-btn prev" onClick={prevSlide} aria-label="Photo précédente">‹</button>
              <button className="carousel-btn next" onClick={nextSlide} aria-label="Photo suivante">›</button>
              <div className="carousel-dots">
                {safeImages.map((_, idx) => (
                  <button key={idx} className={`carousel-dot ${idx === currentIndex ? 'active' : ''}`} onClick={(e) => goToSlide(idx, e)} aria-label={`Aller à la photo ${idx + 1}`} />
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    // ============================================================
    // 5. COMPOSANT PRINCIPAL App
    // ============================================================

      // --- Préférences par défaut (persistées comme le thème) ---
      const [defaultView, setDefaultView] = useState(() => localStorage.getItem('mybench-default-view') || 'list');
      const [defaultSort, setDefaultSort] = useState(() => localStorage.getItem('mybench-default-sort') || 'note');
      const [toast, setToast] = useState(null);

      // --- Pour les stats utilisateur ---
      const [selectedUserPseudo, setSelectedUserPseudo] = useState(null);
      const [userStats, setUserStats] = useState(null);

      // --- Mode sombre ---
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('mybench-theme');
        if (saved) return saved === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // --- Autocomplétion de ville (formulaire d'ajout) ---
      const [citySuggestions, setCitySuggestions] = useState([]);
      const [citySearching, setCitySearching] = useState(false);
      const [showCitySuggestions, setShowCitySuggestions] = useState(false);
      const cityDebounceRef = useRef(null);
      const photoFilesRef = useRef({}); // { img1: File, img2: File, img3: File } — fichiers réels en attente d'upload vers Supabase Storage

      // --- Signalement d'un banc ---
      const [showReportForm, setShowReportForm] = useState(false);
      const [reportReason, setReportReason] = useState('');
      const [reportComment, setReportComment] = useState('');
      const [reportSubmitting, setReportSubmitting] = useState(false);

      // --- États "en cours d'envoi" (empêchent les doubles soumissions) ---
      const [authSubmitting, setAuthSubmitting] = useState(false);
      const [addSubmitting, setAddSubmitting] = useState(false);

      // --- Taille de texte (accessibilité) ---
      const [fontScale, setFontScale] = useState(() => localStorage.getItem('mybench-font-scale') || 'normal');

      // --- Rayon de recherche réglable ---
      const [searchRadiusKm, setSearchRadiusKm] = useState(null); // null = illimité

      // --- Filtres dédiés à la vue carte (indépendants des filtres de la liste) ---
      const [showMapFilters, setShowMapFilters] = useState(false);
      const [mapCategory, setMapCategory] = useState('tous');
      const [mapMinRating, setMapMinRating] = useState(0); // 0 = pas de filtre
      const [mapTags, setMapTags] = useState([]); // au moins un des tags sélectionnés
      const [mapFavoritesOnly, setMapFavoritesOnly] = useState(false);

      const pseudoDebounceRef = useRef(null);
      const pseudoCheckValueRef = useRef('');

      const menuRef = useRef(null);
      const mapInstance = useRef(null);
      const markersLayer = useRef(null);
      const userMarker = useRef(null);

      // ============================================================
      // 6. EFFETS : SESSION UTILISATEUR
      // ============================================================
      useEffect(() => {
        db.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setUser(session.user);
            checkUserProfile(session.user);
          }
        });
        const { data: authListener } = db.auth.onAuthStateChange(async (_event, session) => {
          if (session?.user) {
            setUser(session.user);
            await checkUserProfile(session.user);
          } else {
            setUser(null);
            setPseudo(null);
            setPseudoChanges(0);
            setIsLoggedIn(false);
            setShowPseudoPage(false);
          }
        });
        return () => authListener.subscription.unsubscribe();
      }, []);

      // Charge les bancs réels depuis Supabase une fois connecté
      useEffect(() => {
        if (isLoggedIn) loadBenches();
      }, [isLoggedIn]);

      // ============================================================
      // DÉTECTION GLOBALE DES NOUVEAUX BADGES DÉBLOQUÉS
      // ============================================================
      // Contrairement à une détection locale au composant Profil (qui ne se déclenche
      // que si on est déjà sur cette page), cet effet vit au niveau de App : il tourne
      // à chaque changement de la liste des bancs, quelle que soit la page affichée.
      // On compare les badges actuellement débloqués à l'historique connu (mémorisé en
      // localStorage, par compte) pour ne célébrer que les VRAIS nouveaux déblocages.
      useEffect(() => {
        if (!user || benchesLoading) return;
        try {
          const storageKey = `mybench-seen-badges-${user.id}`;

          // Première initialisation pour cet utilisateur : on charge son historique connu
          // (une seule fois par session, pas à chaque changement de bancs).
          if (seenBadgeIdsRef.current === null) {
            try {
              const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
              seenBadgeIdsRef.current = new Set(stored);
            } catch (err) {
              seenBadgeIdsRef.current = new Set();
            }
          }

          const unlockedNow = getAllUnlockedBadges(benches, user);
          const newlyUnlocked = unlockedNow.filter(b => !seenBadgeIdsRef.current.has(b.notifyId));

          if (newlyUnlocked.length > 0) {
            newlyUnlocked.forEach(b => seenBadgeIdsRef.current.add(b.notifyId));
            try {
              localStorage.setItem(storageKey, JSON.stringify(Array.from(seenBadgeIdsRef.current)));
            } catch (err) {
              console.error("Impossible d'enregistrer les badges vus (localStorage indisponible) :", err);
            }
            setCelebrationQueue(q => [...q, ...newlyUnlocked]);
          }
        } catch (err) {
          // Un souci dans la détection de badge ne doit jamais casser le reste de l'appli.
          console.error('Erreur lors de la détection des badges débloqués :', err);
        }
      }, [benches, user, benchesLoading]);

      // Réinitialise l'historique local à la déconnexion, pour repartir sur un état
      // neutre si un autre compte se connecte ensuite sur le même appareil.
      useEffect(() => {
        if (!user) seenBadgeIdsRef.current = null;
      }, [user]);

      function dismissCelebration() {
        setCelebrationQueue(q => q.slice(1));
      }

      async function loadBenches() {
        setBenchesLoading(true);

        // Supabase/PostgREST plafonne une requête à 1000 lignes par défaut : au-delà,
        // les bancs excédentaires disparaîtraient silencieusement. On récupère donc
        // les résultats page par page jusqu'à épuisement.
        // NB : on charge volontairement TOUS les bancs (et non une pagination
        // classique), car plusieurs fonctionnalités raisonnent sur l'ensemble du jeu
        // de données : marqueurs de la carte, statistiques, et surtout les badges
        // (le badge "Pionnier" compare l'utilisateur à tous les autres contributeurs).
        const PAGE = 1000;
        const MAX_PAGES = 20; // garde-fou : 20 000 bancs max, évite une boucle infinie
        let data = [];
        for (let page = 0; page < MAX_PAGES; page++) {
          const { data: chunk, error } = await db
            .from('benches')
            .select('*')
            .order('date_added', { ascending: false })
            .range(page * PAGE, page * PAGE + PAGE - 1);
          if (error) {
            showToast("Impossible de charger les bancs : " + error.message);
            setBenchesLoading(false);
            return;
          }
          data = data.concat(chunk || []);
          if (!chunk || chunk.length < PAGE) break; // dernière page atteinte
        }

        // Récupère les favoris propres à l'utilisateur actuellement connecté
        let favoriteIds = new Set();
        if (user) {
          const { data: favData, error: favError } = await db
            .from('favorites')
            .select('bench_id')
            .eq('user_id', user.id);
          if (favError) {
            console.error('Erreur récupération favoris:', favError);
          } else {
            favoriteIds = new Set((favData || []).map(f => f.bench_id));
          }
        }

        setBenches((data || []).map(row => ({
          id: row.id,
          name: row.name,
          location: row.location,
          lat: row.lat,
          lng: row.lng,
          category: row.category,
          rating: row.rating,
          comment: row.comment || '',
          criteria: { confort: row.confort, solidite: row.solidite },
          author: row.author,
          userId: row.user_id,
          tags: row.tags || [],
          dateAdded: row.date_added,
          favorite: favoriteIds.has(row.id),
          // Compteur global (tous utilisateurs), maintenu par trigger SQL sur la
          // table favorites. Vaut 0 si la migration favorites_count n'a pas encore
          // été appliquée (colonne absente => row.favorites_count === undefined).
          favoritesCount: row.favorites_count || 0,
          images: row.images || [],
        })));
        setBenchesLoading(false);
      }

      async function checkUserProfile(user) {
        if (!db) return;
        const { data, error } = await db.from('profiles').select('pseudo, pseudo_changes').eq('id', user.id).maybeSingle();
        if (error) {
          console.error('Erreur récupération profil:', error);
          return;
        }
        if (data?.pseudo) {
          setPseudo(data.pseudo);
          setPseudoChanges(data.pseudo_changes || 0);
          setIsLoggedIn(true);
          setShowPseudoPage(false);
        } else {
          setShowPseudoPage(true);
          setIsLoggedIn(false);
        }
      }

      // ============================================================
      // 7. AUTHENTIFICATION
      // ============================================================
      async function handleAuthSubmit(e) {
        e.preventDefault();
        if (authSubmitting) return; // Empêche un second envoi pendant que le premier est en cours
        setAuthError('');
        setAuthSuccess('');

        if (!email || !password) {
          setAuthError('Veuillez remplir tous les champs.');
          return;
        }

        if (!isValidEmail(email)) {
          setAuthError('L\'email doit contenir au moins 4 caractères avant le @ et un domaine valide (ex: abcd@domaine.com).');
          return;
        }

        setAuthSubmitting(true);
        try {
          if (authMode === 'login') {
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
              if (error.message.includes('Invalid login credentials')) {
                setAuthError('Email ou mot de passe incorrect.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            await checkUserProfile(data.user);
            setAuthSuccess('Connexion réussie !');
          } else if (authMode === 'register') {
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) {
              if (error.message.includes('User already registered')) {
                setAuthError('Désolé, cette adresse email est déjà utilisée.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            if (data.user) {
              setUser(data.user);
              setShowPseudoPage(true);
              setAuthSuccess('Inscription réussie ! Choisissez votre pseudo.');
            }
          } else if (authMode === 'forgot') {
            const { error } = await db.auth.resetPasswordForEmail(email);
            if (error) {
              setAuthError(error.message);
              return;
            }
            setAuthSuccess('Un email de réinitialisation a été envoyé à votre adresse.');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthSubmitting(false);
        }
      }

      // ============================================================
      // 8. GESTION DU PSEUDO
      // ============================================================
      async function isPseudoAvailable(pseudoToCheck) {
        const { data, error } = await db.from('profiles').select('pseudo').eq('pseudo', pseudoToCheck).maybeSingle();
        if (error) {
          console.error('Erreur vérification pseudo:', error);
          return false;
        }
        return !data;
      }

      async function handlePseudoChange(newPseudo) {
        setPseudo(newPseudo);
        pseudoCheckValueRef.current = newPseudo;
        setPseudoSuggestions([]);
        setSelectedSuggestion(null);
        setAuthError('');

        if (pseudoDebounceRef.current) clearTimeout(pseudoDebounceRef.current);
        if (!newPseudo.trim()) return;

        pseudoDebounceRef.current = setTimeout(async () => {
          const available = await isPseudoAvailable(newPseudo);
          // Si l'utilisateur a retapé entre-temps, ce résultat est obsolète : on l'ignore.
          if (pseudoCheckValueRef.current !== newPseudo) return;

          if (!available) {
            const suggestions = [];
            for (let i = 1; i <= 2; i++) {
              const candidate = newPseudo + i;
              const avail = await isPseudoAvailable(candidate);
              if (avail) suggestions.push(candidate);
            }
            // Nouvelle vérification après les appels ci-dessus, toujours pour éviter l'obsolescence.
            if (pseudoCheckValueRef.current !== newPseudo) return;
            setPseudoSuggestions(suggestions);
            setSelectedSuggestion(null);
            setAuthError('Ce pseudo est déjà pris. Voici quelques suggestions :');
          } else {
            setPseudoSuggestions([]);
            setSelectedSuggestion(null);
            setAuthError('');
          }
        }, 500);
      }

      // ============================================================
      // GESTION DU COMPTE (écran Paramètres)
      // ============================================================

      // Change le pseudo de l'utilisateur, dans la limite de 5 modifications.
      // L'identifiant du compte (user.id) n'est jamais touché : seule la colonne
      // `pseudo` de la table profiles change, et l'application répercute ensuite
      // ce nouveau nom sur la colonne `author` des bancs déjà publiés, pour que
      // les contributions passées restent attribuées au bon utilisateur.
      async function handleChangePseudo(e) {
        e.preventDefault();
        if (pseudoSaving) return;
        setPseudoMsg(null);

        const candidate = newPseudoInput.trim();
        if (!candidate) {
          setPseudoMsg({ type: 'error', text: 'Veuillez saisir un nouveau pseudo.' });
          return;
        }
        if (candidate === pseudo) {
          setPseudoMsg({ type: 'error', text: 'Ce pseudo est identique à l\'actuel.' });
          return;
        }
        if (candidate.length < 3) {
          setPseudoMsg({ type: 'error', text: 'Le pseudo doit faire au moins 3 caractères.' });
          return;
        }
        if (pseudoChanges >= PSEUDO_CHANGE_LIMIT) {
          setPseudoMsg({ type: 'error', text: 'Vous avez atteint la limite de 5 changements de pseudo.' });
          return;
        }

        setPseudoSaving(true);
        const available = await isPseudoAvailable(candidate);
        if (!available) {
          setPseudoSaving(false);
          setPseudoMsg({ type: 'error', text: 'Ce pseudo est déjà pris.' });
          return;
        }

        // Le compteur pseudo_changes est incrémenté côté serveur par un trigger :
        // on ne l'envoie donc pas ici, on le relit après coup.
        const { data, error } = await db
          .from('profiles')
          .update({ pseudo: candidate })
          .eq('id', user.id)
          .select('pseudo, pseudo_changes')
          .single();

        if (error) {
          setPseudoSaving(false);
          setPseudoMsg({ type: 'error', text: 'Erreur : ' + error.message });
          return;
        }

        // Répercussion sur les bancs déjà publiés (colonne `author`).
        const { error: benchErr } = await db
          .from('benches')
          .update({ author: candidate })
          .eq('user_id', user.id);
        if (benchErr) {
          console.error('Erreur mise à jour auteur des bancs:', benchErr);
          showToast("Pseudo changé, mais certains bancs affichent encore l'ancien nom.");
        }

        setPseudo(data.pseudo);
        setPseudoChanges(data.pseudo_changes || 0);
        setBenches(bs => bs.map(b => b.userId === user.id ? { ...b, author: candidate } : b));
        setNewPseudoInput('');
        setPseudoSaving(false);
        setPseudoMsg({
          type: 'ok',
          text: `Pseudo mis à jour. Il vous reste ${Math.max(0, PSEUDO_CHANGE_LIMIT - (data.pseudo_changes || 0))} changement(s).`
        });
      }

      // Change le mot de passe d'un utilisateur DÉJÀ connecté.
      // Supabase n'exige pas l'ancien mot de passe pour updateUser, mais on le
      // vérifie quand même via signInWithPassword : sans ça, un appareil laissé
      // déverrouillé permettrait à n'importe qui de changer le mot de passe.
      async function handleChangePassword(e) {
        e.preventDefault();
        if (pwdSaving) return;
        setPwdMsg(null);

        if (!currentPwd || !newPwd || !confirmPwd) {
          setPwdMsg({ type: 'error', text: 'Merci de remplir tous les champs.' });
          return;
        }
        if (newPwd.length < 6) {
          setPwdMsg({ type: 'error', text: 'Le nouveau mot de passe doit faire au moins 6 caractères.' });
          return;
        }
        if (newPwd !== confirmPwd) {
          setPwdMsg({ type: 'error', text: 'Les deux nouveaux mots de passe ne correspondent pas.' });
          return;
        }
        if (newPwd === currentPwd) {
          setPwdMsg({ type: 'error', text: 'Le nouveau mot de passe est identique à l\'actuel.' });
          return;
        }

        setPwdSaving(true);
        const { error: signInError } = await db.auth.signInWithPassword({
          email: user.email,
          password: currentPwd,
        });
        if (signInError) {
          setPwdSaving(false);
          setPwdMsg({ type: 'error', text: 'Mot de passe actuel incorrect.' });
          return;
        }

        const { error } = await db.auth.updateUser({ password: newPwd });
        setPwdSaving(false);
        if (error) {
          setPwdMsg({ type: 'error', text: 'Erreur : ' + error.message });
          return;
        }
        setCurrentPwd('');
        setNewPwd('');
        setConfirmPwd('');
        setPwdMsg({ type: 'ok', text: 'Mot de passe modifié avec succès.' });
      }

      // Supprime définitivement le compte via la fonction SQL delete_own_account
      // (security definer : le client n'a pas le droit de toucher à auth.users).
      // Les bancs publiés NE SONT PAS supprimés : la clé étrangère est en
      // "on delete set null", ils deviennent orphelins mais restent visibles,
      // avec le pseudo conservé dans la colonne `author`.
      async function handleDeleteAccount() {
        if (deletingAccount) return;
        if (deleteConfirmText.trim().toUpperCase() !== 'SUPPRIMER') {
          showToast('Tapez SUPPRIMER pour confirmer.');
          return;
        }
        setDeletingAccount(true);
        const { error } = await db.rpc('delete_own_account');
        if (error) {
          setDeletingAccount(false);
          showToast('Erreur lors de la suppression : ' + error.message);
          return;
        }
        await db.auth.signOut();
        setDeletingAccount(false);
        showToast('Votre compte a été supprimé. Vos bancs restent en ligne.');
      }

      // Relance une demande d'autorisation de localisation depuis les paramètres.
      function requestLocationPermission() {
        locateMe(false);
      }

      function updateDefaultView(v) {
        setDefaultView(v);
        localStorage.setItem('mybench-default-view', v);
      }

      function updateDefaultSort(s) {
        setDefaultSort(s);
        localStorage.setItem('mybench-default-sort', s);
      }

      async function handleSavePseudo(e) {
        e.preventDefault();
        let finalPseudo = pseudo;
        if (selectedSuggestion) {
          finalPseudo = selectedSuggestion;
          setPseudo(selectedSuggestion);
        }
        if (!finalPseudo.trim()) {
          setAuthError('Veuillez saisir un pseudo.');
          return;
        }

        const available = await isPseudoAvailable(finalPseudo);
        if (!available) {
          setAuthError('Ce pseudo est déjà pris. Veuillez en choisir un autre.');
          return;
        }

        const { error } = await db.from('profiles').upsert({ id: user.id, pseudo: finalPseudo.trim() });
        if (error) {
          setAuthError('Erreur lors de l\'enregistrement du pseudo : ' + error.message);
          return;
        }
        setPseudo(finalPseudo.trim());
        setIsLoggedIn(true);
        setShowPseudoPage(false);
        setAuthSuccess('Pseudo enregistré !');
      }

      // ============================================================
      // 9. FONCTIONS DE L'APPLICATION
      // ============================================================
      function showToast(msg) { setToast(msg); }

      async function handleLogout() {
        setMenuOpen(false);
        setSelectedBench(null);
        setConfirmingDelete(false);
        setShowAddForm(false);
        setView('list');
        setQuery('');
        setActiveCategory('tous');

        await db.auth.signOut();
        setUser(null);
        setPseudo(null);
        setPseudoChanges(0);
        setIsLoggedIn(false);
        setShowPseudoPage(false);
        setBenches([]);
        setBenchesLoading(true);
        setAuthMode('login');
        setEmail('');
        setPassword('');
        setAuthError('');
        setAuthSuccess('');
      }

      async function handleDeleteBench(benchId) {
        const bench = benches.find(b => b.id === benchId);
        const isAdmin = user && user.email === ADMIN_EMAIL;
        const isAuthor = user && bench && user.id === bench.userId;
        if (!user || (!isAdmin && !isAuthor)) {
          showToast("Tu ne peux supprimer que tes propres bancs.");
          return;
        }
        // Pas de window.confirm() ici : la confirmation se fait en amont, via le
        // bouton à 2 clics ("Supprimer" puis "Confirmer") côté appelant (fiche
        // détail ou carte grille). Éviter une double confirmation redondante.

        const { error } = await db.from('benches').delete().eq('id', benchId);
        if (error) {
          showToast("Erreur lors de la suppression : " + error.message);
        } else {
          setBenches(prev => prev.filter(b => b.id !== benchId));
          if (selectedBench && selectedBench.id === benchId) setSelectedBench(null);
          // La contrainte `on delete cascade` supprime déjà les signalements liés
          // côté base : on répercute la même chose côté UI pour éviter d'afficher
          // des signalements fantômes dans l'écran admin.
          setReports(rs => rs.filter(r => r.bench_id !== benchId));
          showToast("Banc supprimé avec succès.");
        }
      }

      function showUserStats(authorPseudo) {
        if (!authorPseudo) return;
        const userBenches = benches.filter(b => b.author === authorPseudo);
        const count = userBenches.length;
        const avg = count > 0 ? (userBenches.reduce((s, b) => s + b.rating, 0) / count).toFixed(1) : 0;
        setUserStats({ pseudo: authorPseudo, count, avg });
        setSelectedUserPseudo(authorPseudo);
      }

      // ============================================================
      // 10. COMPOSANT BenchCard (avec pseudo cliquable)
      // ============================================================
      function BenchCard({ item, isMostFavorited }) {
        const recent = (Date.now() - new Date(item.dateAdded).getTime()) < 3 * 86400000;
        const isAdmin = user && user.email === ADMIN_EMAIL;
        // Confirmation à 2 clics locale à CETTE carte (état propre à chaque instance de
        // BenchCard, donc jamais partagée entre deux bancs différents) : remplace l'ancien
        // window.confirm() natif, redondant avec le mécanisme déjà utilisé en fiche détail.
        const [confirmingCardDelete, setConfirmingCardDelete] = useState(false);
        // Désarme automatiquement après quelques secondes d'inactivité : une fois armé,
        // un second clic supprime immédiatement, donc il faut un moyen d'annuler sans
        // avoir à re-cliquer sur "Supprimer" (ce qui déclencherait la suppression).
        useEffect(() => {
          if (!confirmingCardDelete) return;
          const t = setTimeout(() => setConfirmingCardDelete(false), 4000);
          return () => clearTimeout(t);
        }, [confirmingCardDelete]);

        return (
          <div className="bench-card" onClick={() => setSelectedBench(item)}>
            <div style={ { position: 'relative' } }>
              <ImageCarousel images={item.images} altText={item.name} />
              <button
                className={`heart-btn ${item.favorite ? 'is-fav' : ''}`}
                onClick={(e) => toggleFavorite(item.id, e)}
                aria-label={item.favorite ? "Retirer des favoris" : "Ajouter aux favoris"}
              >
                {item.favorite ? '❤️' : '🤍'}
              </button>
              {recent && <div className="card-badge-moment">Nouveau</div>}
              <div className="score-ring">
                <span className="score-ring-num">{item.rating}</span>
                <span className="score-ring-label">Note</span>
              </div>
              {isMostFavorited && <div className="card-badge-favorite">❤️ Coup de cœur</div>}
              {isAdmin && (
                <button
                  className={`admin-delete-btn ${confirmingCardDelete ? 'confirming' : ''}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    if (confirmingCardDelete) {
                      handleDeleteBench(item.id);
                    } else {
                      setConfirmingCardDelete(true);
                    }
                  }}
                >
                  {confirmingCardDelete ? '🗑️ Confirmer ?' : '🗑️ Supprimer'}
                </button>
              )}
            </div>
            <div className="card-body">
              <div className="card-top">
                <div className="card-name">{item.name}</div>
                <div className="card-rating">
                  <span className="stars">{starsFor(item.rating)}</span>
                  <span className="rating-num">{item.rating}</span>
                </div>
              </div>
              {item.comment && <div className="card-comment">"{item.comment}"</div>}
              <div className="card-criteria">
                <div className="crit-row">
                  <span className="crit-label">Confort</span>
                  <div className="crit-bar-wrap">
                    <div className="crit-bar"><div className="crit-fill" style={ { width: item.criteria.confort + '%' } }></div></div>
                    <span className="crit-val">{item.criteria.confort}%</span>
                  </div>
                </div>
                <div className="crit-row">
                  <span className="crit-label">Solidité</span>
                  <div className="crit-bar-wrap">
                    <div className="crit-bar"><div className="crit-fill" style={ { width: item.criteria.solidite + '%' } }></div></div>
                    <span className="crit-val">{item.criteria.solidite}%</span>
                  </div>
                </div>
              </div>
              {item.tags && item.tags.length > 0 && (
                <div className="card-tags">
                  {item.tags.map((tag, idx) => <span className="tag" key={idx}>{tag}</span>)}
                </div>
              )}
              <div className="card-footer">
                <span className="card-author">
                  Par{' '}
                  <strong
                    className="clickable-pseudo"
                    onClick={(e) => {
                      e.stopPropagation();
                      showUserStats(item.author);
                    }}
                  >
                    {item.author}
                  </strong>
                </span>
                <span className="card-location">📍 {item.location}</span>
              </div>
            </div>
          </div>
        );
      }

      // ============================================================
      // 11. AUTRES COMPOSANTS
      // ============================================================
      function EmptyState({ icon, title, text }) {
        return (
          <div className="empty-state">
            <div className="empty-icon">{icon}</div>
            <div className="empty-title">{title}</div>
            <div className="empty-text">{text}</div>
          </div>
        );
      }

      function Pagination() {
        if (totalPages <= 1) return null;
        return (
          <div className="pagination">
            <button className="page-btn" disabled={pageSafe === 1} onClick={() => setPage(p => Math.max(1, p - 1))}>←</button>
            {Array.from({ length: totalPages }, (_, i) => i + 1).map(n => (
              <button key={n} className={`page-btn ${n === pageSafe ? 'active' : ''}`} onClick={() => setPage(n)}>{n}</button>
            ))}
            <button className="page-btn" disabled={pageSafe === totalPages} onClick={() => setPage(p => Math.min(totalPages, p + 1))}>→</button>
          </div>
        );
      }

      // ============================================================
      // 12. LOGIQUE DE FILTRE, TRI, MAP
      // ============================================================
      useEffect(() => {
        const onClick = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') {
            setMenuOpen(false);
            setSelectedBench(null);
            setConfirmingDelete(false);
            setShowAddForm(false);
            setSelectedUserPseudo(null);
            setUserStats(null);
            setShowCitySuggestions(false);
            setShowReportForm(false);
            setShowMapFilters(false);
          }
        };
        document.addEventListener("mousedown", onClick);
        document.addEventListener("keydown", onKey);
        return () => {
          document.removeEventListener("mousedown", onClick);
          document.removeEventListener("keydown", onKey);
        };
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      // Applique le thème sur toute la page (via l'attribut data-theme sur <html>,
      // que tout le CSS écoute grâce aux variables --bg/--surface/--ink etc.)
      // et retient le choix de l'utilisateur pour sa prochaine visite.
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('mybench-theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      // La taille de texte ajuste la taille de police de la page <html> :
      // comme presque toutes les tailles du site sont en "rem" (relatives à cette base),
      // tout le texte de l'application s'agrandit ou se réduit proportionnellement.
      useEffect(() => {
        const sizes = { petit: '87.5%', normal: '100%', grand: '115%' };
        document.documentElement.style.fontSize = sizes[fontScale] || sizes.normal;
        localStorage.setItem('mybench-font-scale', fontScale);
      }, [fontScale]);

      useEffect(() => { setPage(1); }, [query, activeCategory, sortBy, view]);

      const baseList = view === 'favoris' ? benches.filter(b => b.favorite)
        : view === 'contributions' ? benches.filter(b => user && b.userId === user.id)
        : benches;
      const filteredSorted = useMemo(() => {
        let out = baseList;
        if (view === 'list') {
          if (query.trim()) {
            const q = query.trim().toLowerCase();
            out = out.filter(b => b.name.toLowerCase().includes(q) || b.location.toLowerCase().includes(q));
          }
          if (activeCategory !== 'tous') {
            out = out.filter(b => b.category === activeCategory);
          }
          if (searchRadiusKm != null && userLocation) {
            out = out.filter(b => b.lat != null && b.lng != null && haversineKm(userLocation, b) <= searchRadiusKm);
          }
          out = [...out];
          if (sortBy === 'note') out.sort((a, b) => b.rating - a.rating);
          else if (sortBy === 'recent') out.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
          else if (sortBy === 'distance') {
            if (userLocation) {
              out.sort((a, b) => {
                const da = (a.lat != null) ? haversineKm(userLocation, a) : Infinity;
                const db = (b.lat != null) ? haversineKm(userLocation, b) : Infinity;
                return da - db;
              });
            } else {
              out.sort((a, b) => a.location.localeCompare(b.location));
            }
          }
        }
        return out;
      }, [baseList, query, activeCategory, sortBy, userLocation, view, searchRadiusKm]);

      const totalPages = Math.max(1, Math.ceil(filteredSorted.length / PAGE_SIZE));
      const pageSafe = Math.min(page, totalPages);
      const pageItems = filteredSorted.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
      const avgRating = benches.length ? (benches.reduce((s, b) => s + b.rating, 0) / benches.length).toFixed(1) : 0;

      // --- Filtrage dédié à la vue carte ---
      const mapFilteredBenches = useMemo(() => {
        return benches.filter(b => {
          if (b.lat == null || b.lng == null) return false;
          if (mapCategory !== 'tous' && b.category !== mapCategory) return false;
          if (mapMinRating > 0 && b.rating < mapMinRating) return false;
          if (mapTags.length > 0 && !(b.tags || []).some(t => mapTags.includes(t))) return false;
          if (mapFavoritesOnly && !b.favorite) return false;
          return true;
        });
      }, [benches, mapCategory, mapMinRating, mapTags, mapFavoritesOnly]);

      const activeMapFilterCount =
        (mapCategory !== 'tous' ? 1 : 0) +
        (mapMinRating > 0 ? 1 : 0) +
        (mapTags.length > 0 ? 1 : 0) +
        (mapFavoritesOnly ? 1 : 0);

      function toggleMapTag(tag) {
        setMapTags(tags => tags.includes(tag) ? tags.filter(t => t !== tag) : [...tags, tag]);
      }

      function resetMapFilters() {
        setMapCategory('tous');
        setMapMinRating(0);
        setMapTags([]);
        setMapFavoritesOnly(false);
      }

      // Identifiants des bancs les plus enregistrés en favori, tous utilisateurs
      // confondus (badge "Coup de cœur"). En cas d'égalité au sommet, tous les
      // bancs ex-aequo reçoivent le badge. Aucun badge si aucun banc n'a de favori.
      const topFavoriteIds = useMemo(() => {
        if (!benches.length) return new Set();
        const max = benches.reduce((m, b) => Math.max(m, b.favoritesCount || 0), 0);
        if (max <= 0) return new Set();
        return new Set(benches.filter(b => (b.favoritesCount || 0) === max).map(b => b.id));
      }, [benches]);

      // Bancs récemment ajoutés, tous filtres/recherche confondus (contrairement
      // à filteredSorted) : on veut toujours montrer les vrais derniers ajouts,
      // indépendamment de ce que l'utilisateur est en train de filtrer.
      // Section "Ajoutes recemment" : strictement limitee aux bancs publies
      // dans les 24 dernieres heures. La section disparait d'elle-meme quand
      // aucun banc ne remplit ce critere (le rendu teste deja length > 0).
      const RECENT_WINDOW_MS = 24 * 60 * 60 * 1000;
      const recentlyAdded = useMemo(() => {
        const since = Date.now() - RECENT_WINDOW_MS;
        return benches
          .filter(b => new Date(b.dateAdded).getTime() >= since)
          .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))
          .slice(0, 8);
      }, [benches]);

      // Leaflet
      useEffect(() => {
        if (view !== 'map') return;

        // Leaflet calcule et met en cache la taille de son conteneur à
        // l'initialisation : si l'utilisateur tourne sa tablette (portrait <->
        // paysage) ou si la barre d'adresse du navigateur apparaît/disparaît
        // (ce qui change la hauteur réelle de .map-wrap via calc(100dvh - ...)
        // sans que le composant React ne se remonte), il faut explicitement lui
        // redemander de recalculer sa taille — sinon la carte reste mal
        // dimensionnée, voire grisée/invisible.
        function fixMapSize() {
          if (mapInstance.current) mapInstance.current.invalidateSize();
        }

        const t = setTimeout(() => {
          if (!mapInstance.current && document.getElementById('map-container')) {
            const worldBounds = L.latLngBounds([-89, -180], [89, 180]);
            mapInstance.current = L.map('map-container', {
              zoomControl: true,
              minZoom: 2,
              maxZoom: 18,
              maxBounds: worldBounds,
              maxBoundsViscosity: 1.0,
              worldCopyJump: false,
            }).setView([46.6, 2.4], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              minZoom: 2,
              maxZoom: 18,
              noWrap: true,
              bounds: worldBounds,
              detectRetina: true,
              attribution: '&copy; OpenStreetMap'
            }).addTo(mapInstance.current);
            markersLayer.current = L.layerGroup().addTo(mapInstance.current);
          }
          fixMapSize();
          renderMarkers();
          // Filet de sécurité : sur certaines tablettes, la mise en page n'a pas
          // toujours fini de se stabiliser au moment de ce premier appel
          // (barre d'adresse encore en mouvement, rotation en cours...). On
          // revérifie la taille un peu plus tard, une fois le layout stabilisé.
          setTimeout(fixMapSize, 400);
        }, 100);

        window.addEventListener('resize', fixMapSize);
        window.addEventListener('orientationchange', fixMapSize);

        return () => {
          clearTimeout(t);
          window.removeEventListener('resize', fixMapSize);
          window.removeEventListener('orientationchange', fixMapSize);
          if (mapInstance.current) {
            mapInstance.current.remove();
            mapInstance.current = null;
          }
        };
        // Dépendances : en plus de `view`, on écoute les écrans qui court-circuitent
        // le rendu de l'application principale (splash au lancement, écran de
        // connexion, choix du pseudo). Sans cela, si la vue par défaut est "Carte",
        // cet effet se déclencherait dès le montage — alors que seul le splash est
        // affiché et que #map-container n'existe pas encore dans le DOM. L'init
        // échouerait silencieusement, et comme `view` ne changerait jamais ensuite,
        // l'effet ne serait pas rejoué : la carte resterait définitivement vide.
      }, [view, showSplash, isLoggedIn, showPseudoPage]);

      useEffect(() => {
        if (view === 'map' && mapInstance.current) renderMarkers();
      }, [mapFilteredBenches]);

      function renderMarkers() {
        if (!markersLayer.current) return;
        markersLayer.current.clearLayers();
        const withCoords = mapFilteredBenches;
        withCoords.forEach(b => {
          const icon = L.divIcon({
            className: '',
            html: `<div style="width:42px;height:42px;background:#1d3d2c;border:2px solid #f2c97e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(28,23,18,0.35);"><img src="${benchImageSrc}" style="width:26px;height:26px;object-fit:contain;transform:rotate(45deg);"/></div>`,
            iconSize: [42, 42],
            iconAnchor: [21, 40]
          });
          const m = L.marker([b.lat, b.lng], { icon }).addTo(markersLayer.current);
          m.on('click', () => setSelectedBench(b));
        });
        if (withCoords.length && mapInstance.current) {
          const bounds = L.latLngBounds(withCoords.map(b => [b.lat, b.lng]));
          mapInstance.current.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
        }
      }

      function locateMe(forSort) {
        if (!navigator.geolocation) {
          showToast("Localisation non disponible sur cet appareil");
          return;
        }
        setLocationStatus('pending');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setUserLocation(loc);
            setLocationStatus('granted');
            if (mapInstance.current) {
              mapInstance.current.flyTo([loc.lat, loc.lng], 12);
              if (userMarker.current) userMarker.current.remove();
              userMarker.current = L.circleMarker([loc.lat, loc.lng], {
                radius: 8, color: '#b8813a', fillColor: '#f2c97e', fillOpacity: 0.9, weight: 2
              }).addTo(mapInstance.current);
            }
            if (forSort) showToast("Tri par distance activé");
          },
          () => {
            setLocationStatus('denied');
            showToast("Localisation refusée ou indisponible");
          },
          { timeout: 8000 }
        );
      }

      function handleSortClick(key) {
        setSortBy(key);
        if (key === 'distance' && !userLocation) locateMe(true);
      }

      function handleRadiusClick(km) {
        setSearchRadiusKm(km);
        if (km != null && !userLocation) locateMe(true);
      }

      async function toggleFavorite(id, e) {
        if (e) e.stopPropagation();
        if (!user) {
          showToast("Connectez-vous pour gérer vos favoris");
          return;
        }

        const bench = benches.find(b => b.id === id);
        const wasFavorite = !!(bench && bench.favorite);
        // Le compteur global évolue dans le même sens que le favori local (+1 à
        // l'ajout, -1 au retrait) : c'est une approximation optimiste (les autres
        // utilisateurs ne voient pas ce +1/-1 en direct sans re-fetch), mais elle
        // reste exacte pour l'utilisateur courant après confirmation serveur, et le
        // trigger SQL garantit la valeur réelle au prochain chargement. Le rollback
        // applique le delta inverse pour annuler exactement la mise à jour optimiste.
        const delta = wasFavorite ? -1 : 1;
        const applyDelta = (count, d) => Math.max(0, (count || 0) + d);

        // Mise à jour optimiste de l'UI
        setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: !wasFavorite, favoritesCount: applyDelta(b.favoritesCount, delta) } : b));
        setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: !wasFavorite, favoritesCount: applyDelta(sb.favoritesCount, delta) } : sb);

        if (wasFavorite) {
          const { error } = await db.from('favorites').delete().eq('user_id', user.id).eq('bench_id', id);
          if (error) {
            console.error('Erreur suppression favori:', error);
            showToast("Erreur lors de la mise à jour des favoris");
            // Rollback en cas d'échec : on applique le delta inverse
            setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: wasFavorite, favoritesCount: applyDelta(b.favoritesCount, -delta) } : b));
            setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: wasFavorite, favoritesCount: applyDelta(sb.favoritesCount, -delta) } : sb);
          }
        } else {
          const { error } = await db.from('favorites').insert({ user_id: user.id, bench_id: id });
          if (error) {
            console.error('Erreur ajout favori:', error);
            showToast("Erreur lors de la mise à jour des favoris");
            // Rollback en cas d'échec : on applique le delta inverse
            setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: wasFavorite, favoritesCount: applyDelta(b.favoritesCount, -delta) } : b));
            setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: wasFavorite, favoritesCount: applyDelta(sb.favoritesCount, -delta) } : sb);
          }
        }
      }

      // Construit un lien Google Maps : itinéraire précis si on a des coordonnées GPS,
      // sinon une simple recherche par nom + ville.
      function getMapsUrl(bench) {
        if (bench.lat != null && bench.lng != null) {
          return `https://www.google.com/maps/dir/?api=1&destination=${bench.lat},${bench.lng}`;
        }
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(bench.name + ', ' + bench.location)}`;
      }

      // Partage un banc : utilise le partage natif du téléphone si disponible,
      // sinon copie un texte + lien dans le presse-papiers.
      async function shareBench(bench) {
        const shareText = `${bench.name} — ${bench.location} (${bench.rating}/5) sur My Bench`;
        const shareUrl = window.location.href;
        if (navigator.share) {
          try {
            await navigator.share({ title: bench.name, text: shareText, url: shareUrl });
          } catch (err) {
            // L'utilisateur a annulé le partage : on ne fait rien.
          }
        } else if (navigator.clipboard) {
          try {
            await navigator.clipboard.writeText(`${shareText} — ${shareUrl}`);
            showToast('Lien copié dans le presse-papiers !');
          } catch (err) {
            showToast("Impossible de copier le lien.");
          }
        } else {
          showToast("Le partage n'est pas disponible sur cet appareil.");
        }
      }

      // --- Signalement d'un banc ---
      function openReportForm() {
        setReportReason('');
        setReportComment('');
        setShowReportForm(true);
      }

      function closeReportForm() {
        setShowReportForm(false);
        setReportReason('');
        setReportComment('');
      }

      async function handleReportSubmit(e) {

          return;

      // --- Écran admin : chargement et traitement des signalements ---
      // Les policies RLS de la table `reports` limitent déjà la lecture à l'admin :
      // un utilisateur normal qui appellerait cette fonction recevrait une liste vide.
      async function loadReports() {
        setReportsLoading(true);
        const { data, error } = await db
          .from('reports')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) {
          console.error('Erreur chargement signalements:', error);
          showToast("Impossible de charger les signalements : " + error.message);
          setReports([]);
        } else {
          setReports(data || []);
        }
        setReportsLoading(false);
