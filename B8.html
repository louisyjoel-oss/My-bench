      // Charge (ou recharge) les signalements à l'ouverture de l'écran admin.
      // Également chargés dès la connexion de l'admin, pour que le compteur du
      // menu utilisateur soit correct sans avoir à ouvrir la page.
      useEffect(() => {
        if (!isAdminUser) { setReports([]); return; }
        if (view === 'signalements' || reports.length === 0) loadReports();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [view, isAdminUser]);

      // "Traiter" un signalement = le supprimer de la table (il n'y a pas de colonne
      // de statut : une fois l'action faite, la ligne n'a plus de raison d'exister).
      async function dismissReport(reportId) {
        const { error } = await db.from('reports').delete().eq('id', reportId);
        if (error) {
          showToast("Erreur : " + error.message);
          return;
        }
        setReports(rs => rs.filter(r => r.id !== reportId));
        setConfirmingReportId(null);
        showToast("Signalement traité.");
      }

      // Ouvre la fiche du banc concerné par un signalement, pour pouvoir l'examiner
      // (et le supprimer depuis la fiche si nécessaire).
      function openReportedBench(benchId) {
        const bench = benches.find(b => b.id === benchId);
        if (!bench) {
          showToast("Ce banc a déjà été supprimé.");
          return;
        }
        setSelectedBench(bench);
      }

      function openAddForm() {
        setFormData(EMPTY_FORM);
        setFormError('');
        setCitySuggestions([]);
        setShowCitySuggestions(false);
        photoFilesRef.current = {};
        setShowAddForm(true);
      }

      // Gestion des fichiers photo.
      // On garde un aperçu local en base64 (juste pour l'affichage, jamais envoyé en DB),
      // et on conserve le fichier brut à part : c'est LUI qui sera envoyé à Supabase Storage
      // au moment de la soumission du formulaire (voir uploadBenchPhotos).
      // Redimensionne et recompresse une photo AVANT envoi.
      // Une photo de smartphone moderne pèse 3 à 8 Mo : en 4G dans un parc, l'envoi
      // peut échouer ou traîner, et le stockage Supabase se remplit vite. On ramène
      // ici l'image à 1600px sur son plus grand côté, en JPEG qualité 0.8, ce qui
      // divise typiquement le poids par 10 sans perte visible à l'écran.
      const PHOTO_MAX_SIZE = 1600;
      const PHOTO_QUALITY = 0.8;

      function compressPhoto(file) {
        return new Promise((resolve) => {
          // Les formats non-image (ou exotiques) sont renvoyés tels quels :
          // mieux vaut envoyer l'original que de risquer un fichier corrompu.
          if (!file.type.startsWith('image/')) { resolve(file); return; }

          const reader = new FileReader();
          reader.onerror = () => resolve(file);
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => resolve(file);
            img.onload = () => {
              let { width, height } = img;
              if (width > PHOTO_MAX_SIZE || height > PHOTO_MAX_SIZE) {
                const ratio = Math.min(PHOTO_MAX_SIZE / width, PHOTO_MAX_SIZE / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }
              try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob(
                  (blob) => {
                    // On ne garde la version compressée que si elle est réellement
                    // plus légère (une petite image déjà optimisée peut grossir).
                    if (!blob || blob.size >= file.size) { resolve(file); return; }
                    resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', {
                      type: 'image/jpeg',
                      lastModified: Date.now(),
                    }));
                  },
                  'image/jpeg',
                  PHOTO_QUALITY
                );
              } catch (err) {
                console.error('Compression impossible, envoi de l\'original:', err);
                resolve(file);
              }
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function handlePhotoFile(index, file) {
        const key = `img${index + 1}`;
        if (!file) {
          // Supprimer l'image si aucun fichier sélectionné
          setFormData(f => ({ ...f, [key]: '' }));
          delete photoFilesRef.current[key];
          return;
        }
        const optimized = await compressPhoto(file);
        photoFilesRef.current[key] = optimized;
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(f => ({ ...f, [key]: reader.result }));
        };
        reader.readAsDataURL(optimized);
      }

      // Envoie les fichiers photo en attente vers le bucket Supabase Storage "bench-photos"
      // et renvoie la liste des URLs publiques, dans l'ordre img1/img2/img3.
      // NB : le bucket doit exister et être configuré en lecture publique côté Supabase.
      async function uploadBenchPhotos(userId) {
        const keys = ['img1', 'img2', 'img3'];
        const urls = [];
        for (const key of keys) {
          const file = photoFilesRef.current[key];
          if (!file) continue;
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
          const path = `${userId}/${Date.now()}-${key}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
          const { error: uploadError } = await db.storage.from('bench-photos').upload(path, file, {
            cacheControl: '3600',
            upsert: false,
          });
          if (uploadError) {
            throw new Error(`Échec de l'envoi de la photo (${key}) : ${uploadError.message}`);
          }
          const { data: publicUrlData } = db.storage.from('bench-photos').getPublicUrl(path);
          urls.push(publicUrlData.publicUrl);
        }
        return urls;
      }

      // ============================================================
      // ACCÈS NOMINATIM (OpenStreetMap) — conformité à la politique d'usage
      // ============================================================
      // Nominatim impose : une identification de l'application, et au maximum
      // 1 requête par seconde. Le navigateur INTERDIT de définir un en-tête
      // User-Agent depuis JavaScript (il est réservé au navigateur), donc on
      // s'identifie via le paramètre `email`, prévu pour cet usage par Nominatim.
      // On ajoute par-dessus une file d'attente qui espace réellement les appels
      // d'une seconde, et un cache pour ne jamais redemander deux fois la même
      // chose (l'autocomplétion, très bavarde, en bénéficie directement).
      const NOMINATIM_CONTACT = ADMIN_EMAIL; // identifie l'app auprès d'OSM
      const nominatimCache = useRef(new Map());
      const nominatimLastCall = useRef(0);

      async function nominatimFetch(endpoint, params) {
        const search = new URLSearchParams({
          ...params,
          format: 'json',
          email: NOMINATIM_CONTACT,
        }).toString();
        const url = `https://nominatim.openstreetmap.org/${endpoint}?${search}`;

        if (nominatimCache.current.has(url)) {
          return nominatimCache.current.get(url);
        }

        // Espacement d'au moins 1 seconde entre deux appels effectifs.
        const since = Date.now() - nominatimLastCall.current;
        if (since < 1000) {
          await new Promise(r => setTimeout(r, 1000 - since));
        }
        nominatimLastCall.current = Date.now();

        const res = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
        if (!res.ok) throw new Error('Nominatim HTTP ' + res.status);
        const json = await res.json();

        // Cache borné : au-delà de 100 entrées, on repart de zéro plutôt que de
        // laisser la mémoire croître indéfiniment sur une longue session.
        if (nominatimCache.current.size > 100) nominatimCache.current.clear();
        nominatimCache.current.set(url, json);
        return json;
      }

      // Géocode une adresse/ville texte en coordonnées lat/lng via Nominatim (OpenStreetMap)
      async function geocodeLocation(query) {
        try {
          const results = await nominatimFetch('search', { limit: '1', q: query });
          if (results && results.length > 0) {
            return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
          }
        } catch (err) {
          console.error('Erreur géocodage:', err);
        }
        return null;
      }

      // Géocodage inversé : convertit des coordonnées lat/lng en un libellé de
      // ville lisible via Nominatim. Utilisé pour pré-remplir automatiquement le
      // champ Ville quand l'utilisateur valide le formulaire uniquement via sa
      // position GPS, sans jamais avoir tapé de nom de ville.
      async function reverseGeocodeLocation(lat, lng) {
        try {
          const result = await nominatimFetch('reverse', {
            lat: String(lat),
            lon: String(lng),
            zoom: '14',
            addressdetails: '1',
          });
          if (!result) return null;
          const addr = result.address || {};
          const city = addr.city || addr.town || addr.village || addr.municipality || addr.county;
          if (city && addr.country) return `${city}, ${addr.country}`;
          return result.display_name || null;
        } catch (err) {
          console.error('Erreur géocodage inversé:', err);
          return null;
        }
      }

      // Appelle Nominatim pour proposer jusqu'à 4 villes correspondant au texte tapé.
      async function fetchCitySuggestions(text) {
        if (!text || text.trim().length < 2) {
          setCitySuggestions([]);
          setShowCitySuggestions(false);
          return;
        }
        setCitySearching(true);
        try {
          const results = await nominatimFetch('search', {
            addressdetails: '1',
            limit: '4',
            q: text.trim(),
          });
          setCitySuggestions((results || []).slice(0, 4).map(r => ({
            label: r.display_name,
            lat: parseFloat(r.lat),
            lng: parseFloat(r.lon),
          })));
          setShowCitySuggestions(true);
        } catch (err) {
          console.error('Erreur autocomplétion ville:', err);
          setCitySuggestions([]);
        } finally {
          setCitySearching(false);
        }
      }

      // On attend 400ms après la dernière frappe avant d'interroger Nominatim,
      // pour ne pas envoyer une requête à chaque lettre tapée.
      function handleLocationInputChange(value) {
        // On efface les coordonnées précédentes : tant que l'utilisateur n'a pas
        // choisi une nouvelle suggestion (ou n'a pas cliqué sur "Ma position"),
        // le texte tapé ne correspond plus forcément à une position connue.
        setFormData(f => ({ ...f, location: value, lat: null, lng: null }));
        if (cityDebounceRef.current) clearTimeout(cityDebounceRef.current);
        cityDebounceRef.current = setTimeout(() => fetchCitySuggestions(value), 400);
      }

      // Quand l'utilisateur choisit une suggestion, on récupère directement ses coordonnées :
      // plus besoin de re-géocoder au moment de l'envoi du formulaire, c'est plus fiable.
      function selectCitySuggestion(suggestion) {
        setFormData(f => ({ ...f, location: suggestion.label, lat: suggestion.lat, lng: suggestion.lng }));
        setCitySuggestions([]);
        setShowCitySuggestions(false);
      }

      async function handleAddSubmit(e) {
        e.preventDefault();
        if (addSubmitting) return; // Empêche l'ajout en double si on clique deux fois
        const hasPosition = formData.lat != null && formData.lng != null;
        if (!formData.name.trim()) {
          setFormError("Le nom du banc est obligatoire.");
          return;
        }
        // La ville n'est obligatoire que si aucune position GPS n'a été enregistrée :
        // avec une position, il n'y a plus besoin de la renseigner pour valider.
        if (!formData.location.trim() && !hasPosition) {
          setFormError("Merci d'indiquer une ville, ou d'utiliser ta position actuelle.");
          return;
        }
        // Vérifier qu'au moins une photo est présente
        const hasAtLeastOnePhoto = ['img1', 'img2', 'img3'].some(key => photoFilesRef.current[key]);
        if (!hasAtLeastOnePhoto) {
          setFormError("Veuillez ajouter au moins une photo.");
          return;
        }

        setAddSubmitting(true);
        try {
          // On envoie d'abord les photos vers Supabase Storage : la base ne stocke
          // plus que des URLs publiques, jamais de base64 (ça évitait de saturer Postgres).
          const finalImages = await uploadBenchPhotos(user.id);
          // Si on n'a pas déjà des coordonnées (via géolocalisation GPS),
          // on géocode le texte saisi dans le champ "Ville" pour pouvoir
          // placer le banc sur la carte.
          let finalLat = formData.lat;
          let finalLng = formData.lng;
          if (finalLat == null || finalLng == null) {
            const geo = await geocodeLocation(formData.location.trim());
            if (geo) {
              finalLat = geo.lat;
              finalLng = geo.lng;
            } else {
              showToast("Ville introuvable : le banc sera ajouté sans position sur la carte");
            }
          }

          // Repli si la ville est restée vide (position GPS utilisée sans que le
          // géocodage inversé n'ait réussi à la pré-remplir, ex. hors-ligne) :
          // la colonne `location` reste obligatoire en base, donc on affiche les
          // coordonnées à la place d'un champ vide.
          const finalLocation = formData.location.trim()
            || (hasPosition ? `Position GPS (${formData.lat.toFixed(4)}, ${formData.lng.toFixed(4)})` : '');

          const authorName = pseudo || user?.email || 'Anonyme';

          const { data, error } = await db.from('benches').insert({
            name: formData.name.trim(),
            location: finalLocation,
            category: formData.category,
            rating: formData.rating,
            comment: formData.comment.trim(),
            confort: formData.confort,
            solidite: formData.solidite,
            author: authorName,
            user_id: user.id,
            tags: formData.tags,
            lat: finalLat,
            lng: finalLng,
            images: finalImages,
          }).select().single();

          if (error) {
            setFormError("Erreur lors de l'ajout du banc : " + error.message);
            return;
          }

          const newBench = {
            id: data.id,
            name: data.name,
            location: data.location,
            lat: data.lat,
            lng: data.lng,
            category: data.category,
            rating: data.rating,
            comment: data.comment || '',
            criteria: { confort: data.confort, solidite: data.solidite },
            author: data.author,
            userId: data.user_id,
            tags: data.tags || [],
            dateAdded: data.date_added,
            favorite: false,
            favoritesCount: data.favorites_count || 0,
            images: data.images || [],
          };
          setBenches(bs => [newBench, ...bs]);
          setShowAddForm(false);
          setView('list');
          setActiveCategory('tous');
          showToast("Banc ajouté avec succès");
        } catch (err) {
          setFormError("Erreur lors de l'ajout du banc : " + err.message);
        } finally {
          setAddSubmitting(false);
        }
      }

      function useMyPositionForForm() {
        if (!navigator.geolocation) {
          showToast("Localisation non disponible");
          return;
        }
        // Capturé avant l'appel GPS (asynchrone) : reflète si l'utilisateur avait
        // déjà tapé une ville au moment du clic, pour ne jamais écraser une saisie
        // manuelle avec le résultat du géocodage inversé.
        const hadNoLocationTyped = !formData.location.trim();
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            setFormData(f => ({ ...f, lat, lng }));
            if (!hadNoLocationTyped) return;
            // Le champ Ville n'est plus obligatoire une fois la position acquise,
            // mais on le pré-remplit quand même avec un libellé lisible (plus
            // agréable qu'un champ vide dans la fiche du banc une fois publié).
            const label = await reverseGeocodeLocation(lat, lng);
            if (label) {
              setFormData(f => (f.location.trim() ? f : { ...f, location: label }));
            }
          },
          () => showToast("Impossible de récupérer votre position"),
          { timeout: 8000 }
        );
      }

      function toggleTag(tag) {
        setFormData(f => {
          const current = f.tags || [];
          if (current.includes(tag)) {
            return { ...f, tags: current.filter(t => t !== tag) };
          } else {
            return { ...f, tags: [...current, tag] };
          }
        });
      }

      // ============================================================
      // 13. RENDU
      // ============================================================

      // --- Splash screen : prioritaire sur tout le reste pendant son délai ---
      if (showSplash) {
        return (

              <h1 className="home-title" style={ { animationDelay: '0.25s' } }>Choisis ton <em>pseudo</em></h1>

              <form className="auth-form" onSubmit={handleSavePseudo} style={ { animationDelay: '0.45s' } }>

                <div className="form-field">
                  <label className="form-label" htmlFor="pseudo-input">Pseudo</label>
                  <input
                    id="pseudo-input"

                    type="text"
                    placeholder="Ton pseudo"
                    value={pseudo || ''}
                    onChange={(e) => handlePseudoChange(e.target.value)}
                    required
                  />
                </div>

                {pseudoSuggestions.length > 0 && (
                  <div style={ { marginBottom: '12px' } }>
                    <p style={ { fontSize: '0.78rem', color: 'rgba(255,255,255,0.6)' } }>
                      Suggestions disponibles :
                    </p>
                    <div style={ { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '6px' } }>
                      {pseudoSuggestions.map((sug, idx) => (

                        >
                          {sug}

                    </div>
                  </div>
                )}

                <button type="submit" className="btn-primary">Valider mon pseudo</button>
              </form>

                Tu pourras le modifier plus tard dans ton profil.
              </div>
            </div>
          </div>
        );
      }

      // --- Page d'accueil (connexion / inscription) ---
      if (!isLoggedIn) {
        return (
          <div className="home-screen">
            <div className="home-blob home-blob-1"></div>
            <div className="home-blob home-blob-2"></div>
            <img src={benchImageSrc} className="home-watermark" alt="" />

              <div className="home-logo-badge" style={ { animationDelay: '0.05s' } }>
                <img src={benchImageSrc} alt="" />
              </div>
              <div className="home-eyebrow" style={ { animationDelay: '0.15s' } }>Le carnet des amoureux du repos</div>
              <h1 className="home-title" style={ { animationDelay: '0.25s' } }>My <em>Bench</em></h1>
              <p className="home-subtitle" style={ { animationDelay: '0.35s' } }>

              </p>

              <form className="auth-form" onSubmit={handleAuthSubmit} style={ { animationDelay: '0.45s' } }>
                {authError && <div className="form-error">{authError}</div>}

                {authMode !== 'forgot' && (
                  <>
                    <div className="form-field">
                      <label className="form-label" htmlFor="auth-email">Adresse email</label>
                      <input

                    </div>

                      <label className="form-label" htmlFor="auth-password">Mot de passe</label>
                      <input
                        id="auth-password"
                        className="form-input"

                      />
                    </div>
                  </>
                )}

                {authMode === 'forgot' && (
                  <div className="form-field">
                    <label className="form-label" htmlFor="forgot-email">Adresse email</label>
                    <input

            </div>

            {[
              { id: 'favoris', cls: 'n-favoris', icon: '❤️', label: 'Favoris' },
              { id: 'profil',  cls: 'n-profil',  icon: '👤', label: 'Profil' },
            ].map(t => (
              <button
                key={t.id}
                className={`nav-item ${t.cls} ${view === t.id ? 'active' : ''}`}
                onClick={() => setView(t.id)}
                aria-current={view === t.id ? 'page' : undefined}
              >
                <span className="nav-medal"><span className="nav-medal-inner">{t.icon}</span></span>
                <span className="nav-label">{t.label}</span>
              </button>
            ))}
          </div>

          {/* MODAL DÉTAILS d'un banc */}
          {selectedBench && (
            <div className="sheet-overlay" onClick={() => { setSelectedBench(null); setConfirmingDelete(false); closeReportForm(); }}>
              <div className="sheet-panel" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div>
                    <div className="detail-name">{selectedBench.name}</div>
                    <div className="detail-meta">
                      📍 {selectedBench.location} — Ajouté le {formatDate(selectedBench.dateAdded)} par{' '}
                      <strong
                        className="clickable-pseudo"
                        onClick={(e) => {
                          e.stopPropagation();
                          showUserStats(selectedBench.author);
                        }}
                      >
                        {selectedBench.author}
                      </strong>
                    </div>
                  </div>
                  <button className="sheet-close" onClick={() => { setSelectedBench(null); setConfirmingDelete(false); closeReportForm(); }} aria-label="Fermer">✕</button>
                </div>
                <div style={ { position: 'relative', marginBottom: 16 } }>
                  <ImageCarousel images={selectedBench.images} altText={selectedBench.name} />
                  <div className="score-ring">
                    <span className="score-ring-num">{selectedBench.rating}</span>
                    <span className="score-ring-label">Note</span>
                  </div>
                </div>
                <div className="card-rating" style={ { marginBottom: 14 } }>
                  <span className="stars" style={ { fontSize: '1rem' } }>{starsFor(selectedBench.rating)}</span>
                  <span className="rating-num">{selectedBench.rating} / 5</span>
                </div>
                <div className="quick-actions-row">
                  <a
                    className="quick-action-btn"
                    href={getMapsUrl(selectedBench)}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    🧭 Y aller
                  </a>
                  <button type="button" className="quick-action-btn" onClick={() => shareBench(selectedBench)}>
                    🔗 Partager
                  </button>
                  <button type="button" className="quick-action-btn" onClick={openReportForm}>
                    🚩 Signaler
                  </button>
                </div>
                {selectedBench.comment && <div className="detail-comment">"{selectedBench.comment}"</div>}
                <div className="card-criteria">
                  <div className="crit-row">
                    <span className="crit-label">Confort</span>
                    <div className="crit-bar-wrap">
                      <div className="crit-bar"><div className="crit-fill" style={ { width: selectedBench.criteria.confort + '%' } }></div></div>
                      <span className="crit-val">{selectedBench.criteria.confort}%</span>
                    </div>
                  </div>
                  <div className="crit-row">
                    <span className="crit-label">Solidité</span>
                    <div className="crit-bar-wrap">
                      <div className="crit-bar"><div className="crit-fill" style={ { width: selectedBench.criteria.solidite + '%' } }></div></div>
                      <span className="crit-val">{selectedBench.criteria.solidite}%</span>
                    </div>
                  </div>
                </div>
                {selectedBench.tags && selectedBench.tags.length > 0 && (
                  <div className="card-tags">
                    {selectedBench.tags.map((t, i) => <span className="tag" key={i}>{t}</span>)}
                  </div>
                )}
                <div className="detail-actions">
                  <button className="btn-secondary" onClick={(e) => toggleFavorite(selectedBench.id, e)}>
                    {selectedBench.favorite ? '💔 Retirer des favoris' : '❤️ Ajouter aux favoris'}
                  </button>
                  {user && (user.email === ADMIN_EMAIL || user.id === selectedBench.userId) && (
                    <button
                      className={`btn-danger ${confirmingDelete ? 'confirming' : ''}`}
                      onClick={() => confirmingDelete ? handleDeleteBench(selectedBench.id) : setConfirmingDelete(true)}
                    >
                      {confirmingDelete ? 'Confirmer la suppression ?' : '🗑️ Supprimer'}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL SIGNALEMENT D'UN BANC */}
          {selectedBench && showReportForm && (
            <div className="sheet-overlay" onClick={closeReportForm}>
              <form className="sheet-panel" onClick={(e) => e.stopPropagation()} onSubmit={handleReportSubmit}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div>
                    <div className="detail-name" style={ { fontSize: '1.4rem' } }>🚩 Signaler ce banc</div>
                    <div className="detail-meta">{selectedBench.name}</div>
                  </div>
                  <button type="button" className="sheet-close" onClick={closeReportForm} aria-label="Fermer">✕</button>
                </div>

                <div className="form-field">
                  <label className="form-label">Raison</label>
                  <div className="report-reason-grid">
                    {['Banc disparu', 'Dangereux / abîmé', 'Contenu inapproprié', 'Autre'].map(reason => (
                      <div
                        key={reason}
                        className={`chip ${reportReason === reason ? 'active' : ''}`}
                        onClick={() => setReportReason(reason)}
                      >
                        {reason}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label" htmlFor="report-comment">Détails (optionnel)</label>
                  <textarea
                    id="report-comment"
                    className="form-textarea"
                    placeholder="Explique-nous ce qui ne va pas..."
                    value={reportComment}
                    onChange={(e) => setReportComment(e.target.value)}
                  ></textarea>
                </div>

                <div className="detail-actions">
                  <button type="button" className="btn-secondary" onClick={closeReportForm}>Annuler</button>
                  <button type="submit" className="btn-primary" disabled={reportSubmitting}>
                    {reportSubmitting ? 'Envoi...' : 'Envoyer le signalement'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL STATS UTILISATEUR */}
          {selectedUserPseudo && userStats && (
            <div className="sheet-overlay" onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }}>
              <div className="sheet-panel" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div>
                    <div className="detail-name" style={ { fontSize: '1.4rem' } }>👤 {userStats.pseudo}</div>
                    <div className="detail-meta">Contributions de l'utilisateur</div>
                  </div>
                  <button className="sheet-close" onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }} aria-label="Fermer">✕</button>
                </div>
                <div className="user-stats-grid">
                  <div className="user-stat-card">
                    <div className="user-stat-number">{userStats.count}</div>
                    <div className="user-stat-label">Bancs ajoutés</div>
                  </div>
                  <div className="user-stat-card">
                    <div className="user-stat-number">{userStats.avg}</div>
                    <div className="user-stat-label">Note moyenne</div>
                  </div>
                </div>
                <button className="btn-secondary" style={ { width: '100%' } } onClick={() => { setSelectedUserPseudo(null); setUserStats(null); }}>
                  Fermer
                </button>
              </div>
            </div>
          )}

          {/* MODAL AJOUT (formulaire modifié) */}
          {showAddForm && (
            <div className="sheet-overlay" onClick={() => setShowAddForm(false)}>
              <form className="sheet-panel" onClick={(e) => e.stopPropagation()} onSubmit={handleAddSubmit}>
                <div className="sheet-handle"></div>
                <div className="sheet-head">
                  <div className="detail-name" style={ { fontSize: '1.4rem' } }>Ajouter un banc</div>
                  <button type="button" className="sheet-close" onClick={() => setShowAddForm(false)} aria-label="Fermer">✕</button>
                </div>
                {formError && <div className="form-error">{formError}</div>}

                <div className="form-field">
                  <label className="form-label" htmlFor="bench-name">Nom du banc</label>
                  <input id="bench-name" className="form-input" type="text" placeholder="Ex. Banc de la place du marché" value={formData.name} onChange={(e) => setFormData(f => ({ ...f, name: e.target.value }))} />
                </div>

                <div className="form-field city-field-wrap">
                  <label className="form-label" htmlFor="bench-location">Ville</label>
                  <input
                    id="bench-location"
                    className="form-input"
                    type="text"
                    autoComplete="off"
                    placeholder="Ex. Nantes, France"
                    value={formData.location}
                    onChange={(e) => handleLocationInputChange(e.target.value)}
                    onFocus={() => { if (citySuggestions.length > 0) setShowCitySuggestions(true); }}
                    onBlur={() => { setTimeout(() => setShowCitySuggestions(false), 150); }}
                  />
                  {showCitySuggestions && (
                    <div className="city-suggestions">
                      {citySearching && <div className="city-suggestion-loading">Recherche en cours…</div>}
                      {!citySearching && citySuggestions.length === 0 && (
                        <div className="city-suggestion-loading">Aucune ville trouvée</div>
                      )}
                      {!citySearching && citySuggestions.map((s, idx) => (
                        <button
                          type="button"
                          key={idx}
                          className="city-suggestion-item"
                          onClick={() => selectCitySuggestion(s)}
                        >
                          📍 {s.label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="form-field">
                  <button type="button" className={`geo-btn ${formData.lat != null ? 'done' : ''}`} onClick={useMyPositionForForm}>
                    📍 {formData.lat != null ? 'Position ajoutée ✓' : 'Utiliser ma position actuelle'}
                  </button>
                  {formData.lat != null ? (
                    <div className="filter-hint">Position enregistrée : la ville n'est plus obligatoire.</div>
                  ) : (
                    <div className="filter-hint">Ou remplis directement le champ Ville ci-dessus.</div>
                  )}
                </div>

                {/* NOTE GLOBALE AVANT CATÉGORIE */}
                <div className="form-field">
                  <label className="form-label">Note globale</label>
                  <div className="star-picker">
                    {[1, 2, 3, 4, 5].map(n => (
                      <button type="button" key={n} className={n <= formData.rating ? 'filled' : ''} onClick={() => setFormData(f => ({ ...f, rating: n }))} aria-label={`${n} étoiles`}>★</button>
                    ))}
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label">Catégorie</label>
                  <div className="chips-row" style={ { marginBottom: 0 } }>
                    {Object.entries(CATEGORY_META).map(([key, meta]) => (
                      <div key={key} className={`chip ${formData.category === key ? 'active' : ''}`} onClick={() => setFormData(f => ({ ...f, category: key }))}>
                        {meta.icon} {meta.label}
                      </div>
                    ))}
                  </div>
                </div>

                {/* AMBIANCE (tags) SOUS CATÉGORIE */}
                <div className="form-field">
                  <label className="form-label">Ambiance</label>
                  <div className="tag-toggle-group">
                    {['Calme', 'Vue', 'Atypique'].map(tag => (
                      <button
                        key={tag}
                        type="button"
                        className={`tag-toggle ${formData.tags.includes(tag) ? 'active' : ''}`}
                        onClick={() => toggleTag(tag)}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                {/* PHOTOS (fichiers) */}
                <div className="form-field">
                  <label className="form-label">Photos (au moins une)</label>
                  {[0, 1, 2].map(idx => {
                    const key = `img${idx + 1}`;
                    const value = formData[key];
                    return (
                      <div key={idx} className="photo-upload">
                        <div className="photo-input-wrapper">
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => handlePhotoFile(idx, e.target.files[0])}
                          />
                          {value && (
                            <img src={value} alt={`Aperçu ${idx + 1}`} className="photo-preview" />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="form-row">
                  <div className="form-field">
                    <label className="form-label">Confort</label>
                    <div className="range-row">
                      <input type="range" min="0" max="100" value={formData.confort} onChange={(e) => setFormData(f => ({ ...f, confort: Number(e.target.value) }))} />
                      <span className="range-val">{formData.confort}%</span>
                    </div>
                  </div>
                  <div className="form-field">
                    <label className="form-label">Solidité</label>
                    <div className="range-row">
                      <input type="range" min="0" max="100" value={formData.solidite} onChange={(e) => setFormData(f => ({ ...f, solidite: Number(e.target.value) }))} />
                      <span className="range-val">{formData.solidite}%</span>
                    </div>
                  </div>
                </div>

                <div className="form-field">
                  <label className="form-label" htmlFor="bench-comment">Commentaire (optionnel)</label>
                  <textarea id="bench-comment" className="form-textarea" placeholder="Qu'as-tu pensé de ce banc ?" value={formData.comment} onChange={(e) => setFormData(f => ({ ...f, comment: e.target.value }))}></textarea>
                </div>

                <div className="detail-actions">
                  <button type="button" className="btn-secondary" onClick={() => setShowAddForm(false)}>Annuler</button>
                  <button type="submit" className="btn-primary" disabled={addSubmitting} style={ { opacity: addSubmitting ? 0.7 : 1 } }>
                    {addSubmitting ? 'Ajout en cours...' : 'Ajouter ce banc'}
                  </button>
                </div>
              </form>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
