<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bench</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M80 300 L60 360 L68 360 L90 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M130 350 L120 400 L128 400 L138 350 Z' fill='%232c2c2c'/%3E%3Cpath d='M410 290 L360 280 L362 288 L415 298 Z' fill='%232c2c2c'/%3E%3Cpath d='M460 280 L460 310 L468 310 L468 280 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 260 Q 200 380 440 250 L 440 230 Q 210 360 70 240 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 240 L 80 240 L 80 300 L 70 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M440 240 L 450 240 L 450 290 L 440 290 Z' fill='%232c2c2c'/%3E%3Cpath d='M90 280 L 480 220 L 495 230 L 120 310 Z' fill='%23b05c3a'/%3E%3Cpath d='M90 280 L 120 310 L 120 300 L 90 270 Z' fill='%239c4e2f'/%3E%3Cpath d='M40 220 L 410 160 L 410 120 L 50 180 Z' fill='%23b05c3a'/%3E%3Cpath d='M45 180 L 400 120 L 400 80 L 55 140 Z' fill='%23c46a45'/%3E%3Ccircle cx='65' cy='190' r='5' fill='%23808080'/%3E%3Ccircle cx='65' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='110' cy='280' r='5' fill='%23808080'/%3E%3Ccircle cx='150' cy='295' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='135' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='175' r='5' fill='%23808080'/%3E%3Ccircle cx='450' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='470' cy='225' r='5' fill='%23808080'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* --- TOUT LE CSS EXISTANT (inchangé) --- */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ede4;
      --surface: #faf7f2;
      --surface2: #f0ebe1;
      --ink: #1c1712;
      --ink2: #5a5044;
      --ink3: #9c8f80;
      --forest: #1d3d2c;
      --forest2: #2e6047;
      --forest3: #4a8c6a;
      --gold: #b8813a;
      --gold2: #d4a054;
      --gold3: #f2c97e;
      --rust: #9e3b1f;
      --border: rgba(90,80,68,0.14);
      --shadow: 0 2px 20px rgba(28,23,18,0.10);
      --shadow-deep: 0 8px 40px rgba(28,23,18,0.18);
      --toast-bg: #1c1712;
      --nav-bg: rgba(250,247,242,0.96);
      --r: 20px;
      --r-sm: 12px;
      --nav-h: 84px;
    }
    /* --- MODE SOMBRE ---
       Comme presque tout le design utilise déjà des variables CSS (--bg, --surface, --ink...),
       il suffit de redéfinir ces variables quand l'attribut data-theme="dark" est posé sur <html>
       pour que TOUT le site change de thème automatiquement, sans dupliquer les styles. */
    html[data-theme="dark"] {
      --bg: #14170f;
      --surface: #1d2318;
      --surface2: #262d1f;
      --ink: #f2ede2;
      --ink2: #c9c1af;
      --ink3: #8d8672;
      --border: rgba(242,201,126,0.13);
      --shadow: 0 2px 20px rgba(0,0,0,0.35);
      --shadow-deep: 0 10px 44px rgba(0,0,0,0.55);
      --nav-bg: rgba(20,23,15,0.94);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--forest3);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }


    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 calc(var(--nav-h) + 16px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .screen::-webkit-scrollbar { display: none; }

    .app-hero {
      position: relative;
      background: var(--forest);
      padding: 30px 20px 20px;
      flex-shrink: 0;
      /* Pas de overflow:hidden ici : le menu déroulant utilisateur (.user-dropdown) est
         positionné en absolute à l'intérieur de ce bloc et doit pouvoir déborder
         verticalement pour rester entièrement visible. Le fond dégradé (::before, inset:0)
         et l'icône filigrane (.hero-deco, ancrée à bottom/right avec de la marge) restent
         de toute façon contenus dans les limites du bloc, donc rien ne dépendait de ce clip. */
    }
    .app-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 10% 0%, rgba(184,129,58,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(74,140,106,0.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-deco {
      position: absolute;
      width: 6rem;
      height: 6rem;
      object-fit: contain;
      opacity: 0.05;
      bottom: 10px;
      right: 10px;
      transform: rotate(-15deg);
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }
    .hero-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }
    .hero-logo img { width: 1.5rem; height: 1.5rem; object-fit: contain; opacity: 0.85; }
    .hero-logo em { color: var(--gold3); font-style: normal; }
    .user-menu-wrap { position: relative; }
    .user-menu-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 5px 12px 5px 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-menu-btn:active { background: rgba(255,255,255,0.18); }
    .user-avatar {
      width: 26px; height: 26px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .user-menu-chevron {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      transition: transform 0.2s;
    }
    .user-menu-btn[aria-expanded="true"] .user-menu-chevron { transform: rotate(180deg); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-deep);
      overflow: hidden;
      z-index: 60;
      min-width: 190px;
      animation: dropIn 0.18s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-user-info {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-user-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink3);
      margin-bottom: 2px;
    }
    .dropdown-user-name {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--ink2);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .dropdown-item:active { background: var(--bg); }
    .dropdown-item.danger { color: var(--rust); }
    .dropdown-item .item-icon { font-size: 1rem; width: 20px; text-align: center; }

    .hero-greeting { position: relative; }
    .hero-eyebrow {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold3);
      opacity: 0.95;
    }
    /* Marge ajoutée uniquement quand des statistiques suivent (page Carte). */
    .hero-eyebrow + .hero-stats { margin-top: 10px; }
    .hero-stats { display: flex; gap: 7px; flex-wrap: wrap; }
    .hero-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .hero-stat-num {
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: white;
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.58rem;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .screen-content { padding: 16px 16px 0; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ------------------------------------------------------------
       NAVIGATION "MEDAILLONS"
       Chaque onglet est une pastille cerclee de metal. Le cercle est
       obtenu en superposant deux disques : le parent porte le degrade
       conique (l'anneau metallique) et sert de "cadre" via son padding,
       l'enfant porte la face du medaillon. Chaque onglet definit ses
       propres teintes via des variables CSS (--ring-a/--ring-b/--label).
       ------------------------------------------------------------ */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      cursor: pointer;
      border: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
      /* teintes par defaut (or) */
      --ring-a: #f7e7bd;
      --ring-b: #a87c31;
      --label: #a8792f;
      --face-a: #ffffff;
      --face-b: #e6e1d3;
      --face-c: #c9c2ae;
    }
    .nav-item.n-carte   { --ring-a: #ecdcbb; --ring-b: #8a6a3f; --label: #27497a;
                          --face-a: #fbf3e2; --face-b: #e3d3b4; --face-c: #c2ab84; }
    .nav-item.n-favoris { --ring-a: #f1f1f6; --ring-b: #8d8f99; --label: #9d1f34;
                          --face-a: #e46a80; --face-b: #a51b33; --face-c: #6d0f20; }
    .nav-item.n-profil  { --ring-a: #eff2f6; --ring-b: #8a94a2; --label: #2b4a72;
                          --face-a: #fdfdfd; --face-b: #e6e9ef; --face-c: #c4cad4; }

    .nav-medal {
      width: 42px; height: 42px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from 210deg,
        var(--ring-a) 0deg, var(--ring-b) 70deg, var(--ring-a) 140deg,
        var(--ring-b) 215deg, var(--ring-a) 290deg, var(--ring-b) 360deg);
      box-shadow: 0 2px 5px rgba(28,23,18,0.28);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
    }
    .nav-medal-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 28%,
        var(--face-a) 0%, var(--face-b) 58%, var(--face-c) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; line-height: 1;
      box-shadow: inset 0 2px 4px rgba(28,23,18,0.22);
    }
    .nav-item .nav-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink3);
      transition: color 0.2s;
    }
    .nav-item.active .nav-medal {
      transform: translateY(-2px) scale(1.1);
      box-shadow: 0 4px 12px rgba(28,23,18,0.34);
    }
    .nav-item.active .nav-label { color: var(--label); }
    /* En theme sombre, les teintes profondes (marine, bordeaux) deviennent
       illisibles : on redefinit des equivalents plus clairs. */
    html[data-theme="dark"] .nav-item            { --label: #e0b972; }
    html[data-theme="dark"] .nav-item.n-carte    { --label: #86b0e0; }
    html[data-theme="dark"] .nav-item.n-favoris  { --label: #e8788c; }
    html[data-theme="dark"] .nav-item.n-profil   { --label: #8fb3dd; }
    .nav-item:active .nav-medal { transform: scale(0.94); }

    /* ---- Bouton central "AJOUTER" ---- */
    .nav-add {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: none; background: none; cursor: pointer; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .fab {
      width: 58px; height: 58px;
      border-radius: 50%;
      padding: 3px;
      border: none;
      background: conic-gradient(from 210deg,
        #fbeec4 0deg, #b8892f 65deg, #fff6da 140deg,
        #a97c28 220deg, #f7e5b4 300deg, #b8892f 360deg);
      box-shadow: 0 0 18px rgba(242,201,126,0.55), 0 5px 16px rgba(28,23,18,0.4);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
    }
    .fab-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 26%, #357854 0%, #1d3d2c 58%, #10241a 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 2px 7px rgba(0,0,0,0.55);
      font-size: 1.7rem; font-weight: 300; line-height: 1;
      color: #eef0ee;
      text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    }
    .fab:active { transform: scale(0.92); box-shadow: 0 0 10px rgba(242,201,126,0.4), 0 2px 8px rgba(28,23,18,0.3); }
    .nav-add .nav-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #a8792f;
    }
    html[data-theme="dark"] .nav-add .nav-label { color: var(--gold3); }

    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--ink3);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 12px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-field:focus { border-color: var(--forest3); box-shadow: 0 0 0 3px rgba(74,140,106,0.12); }
    .search-field::placeholder { color: var(--ink3); }
    .search-clear {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: var(--ink3);
      border: none;
      color: white;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink2);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      scroll-snap-align: start;
      font-family: 'Inter', sans-serif;
    }
    .chip.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .chip:active { transform: scale(0.94); }

    /* --- BANDE "AJOUTÉS RÉCEMMENT" ---
       Mise en avant des derniers bancs ajoutés, juste après le hero et avant la
       barre de recherche/les filtres : on veut que les bancs qui viennent d'être
       créés soient visibles immédiatement, sans avoir à défiler au-delà de tout
       le bloc filtres/tri pour tomber sur du vrai contenu. */
    .recent-added-section { margin: 20px 0 24px; }
    .recent-added-title {
      font-family: 'Poppins', sans-serif; font-size: 1.05rem; font-weight: 700;
      color: var(--forest); display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
    }
    .recent-added-row {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .recent-added-row::-webkit-scrollbar { display: none; }
    .recent-added-card {
      position: relative; flex-shrink: 0; width: 148px; height: 176px;
      border-radius: var(--r-sm); overflow: hidden; cursor: pointer;
      scroll-snap-align: start; box-shadow: var(--shadow);
    }
    .recent-added-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .recent-added-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 42%, rgba(15,20,12,0.9) 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    }
    .recent-added-badge {
      position: absolute; top: 8px; left: 8px; background: rgba(28,23,18,0.72);
      backdrop-filter: blur(6px); color: var(--gold3); font-size: 0.58rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px;
    }
    .recent-added-name {
      color: #fff; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 700;
      line-height: 1.22; margin-bottom: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .recent-added-meta { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.88); font-weight: 600; }
    .recent-added-meta .stars { color: var(--gold3); letter-spacing: -1px; }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest);
    }
    .section-count {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: white;
      font-size: 0.62rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
    }

    .bench-card {
      background: var(--surface);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      animation: slideup 0.4s cubic-bezier(0.22,1,0.36,1) both;
      will-change: transform;
      transition: transform 0.2s, box-shadow 0.3s;
      backface-visibility: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      display: block;
      position: relative;
    }
    .bench-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-deep); }
    @keyframes slideup {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-media {
      position: relative;
      height: 200px;
      background: var(--surface2);
      overflow: hidden;
    }
    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28,23,18,0.5);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      font-size: 1rem;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
    }
    .carousel-btn:hover { background: rgba(28,23,18,0.8); }
    .carousel-btn:active { transform: translateY(-50%) scale(0.9); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .carousel-dot.active {
      background: #fff;
      width: 14px;
      border-radius: 999px;
    }

    .card-badge-moment {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(28,23,18,0.72);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
    }
    /* Badge du banc le plus enregistré en favori (tous utilisateurs confondus).
       Placé en bas à droite : seul coin encore libre sur .card-media (heart-btn
       en haut-gauche, badge "Nouveau" en haut-droite, score-ring en bas-gauche). */
    .card-badge-favorite {
      position: absolute;
      bottom: 12px; right: 12px;
      display: flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg, var(--rust), #c2542f);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
      box-shadow: 0 2px 10px rgba(158,59,31,0.4);
    }
    .heart-btn {
      position: absolute;
      top: 10px; left: 10px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(28,23,18,0.55);
      backdrop-filter: blur(6px);
      border: none;
      color: #fff;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 4;
      transition: transform 0.15s, background 0.15s;
    }
    .heart-btn:active { transform: scale(0.88); }
    .heart-btn.is-fav { background: rgba(158,59,31,0.85); }

    .score-ring {
      position: absolute;
      bottom: 12px; left: 12px;
      width: 42px; height: 42px;
      background: rgba(28,23,18,0.7);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid rgba(184,129,58,0.6);
      z-index: 2;
    }
    .score-ring-num { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--gold3); line-height: 1; }
    .score-ring-label { font-size: 0.42rem; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    .card-body { padding: 14px 16px 16px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .card-name { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--ink); line-height: 1.2; flex: 1; }
    .card-rating { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stars { color: var(--gold); font-size: 0.85rem; letter-spacing: -1px; }
    .rating-num { font-size: 0.85rem; font-weight: 700; color: var(--ink2); }
    .card-comment {
      font-size: 0.83rem; color: var(--ink2); font-style: italic; line-height: 1.5;
      margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-criteria {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px;
      margin-bottom: 12px; background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px;
    }
    .crit-row { display: flex; justify-content: space-between; align-items: center; }
    .crit-label { font-size: 0.7rem; color: var(--ink3); }
    .crit-bar-wrap { display: flex; align-items: center; gap: 5px; }
    .crit-bar { width: 36px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .crit-fill { height: 100%; background: var(--forest3); border-radius: 999px; }
    .crit-val { font-size: 0.68rem; font-weight: 700; color: var(--forest2); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(74,140,106,0.1); border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: var(--forest2); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-author { font-size: 0.68rem; color: var(--ink3); }
    .card-author strong { color: var(--ink2); }
    .card-location { font-size: 0.68rem; color: var(--ink3); }

    .admin-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(158, 59, 31, 0.85);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .admin-delete-btn:hover { background: var(--rust); }
    .admin-delete-btn:active { transform: scale(0.94); }
    .admin-delete-btn.confirming { background: var(--rust); box-shadow: 0 0 0 2px rgba(255,255,255,0.5) inset; }

    .bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bench-grid .bench-card { margin-bottom: 0; }
    .bench-grid .card-media { height: 130px; }
    .bench-grid .card-comment, .bench-grid .card-criteria, .bench-grid .card-tags { display: none; }
    .bench-grid .card-footer { flex-direction: column; align-items: flex-start; gap: 6px; }
    .bench-grid .card-name { font-size: 0.95rem; }
    .bench-grid .admin-delete-btn { font-size: 0.6rem; padding: 4px 8px; top: 6px; right: 6px; }

    .sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .sort-bar::-webkit-scrollbar { display: none; }

    /* --- Barre compacte "Trier & filtrer" (vue liste) ---
       Regroupe le tri et le rayon derrière un bouton repliable, pour que les
       cartes de bancs remontent nettement plus haut dans la page. */
    .list-tools-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .list-tools-toggle {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .list-tools-toggle.open { border-color: var(--forest); color: var(--forest2); }
    .list-tools-toggle:active { transform: scale(0.96); }
    .list-tools-chevron { font-size: 0.55rem; transition: transform 0.2s; }
    .list-tools-toggle.open .list-tools-chevron { transform: rotate(180deg); }
    .list-tools-summary {
      font-size: 0.7rem; color: var(--ink3); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-tools-panel { animation: toolsIn 0.2s ease both; }
    @keyframes toolsIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sort-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); white-space: nowrap; flex-shrink: 0; }
    .sort-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--surface); font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 600; color: var(--ink2); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s;
    }
    .sort-btn.active { background: var(--forest); color: white; border-color: var(--forest); }
    .sort-btn:active { transform: scale(0.94); }
    .view-toggle { display: flex; gap: 2px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 999px; padding: 3px; margin-left: auto; flex-shrink: 0; }

    .quick-actions-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .quick-action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 0.8rem; color: var(--forest2); cursor: pointer; transition: all 0.15s;
    }
    .quick-action-btn:hover { border-color: var(--forest3); color: var(--forest); }
    .quick-action-btn:active { transform: scale(0.96); background: var(--forest); color: #fff; border-color: var(--forest); }
    .view-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .view-btn.active { background: var(--surface); box-shadow: 0 1px 4px rgba(28,23,18,0.1); }
    .location-note { font-size: 0.68rem; color: var(--ink3); margin: -8px 0 14px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
    .page-btn {
      min-width: 36px; height: 36px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
    }
    .page-btn.active { background: var(--forest); color: white; border-color: var(--forest); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 20px; color: var(--ink3); }
    .empty-state .empty-icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.6; }
    .empty-state .empty-title { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--ink2); margin-bottom: 4px; }
    .empty-state .empty-text { font-size: 0.82rem; max-width: 260px; line-height: 1.5; }

    .map-wrap { position: relative; height: calc(100dvh - var(--nav-h) - 220px); min-height: 380px; margin-top: 16px; }
    #map-container { height: 100%; width: 100%; border-radius: var(--r); overflow: hidden; z-index: 1; position: relative; }
    #map-container .leaflet-control-attribution { font-size: 8px; }
    #map-container .leaflet-tile-pane { filter: saturate(0.92) sepia(0.06) contrast(1.02); }
    #map-container .leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow) !important; border: none !important; }
    #map-container .leaflet-control-zoom a { color: var(--forest) !important; }
    .locate-btn {
      position: absolute; bottom: 16px; right: 16px; z-index: 5;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--surface); box-shadow: var(--shadow-deep); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .locate-btn:active { transform: scale(0.92); }
    .map-empty-note { font-size: 0.72rem; color: var(--ink3); text-align: center; margin-top: 10px; }
    .map-reset-link {
      background: none; border: none; padding: 0; margin-left: 4px;
      color: var(--forest2); font-weight: 700; text-decoration: underline;
      cursor: pointer; font-size: inherit; font-family: 'Inter', sans-serif;
    }

    /* --- Bouton "Filtrer" (vue carte) --- */
    .map-filter-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px 7px 12px;
      font-size: 0.78rem; font-weight: 700; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .map-filter-btn.has-active { border-color: rgba(74,140,106,0.5); color: var(--forest2); }
    .map-filter-btn:active { transform: scale(0.96); }
    .map-filter-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .map-filter-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--forest); color: #fff; font-size: 0.62rem; font-weight: 800;
    }

    /* --- Volet latéral de filtres (drawer, glisse depuis la droite) ---
       Même logique que .sheet-overlay/.sheet-panel (bottom sheet) mais ancré à
       droite plutôt qu'en bas : justify-content: flex-end pousse le panneau
       contre le bord droit, et l'animation glisse en translateX au lieu de
       translateY. */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; justify-content: flex-end; animation: fadeIn 0.2s both;
    }
    .drawer-panel {
      background: var(--surface); width: min(86vw, 340px); height: 100%;
      overflow-y: auto; padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-deep); animation: drawerIn 0.28s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 10px; }
    .filter-hint { font-size: 0.72rem; color: var(--ink3); margin-top: 6px; }
    .filter-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .filter-switch-row .form-label { margin-bottom: 0; }

    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px 20px; text-align: center; margin-bottom: 16px; }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 0 auto 12px;
    }
    .profile-name { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--forest); margin-bottom: 2px; }
    .profile-sub { font-size: 0.78rem; color: var(--ink3); margin-bottom: 18px; }
    .profile-stats { display: flex; gap: 10px; }
    .profile-stat { flex: 1; background: var(--bg); border-radius: var(--r-sm); padding: 12px 8px; }
    .profile-stat-num { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--forest2); }
    .profile-stat-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); font-weight: 700; margin-top: 2px; }
    .profile-logout {
      width: 100%; margin-top: 16px; padding: 12px; border-radius: 999px; border: 1.5px solid rgba(158,59,31,0.25);
      background: rgba(158,59,31,0.06); color: var(--rust); font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: 'Inter', sans-serif;
    }

    /* --- GAMIFICATION (badges + progression) --- */
    .gami-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    .gami-tier-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .gami-tier-icon { font-size: 2rem; line-height: 1; }
    .gami-tier-art { width: 54px; height: 54px; object-fit: contain; flex-shrink: 0; }
    .gami-tier-name { font-family: 'Poppins', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--forest); }
    .gami-tier-sub { font-size: 0.72rem; color: var(--ink3); margin-top: 1px; }
    .gami-progress-track { width: 100%; height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
    .gami-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 999px; transition: width 0.4s ease; }
    .gami-progress-label { font-size: 0.68rem; color: var(--ink3); margin-top: 6px; text-align: right; }
    .gami-section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink3); font-weight: 700; margin: 18px 0 10px; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
    .badge-item {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 6px;
    }
    .badge-item.locked { opacity: 0.38; filter: grayscale(0.6); }
    .badge-icon { font-size: 1.6rem; line-height: 1; }
    /* Medaillon illustre : remplace l'emoji quand une image existe. */
    .badge-art { width: 40px; height: 40px; object-fit: contain; display: block; }
    .badge-item.locked .badge-art { filter: grayscale(1) brightness(0.75); }
    .badge-detail-art { width: 92px; height: 92px; object-fit: contain; margin: 0 auto 8px; display: block; }
    .badge-banner-art { width: 32px; height: 32px; object-fit: contain; }
    .badge-label { font-size: 0.62rem; font-weight: 700; color: var(--ink2); line-height: 1.2; }
    .badge-item.locked .badge-label { color: var(--ink3); }

    /* --- SOUS-PALIERS DE BADGE (Bronze / Argent / Or / Platine) ---
       Les badges thématiques et qualité progressent maintenant à travers 4 sous-paliers.
       Chaque palier a sa propre teinte de bordure/fond et une petite pastille sous le libellé. */
    .badge-item.tier-bronze { opacity: 1; filter: none; border-color: rgba(205,127,50,0.45); background: linear-gradient(160deg, rgba(205,127,50,0.14), var(--bg)); }
    .badge-item.tier-argent { opacity: 1; filter: none; border-color: rgba(180,180,180,0.55); background: linear-gradient(160deg, rgba(190,190,190,0.18), var(--bg)); }
    .badge-item.tier-or { opacity: 1; filter: none; border-color: rgba(212,160,84,0.6); background: linear-gradient(160deg, rgba(242,201,126,0.24), var(--bg)); }
    .badge-item.tier-platine {
      opacity: 1; filter: none; border-color: rgba(163,196,210,0.75);
      background: linear-gradient(160deg, rgba(210,230,238,0.32), var(--bg));
      box-shadow: 0 0 0 1px rgba(163,196,210,0.3) inset;
    }
    .badge-tier-pill {
      font-size: 0.52rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 999px; margin-top: 2px; line-height: 1.5; white-space: nowrap;
    }
    .badge-tier-pill.tier-locked { background: var(--surface2); color: var(--ink3); }
    .badge-tier-pill.tier-bronze { background: rgba(205,127,50,0.2); color: #935c26; }
    .badge-tier-pill.tier-argent { background: rgba(150,150,150,0.22); color: #63666b; }
    .badge-tier-pill.tier-or { background: rgba(242,201,126,0.3); color: #93691c; }
    .badge-tier-pill.tier-platine { background: rgba(163,196,210,0.35); color: #3f6472; }
    html[data-theme="dark"] .badge-tier-pill.tier-bronze { color: #e6a568; }
    html[data-theme="dark"] .badge-tier-pill.tier-argent { color: #dcdcdc; }
    html[data-theme="dark"] .badge-tier-pill.tier-or { color: #f2c97e; }
    html[data-theme="dark"] .badge-tier-pill.tier-platine { color: #cfe7f0; }
    .badge-detail-tier-pill { display: inline-block; font-size: 0.62rem; padding: 4px 12px; margin-bottom: 10px; }
    .badge-detail-progress-track {
      width: 100%; height: 8px; border-radius: 999px; background: var(--bg);
      border: 1px solid var(--border); overflow: hidden; margin: 4px 0 6px;
    }
    .badge-detail-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 999px; transition: width 0.4s ease; }
    .badge-detail-progress-label { font-size: 0.68rem; color: var(--ink3); text-align: left; margin-bottom: 14px; }
    .badge-detail-levels { text-align: left; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .badge-level-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.76rem; font-weight: 600; padding: 8px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: var(--ink3);
    }
    .badge-level-row.reached { color: var(--ink); border-color: rgba(74,140,106,0.4); background: rgba(74,140,106,0.08); }
    .badge-level-row .lvl-check { color: var(--forest2); font-weight: 800; margin-left: 4px; }

    .badge-detail-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.2s both;
    }
    .badge-detail-card {
      background: var(--surface); border-radius: var(--r); padding: 24px; max-width: 300px; width: 100%;
      text-align: center; box-shadow: var(--shadow-deep);
    }
    .badge-detail-icon { font-size: 2.6rem; margin-bottom: 8px; }
    .badge-detail-name { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--forest); margin-bottom: 4px; }
    .badge-detail-desc { font-size: 0.8rem; color: var(--ink2); margin-bottom: 4px; }
    .badge-detail-status { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
    .badge-detail-status.unlocked { color: var(--forest2); }
    .badge-detail-status.locked { color: var(--ink3); }

    /* --- BANDEAU DE DÉBLOCAGE DE BADGE (icône + nom, auto-disparaît après 4s) --- */
    .badge-banner-wrap {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 300; width: min(92vw, 380px);
      pointer-events: none; /* laisse passer les interactions sous le bandeau, sauf sur le bandeau lui-même */
    }
    .badge-banner {
      pointer-events: auto;
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 16px;
      background: linear-gradient(135deg, var(--forest), var(--forest2));
      border: 1px solid rgba(242,201,126,0.35);
      box-shadow: 0 12px 32px rgba(28,23,18,0.35);
      cursor: pointer;
      animation: badgeBannerIn 0.5s cubic-bezier(0.22,1.4,0.4,1) both;
    }
    .badge-banner.leaving { animation: badgeBannerOut 0.28s ease-in both; }
    @keyframes badgeBannerIn {
      0% { opacity: 0; transform: translateY(-60px) scale(0.94); }
      60% { opacity: 1; transform: translateY(5px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes badgeBannerOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-24px); }
    }
    .badge-banner-icon {
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px;
      background: rgba(242,201,126,0.16); border: 1px solid rgba(242,201,126,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .badge-banner-text { min-width: 0; }
    .badge-banner-title {
      font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--gold3);
    }
    .badge-banner-name {
      font-family: 'Poppins', sans-serif; font-size: 0.94rem; font-weight: 700; color: #fff;
      margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: flex-end; animation: fadeIn 0.2s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-panel {
      background: var(--surface); width: 100%; max-height: 88dvh; overflow-y: auto;
      border-radius: 24px 24px 0 0; padding: 10px 20px calc(28px + env(safe-area-inset-bottom));
      animation: sheetUp 0.28s cubic-bezier(0.22,1,0.36,1) both; box-shadow: var(--shadow-deep);
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; }
    .sheet-close { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink2); font-size: 1rem; cursor: pointer; flex-shrink: 0; }
    .detail-name { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--ink); line-height: 1.15; }
    .detail-meta { font-size: 0.78rem; color: var(--ink3); margin: 6px 0 16px; }
    .detail-meta strong { color: var(--ink2); }
    .detail-comment { font-size: 0.9rem; color: var(--ink2); font-style: italic; line-height: 1.6; margin-bottom: 16px; }
    .detail-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-secondary, .btn-primary, .btn-danger {
      flex: 1; padding: 13px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      border: 1.5px solid transparent; font-family: 'Inter', sans-serif; transition: transform 0.15s, background 0.2s;
    }
    .btn-primary { background: var(--forest); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--ink2); border-color: var(--border); }
    .btn-danger { background: rgba(158,59,31,0.08); color: var(--rust); border-color: rgba(158,59,31,0.25); }
    .btn-danger.confirming { background: var(--rust); color: #fff; }
    .btn-primary:active, .btn-secondary:active, .btn-danger:active { transform: scale(0.97); }

    .form-field { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); margin-bottom: 6px; }
    .form-input, .form-textarea {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--ink); outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--forest3); }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-field { flex: 1; }
    .star-picker { display: flex; gap: 6px; }
    .star-picker button { background: none; border: none; font-size: 1.6rem; color: var(--border); cursor: pointer; padding: 2px; line-height: 1; }
    .star-picker button.filled { color: var(--gold); }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input[type="range"] { flex: 1; accent-color: var(--forest3); }
    .range-val { font-size: 0.75rem; font-weight: 700; color: var(--forest2); width: 34px; text-align: right; }
    .form-error { color: var(--rust); font-size: 0.78rem; margin-bottom: 12px; }
    .geo-btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 8px 14px; font-size: 0.78rem; font-weight: 600; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .geo-btn.done { color: var(--forest2); border-color: rgba(74,140,106,0.4); }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--toast-bg); color: #fff; padding: 11px 20px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; z-index: 200; box-shadow: var(--shadow-deep);
      animation: toastIn 0.25s cubic-bezier(0.22,1,0.36,1) both; max-width: 88vw; text-align: center;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .home-screen {
      position: relative;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, #2e6047 0%, var(--forest) 55%, #142a1e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .home-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.35; pointer-events: none; animation: drift 16s ease-in-out infinite alternate; }
    .home-blob-1 { width: 320px; height: 320px; background: var(--gold); top: -80px; left: -60px; }
    .home-blob-2 { width: 260px; height: 260px; background: var(--forest3); bottom: 60px; right: 40px; animation-duration: 20s; animation-delay: -4s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 25px) scale(1.12); }
    }
    .home-watermark {
      position: absolute;
      width: 22rem;
      height: 22rem;
      object-fit: contain;
      opacity: 0.05;
      right: -4rem;
      bottom: -3rem;
      transform: rotate(-12deg);
      pointer-events: none;
      animation: bob 6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(-12deg) translateY(-14px); }
    }
    .home-content {
      position: relative;
      z-index: 2;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .home-content > * {
      opacity: 0;
      animation: homeFadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes homeFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .home-logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation-name: homeFadeUp, badgeFloat;
      animation-duration: 0.7s, 3.2s;
      animation-timing-function: cubic-bezier(0.22,1,0.36,1), ease-in-out;
      animation-iteration-count: 1, infinite;
      animation-delay: inherit, 0.9s;
    }
    .home-logo-badge img { width: 30px; height: 30px; }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .home-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold3);
      margin-bottom: 10px;
      opacity: 0.9;
    }
    .home-title {
      font-family: 'Poppins', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.05;
      margin-bottom: 14px;
    }
    .home-title em { font-style: normal; color: var(--gold3); }
    .home-subtitle {
      font-size: 0.92rem;
      color: rgba(255,255,255,0.72);
      line-height: 1.55;
      margin-bottom: 26px;
    }

    /* --- SPLASH SCREEN (écran de chargement au lancement) ---
       Réutilise la même identité visuelle que .home-screen (fond dégradé forêt),
       mais réduite à l'essentiel : logo + nom de l'app + petit indicateur de
       chargement, sans texte d'accroche ni formulaire. */
    .splash-screen {
      position: relative;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, #2e6047 0%, var(--forest) 55%, #142a1e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }
    .splash-logo-badge {
      width: 168px;
      height: 168px;
      margin-bottom: 22px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: badgeFloat 3.2s ease-in-out infinite, splashPop 0.6s cubic-bezier(0.22,1.4,0.4,1) both;
    }
    .splash-logo-badge img { width: 132px; height: 132px; object-fit: contain; }
    @keyframes splashPop {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
    .splash-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
      margin-bottom: 30px;
      opacity: 0;
      animation: homeFadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
    }
    .splash-title em { font-style: normal; color: var(--gold3); }
    .splash-dots {
      display: flex; gap: 8px;
      opacity: 0;
      animation: homeFadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.3s both;
    }
    .splash-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold3);
      animation: splashDot 1.1s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splashDot {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-5px); }
    }

    .auth-form {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 24px 20px 28px;
      text-align: left;
      margin-bottom: 20px;
    }
    .auth-form .form-label {
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }
    .auth-form .form-input {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
    .auth-form .form-input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .auth-form .form-input:focus {
      border-color: var(--gold3);
      box-shadow: 0 0 0 3px rgba(242,201,126,0.2);
    }
    .auth-form .form-error {
      color: #ffb3a6;
      font-size: 0.8rem;
      margin-bottom: 10px;
      text-align: center;
    }
    .auth-form .auth-toggle {
      display: inline-block;
      color: var(--gold3);

      cursor: pointer;
      transition: color 0.2s;
      font-size: 0.85rem;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;

    .auth-form .forgot-link {
      color: rgba(255,255,255,0.5);
      font-size: 0.75rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .auth-form .forgot-link:hover { color: rgba(255,255,255,0.8); }
    .auth-form .btn-primary {
      width: 100%;
      margin-top: 6px;

      color: var(--forest);
      font-weight: 800;
    }
    .auth-form .btn-primary:hover { background: #f2d48a; }
    .auth-form .btn-primary:active { transform: scale(0.97); }

    .home-hint {
      margin-top: 14px;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.4);
    }

    .pseudo-page {
      position: relative;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, #2e6047 0%, var(--forest) 55%, #142a1e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      z-index: 2;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .pseudo-content .home-eyebrow {
      margin-bottom: 6px;
    }
    .pseudo-content .home-title {
      font-size: 2.2rem;

    .pseudo-content .home-subtitle {
      font-size: 0.85rem;

    }
    .pseudo-content .auth-form {

    /* Nouveaux styles pour les champs photo */
    .photo-upload {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }
    .photo-upload:last-of-type { margin-bottom: 0; }
    .photo-preview {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .photo-input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .photo-input-wrapper input[type="file"] {
      flex: 1;
      font-size: 0.8rem;
      padding: 4px 0;
    }
    .photo-input-wrapper input[type="file"]::file-selector-button {
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: var(--forest2);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      transition: background 0.2s;
    }
    .photo-input-wrapper input[type="file"]::file-selector-button:hover {
      background: var(--forest3);
    }

    /* Tag toggle */
    .tag-toggle-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink2);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
    }
    .tag-toggle.active {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }

    .clickable-pseudo {
      color: var(--forest2);
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 2px;
    }
    .clickable-pseudo:hover {
      color: var(--gold);
      text-decoration-color: var(--gold);
    }

    .user-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .user-stat-card {
      background: var(--bg);
      border-radius: var(--r-sm);
      padding: 16px;
      text-align: center;
    }
    .user-stat-number {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--forest);
    }
    .user-stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ink3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* --- Autocomplétion de ville --- */
    .city-field-wrap { position: relative; }
    .city-suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-deep);
      overflow: hidden;
      z-index: 20;
      animation: dropIn 0.15s cubic-bezier(0.22,1,0.36,1);

      display: flex;

      width: 100%;
      padding: 11px 14px;

      font-family: 'Inter', sans-serif;

      color: var(--ink2);

    .city-suggestion-loading { padding: 10px 14px; font-size: 0.76rem; color: var(--ink3); }

    /* --- Paramètres / interrupteur mode sombre --- */
    /* --- Écran admin : signalements --- */

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .report-card.treated { opacity: 0.55; }
    .report-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 8px;
    }
    .report-reason-tag {
      display: inline-block; flex-shrink: 0;
      background: rgba(158,59,31,0.1); color: var(--rust);
      border: 1px solid rgba(158,59,31,0.25);

      font-size: 0.66rem; font-weight: 800;
    }

    .report-bench-missing { font-size: 0.78rem; color: var(--ink3); font-style: italic; }
    .report-meta { font-size: 0.7rem; color: var(--ink3); margin-top: 3px; }
    .report-comment {
      font-size: 0.82rem; color: var(--ink2); line-height: 1.5;
      background: var(--bg); border-radius: var(--r-sm);

    .report-btn {
      flex: 1; min-width: 120px;
      border-radius: 999px; padding: 8px 12px;
      font-size: 0.72rem; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--surface); color: var(--ink2);
      font-family: 'Inter', sans-serif;
    }
    .report-btn:active { transform: scale(0.97); }
    .report-btn.danger { color: var(--rust); border-color: rgba(158,59,31,0.3); }
    .report-btn.danger.confirming { background: var(--rust); color: #fff; border-color: var(--rust); }
    .admin-count-pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px;
      border-radius: 999px; background: var(--rust); color: #fff;
      font-size: 0.62rem; font-weight: 800;
    }

    /* --- Paramètres : gestion du compte --- */
    .settings-block { padding: 16px; border-top: 1px solid var(--border); }
    .settings-block:first-child { border-top: none; }
    .settings-block-title {
      font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 700;
      color: var(--ink); margin-bottom: 4px;
    }
    .settings-block-sub { font-size: 0.75rem; color: var(--ink3); line-height: 1.5; margin-bottom: 12px; }
    .settings-msg {
      font-size: 0.76rem; font-weight: 600; border-radius: var(--r-sm);
      padding: 8px 11px; margin-bottom: 10px; line-height: 1.45;
    }
    .settings-msg.error { background: rgba(158,59,31,0.1); color: var(--rust); }
    .settings-msg.ok { background: rgba(74,140,106,0.12); color: var(--forest2); }
    .quota-pill {
      display: inline-block; font-size: 0.66rem; font-weight: 800;
      background: var(--bg); border: 1px solid var(--border); color: var(--ink2);
      border-radius: 999px; padding: 3px 10px; margin-left: 6px;
    }
    .quota-pill.exhausted { background: rgba(158,59,31,0.1); color: var(--rust); border-color: rgba(158,59,31,0.25); }
    .settings-block .form-input { margin-bottom: 10px; }
    .btn-block { width: 100%; }
    .danger-zone { border-top: 1px solid rgba(158,59,31,0.3); }
    .danger-zone .settings-block-title { color: var(--rust); }
    .loc-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 700; border-radius: 999px;
      padding: 4px 11px; margin-bottom: 12px;
    }
    .loc-status.granted { background: rgba(74,140,106,0.12); color: var(--forest2); }
    .loc-status.denied { background: rgba(158,59,31,0.1); color: var(--rust); }
    .loc-status.idle { background: var(--bg); color: var(--ink3); }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px 18px;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row-text { display: flex; flex-direction: column; gap: 3px; flex: 1 1 160px; min-width: 0; }
    .settings-row-title { font-weight: 700; font-size: 0.92rem; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .settings-row-sub { font-size: 0.76rem; color: var(--ink3); }
    .theme-switch {
      position: relative;
      width: 50px; height: 28px;
      flex-shrink: 0;
      border-radius: 999px;
      border: none;
      background: var(--surface2);
      box-shadow: inset 0 0 0 1.5px var(--border);
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .theme-switch.on { background: var(--forest); }
    .theme-switch-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .theme-switch.on .theme-switch-knob { transform: translateX(22px); }

    /* --- Signaler un banc --- */
    .report-reason-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    function daysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }
    function haversineKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }
    function starsFor(rating) {
      const r = Math.round(rating);
      return '★'.repeat(r) + '☆'.repeat(5 - r);

    function formatDate(iso) {

    // --- SOUS-PALIERS DE BADGE (Bronze → Argent → Or → Platine) ---
    // Les badges thématiques et qualité ne sont plus de simples badges "tout ou rien" :
    // chacun progresse à travers 4 sous-paliers successifs, calculés à partir d'une valeur
    // numérique (getValue) comparée aux seuils définis dans "levels".
    const BADGE_TIER_LEVELS = [
      { key: 'bronze', label: 'Bronze', icon: '🥉' },
      { key: 'argent', label: 'Argent', icon: '🥈' },
      { key: 'or', label: 'Or', icon: '🥇' },
      { key: 'platine', label: 'Platine', icon: '💠' },
    ];
    function tierMeta(tierKey) {
      return BADGE_TIER_LEVELS.find(t => t.key === tierKey) || null;
    }

    // Calcule, pour un badge à sous-paliers, le palier actuellement atteint (ou null si aucun),
    // le prochain palier à débloquer, et le pourcentage de progression vers celui-ci.
    function getBadgeTierInfo(badge, ctx) {
      const value = badge.getValue(ctx);
      let current = null;
      let next = null;
      for (const lvl of badge.levels) {
        if (value >= lvl.threshold) current = lvl;
        else { next = lvl; break; }
      }
      const prevThreshold = current ? current.threshold : 0;
      const progressPct = next
        ? Math.min(100, Math.max(0, Math.round(((value - prevThreshold) / (next.threshold - prevThreshold)) * 100)))
        : 100;
      return { value, current, next, progressPct };
    }

          { tier: 'or', threshold: 15 }, { tier: 'platine', threshold: 30 },
        ],
      },
      {
        id: 'loupdemer', icon: '🌊', label: 'Loup de Mer', descBase: 'bancs au bord de mer',
        getValue: (ctx) => ctx.categoryCounts.mer || 0,
        levels: [
          { tier: 'bronze', threshold: 3 }, { tier: 'argent', threshold: 7 },
          { tier: 'or', threshold: 15 }, { tier: 'platine', threshold: 30 },
        ],
      },
      {
        id: 'citadin', icon: '🏙️', label: 'Citadin Posé', descBase: 'bancs en ville',
        getValue: (ctx) => ctx.categoryCounts.urbain || 0,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 12 },
          { tier: 'or', threshold: 25 }, { tier: 'platine', threshold: 45 },
        ],
      },
      {
        id: 'mainverte', icon: '🌻', label: 'Main Verte', descBase: 'bancs en parc',
        getValue: (ctx) => ctx.categoryCounts.parc || 0,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 12 },
          { tier: 'or', threshold: 25 }, { tier: 'platine', threshold: 45 },
        ],
      },
      {
        id: 'passepartout', icon: '🌈', label: 'Passe-Partout', descBase: 'bancs dans chaque catégorie (au minimum)',
        // La valeur est le nombre minimal de bancs parmi TOUTES les catégories :
        // il faut donc avoir progressé partout, pas juste dans une seule.
        getValue: (ctx) => {
          const cats = Object.keys(CATEGORY_META);
          if (cats.length === 0) return 0;
          return Math.min(...cats.map(cat => ctx.categoryCounts[cat] || 0));
        },
        levels: [
          { tier: 'bronze', threshold: 1 }, { tier: 'argent', threshold: 3 },
          { tier: 'or', threshold: 5 }, { tier: 'platine', threshold: 10 },

    // Badges qualité & interaction : basés sur le contenu des fiches et l'activité du compte.
    const QUALITY_BADGES = [
      {
        id: 'pepite', icon: '💎', label: 'Pépite Cachée', descBase: 'bancs avec confort et solidité au-dessus de 90%',
        getValue: (ctx) => ctx.myBenches.filter(b => b.criteria.confort > 90 && b.criteria.solidite > 90).length,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 10 },

      {

        getValue: (ctx) => ctx.myBenches.filter(b => (b.images || []).length >= 3).length,
        levels: [
          { tier: 'bronze', threshold: 5 }, { tier: 'argent', threshold: 10 },
          { tier: 'or', threshold: 20 }, { tier: 'platine', threshold: 35 },
