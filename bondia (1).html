<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bench</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M80 300 L60 360 L68 360 L90 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M130 350 L120 400 L128 400 L138 350 Z' fill='%232c2c2c'/%3E%3Cpath d='M410 290 L360 280 L362 288 L415 298 Z' fill='%232c2c2c'/%3E%3Cpath d='M460 280 L460 310 L468 310 L468 280 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 260 Q 200 380 440 250 L 440 230 Q 210 360 70 240 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 240 L 80 240 L 80 300 L 70 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M440 240 L 450 240 L 450 290 L 440 290 Z' fill='%232c2c2c'/%3E%3Cpath d='M90 280 L 480 220 L 495 230 L 120 310 Z' fill='%23b05c3a'/%3E%3Cpath d='M90 280 L 120 310 L 120 300 L 90 270 Z' fill='%239c4e2f'/%3E%3Cpath d='M40 220 L 410 160 L 410 120 L 50 180 Z' fill='%23b05c3a'/%3E%3Cpath d='M45 180 L 400 120 L 400 80 L 55 140 Z' fill='%23c46a45'/%3E%3Ccircle cx='65' cy='190' r='5' fill='%23808080'/%3E%3Ccircle cx='65' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='110' cy='280' r='5' fill='%23808080'/%3E%3Ccircle cx='150' cy='295' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='135' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='175' r='5' fill='%23808080'/%3E%3Ccircle cx='450' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='470' cy='225' r='5' fill='%23808080'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* --- TOUT LE CSS EXISTANT (inchangé) --- */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ede4;
      --surface: #faf7f2;
      --surface2: #f0ebe1;
      --ink: #1c1712;
      --ink2: #5a5044;
      --ink3: #9c8f80;
      --forest: #1d3d2c;
      --forest2: #2e6047;
      --forest3: #4a8c6a;
      --gold: #b8813a;
      --gold2: #d4a054;
      --gold3: #f2c97e;
      --rust: #9e3b1f;
      --border: rgba(90,80,68,0.14);
      --shadow: 0 2px 20px rgba(28,23,18,0.10);
      --shadow-deep: 0 8px 40px rgba(28,23,18,0.18);
      --toast-bg: #1c1712;
      --nav-bg: rgba(250,247,242,0.96);
      --r: 20px;
      --r-sm: 12px;
      --nav-h: 74px;
    }
    /* --- MODE SOMBRE ---
       Comme presque tout le design utilise déjà des variables CSS (--bg, --surface, --ink...),
       il suffit de redéfinir ces variables quand l'attribut data-theme="dark" est posé sur <html>
       pour que TOUT le site change de thème automatiquement, sans dupliquer les styles. */
    html[data-theme="dark"] {
      --bg: #14170f;
      --surface: #1d2318;
      --surface2: #262d1f;
      --ink: #f2ede2;
      --ink2: #c9c1af;
      --ink3: #8d8672;
      --border: rgba(242,201,126,0.13);
      --shadow: 0 2px 20px rgba(0,0,0,0.35);
      --shadow-deep: 0 10px 44px rgba(0,0,0,0.55);
      --nav-bg: rgba(20,23,15,0.94);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--forest3);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }


    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 calc(var(--nav-h) + 16px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .screen::-webkit-scrollbar { display: none; }

    .app-hero {
      position: relative;
      background: var(--forest);
      padding: 30px 20px 20px;
      flex-shrink: 0;
      /* Pas de overflow:hidden ici : le menu déroulant utilisateur (.user-dropdown) est
         positionné en absolute à l'intérieur de ce bloc et doit pouvoir déborder
         verticalement pour rester entièrement visible. Le fond dégradé (::before, inset:0)
         et l'icône filigrane (.hero-deco, ancrée à bottom/right avec de la marge) restent
         de toute façon contenus dans les limites du bloc, donc rien ne dépendait de ce clip. */
    }
    .app-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 10% 0%, rgba(184,129,58,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(74,140,106,0.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-deco {
      position: absolute;
      width: 6rem;
      height: 6rem;
      opacity: 0.05;
      bottom: 10px;
      right: 10px;
      transform: rotate(-15deg);
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }
    .hero-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }
    .hero-logo img { width: 1.1rem; height: 1.1rem; opacity: 0.8; }
    .hero-logo em { color: var(--gold3); font-style: normal; }
    .user-menu-wrap { position: relative; }
    .user-menu-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 5px 12px 5px 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-menu-btn:active { background: rgba(255,255,255,0.18); }
    .user-avatar {
      width: 26px; height: 26px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .user-menu-chevron {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      transition: transform 0.2s;
    }
    .user-menu-btn[aria-expanded="true"] .user-menu-chevron { transform: rotate(180deg); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-deep);
      overflow: hidden;
      z-index: 60;
      min-width: 190px;
      animation: dropIn 0.18s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-user-info {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-user-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink3);
      margin-bottom: 2px;
    }
    .dropdown-user-name {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--ink2);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .dropdown-item:active { background: var(--bg); }
    .dropdown-item.danger { color: var(--rust); }
    .dropdown-item .item-icon { font-size: 1rem; width: 20px; text-align: center; }

    .hero-greeting { position: relative; }
    .hero-eyebrow {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold3);
      opacity: 0.95;
    }
    /* Marge ajoutée uniquement quand des statistiques suivent (page Carte). */
    .hero-eyebrow + .hero-stats { margin-top: 10px; }
    .hero-stats { display: flex; gap: 7px; flex-wrap: wrap; }
    .hero-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .hero-stat-num {
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: white;
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.58rem;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .screen-content { padding: 16px 16px 0; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: var(--r-sm);
      border: none;
      background: none;
    }
    .nav-item .nav-icon {
      font-size: 1.3rem;
      line-height: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-item .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink3);
      transition: color 0.2s;
    }
    .nav-item.active .nav-icon { transform: scale(1.2); }
    .nav-item.active .nav-label { color: var(--forest); font-weight: 700; }
    .fab {
      width: 58px; height: 58px;
      background: var(--forest);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(29,61,44,0.4);
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      margin-bottom: 4px;
      color: white;
    }
    .fab:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(29,61,44,0.3); }

    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--ink3);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 12px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-field:focus { border-color: var(--forest3); box-shadow: 0 0 0 3px rgba(74,140,106,0.12); }
    .search-field::placeholder { color: var(--ink3); }
    .search-clear {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: var(--ink3);
      border: none;
      color: white;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink2);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      scroll-snap-align: start;
      font-family: 'Inter', sans-serif;
    }
    .chip.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .chip:active { transform: scale(0.94); }

    /* --- BANDE "AJOUTÉS RÉCEMMENT" ---
       Mise en avant des derniers bancs ajoutés, juste après le hero et avant la
       barre de recherche/les filtres : on veut que les bancs qui viennent d'être
       créés soient visibles immédiatement, sans avoir à défiler au-delà de tout
       le bloc filtres/tri pour tomber sur du vrai contenu. */
    .recent-added-section { margin: 20px 0 24px; }
    .recent-added-title {
      font-family: 'Poppins', sans-serif; font-size: 1.05rem; font-weight: 700;
      color: var(--forest); display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
    }
    .recent-added-row {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .recent-added-row::-webkit-scrollbar { display: none; }
    .recent-added-card {
      position: relative; flex-shrink: 0; width: 148px; height: 176px;
      border-radius: var(--r-sm); overflow: hidden; cursor: pointer;
      scroll-snap-align: start; box-shadow: var(--shadow);
    }
    .recent-added-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .recent-added-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 42%, rgba(15,20,12,0.9) 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    }
    .recent-added-badge {
      position: absolute; top: 8px; left: 8px; background: rgba(28,23,18,0.72);
      backdrop-filter: blur(6px); color: var(--gold3); font-size: 0.58rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px;
    }
    .recent-added-name {
      color: #fff; font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 700;
      line-height: 1.22; margin-bottom: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .recent-added-meta { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.88); font-weight: 600; }
    .recent-added-meta .stars { color: var(--gold3); letter-spacing: -1px; }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest);
    }
    .section-count {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: white;
      font-size: 0.62rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
    }

    .bench-card {
      background: var(--surface);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      animation: slideup 0.4s cubic-bezier(0.22,1,0.36,1) both;
      will-change: transform;
      transition: transform 0.2s, box-shadow 0.3s;
      backface-visibility: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      display: block;
      position: relative;
    }
    .bench-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-deep); }
    @keyframes slideup {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-media {
      position: relative;
      height: 200px;
      background: var(--surface2);
      overflow: hidden;
    }
    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28,23,18,0.5);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      font-size: 1rem;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
    }
    .carousel-btn:hover { background: rgba(28,23,18,0.8); }
    .carousel-btn:active { transform: translateY(-50%) scale(0.9); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .carousel-dot.active {
      background: #fff;
      width: 14px;
      border-radius: 999px;
    }

    .card-badge-moment {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(28,23,18,0.72);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
    }
    /* Badge du banc le plus enregistré en favori (tous utilisateurs confondus).
       Placé en bas à droite : seul coin encore libre sur .card-media (heart-btn
       en haut-gauche, badge "Nouveau" en haut-droite, score-ring en bas-gauche). */
    .card-badge-favorite {
      position: absolute;
      bottom: 12px; right: 12px;
      display: flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg, var(--rust), #c2542f);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
      box-shadow: 0 2px 10px rgba(158,59,31,0.4);
    }
    .heart-btn {
      position: absolute;
      top: 10px; left: 10px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(28,23,18,0.55);
      backdrop-filter: blur(6px);
      border: none;
      color: #fff;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 4;
      transition: transform 0.15s, background 0.15s;
    }
    .heart-btn:active { transform: scale(0.88); }
    .heart-btn.is-fav { background: rgba(158,59,31,0.85); }

    .score-ring {
      position: absolute;
      bottom: 12px; left: 12px;
      width: 42px; height: 42px;
      background: rgba(28,23,18,0.7);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid rgba(184,129,58,0.6);
      z-index: 2;
    }
    .score-ring-num { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--gold3); line-height: 1; }
    .score-ring-label { font-size: 0.42rem; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    .card-body { padding: 14px 16px 16px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .card-name { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--ink); line-height: 1.2; flex: 1; }
    .card-rating { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stars { color: var(--gold); font-size: 0.85rem; letter-spacing: -1px; }
    .rating-num { font-size: 0.85rem; font-weight: 700; color: var(--ink2); }
    .card-comment {
      font-size: 0.83rem; color: var(--ink2); font-style: italic; line-height: 1.5;
      margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-criteria {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px;
      margin-bottom: 12px; background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px;
    }
    .crit-row { display: flex; justify-content: space-between; align-items: center; }
    .crit-label { font-size: 0.7rem; color: var(--ink3); }
    .crit-bar-wrap { display: flex; align-items: center; gap: 5px; }
    .crit-bar { width: 36px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .crit-fill { height: 100%; background: var(--forest3); border-radius: 999px; }
    .crit-val { font-size: 0.68rem; font-weight: 700; color: var(--forest2); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(74,140,106,0.1); border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: var(--forest2); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-author { font-size: 0.68rem; color: var(--ink3); }
    .card-author strong { color: var(--ink2); }
    .card-location { font-size: 0.68rem; color: var(--ink3); }

    .admin-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(158, 59, 31, 0.85);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .admin-delete-btn:hover { background: var(--rust); }
    .admin-delete-btn:active { transform: scale(0.94); }
    .admin-delete-btn.confirming { background: var(--rust); box-shadow: 0 0 0 2px rgba(255,255,255,0.5) inset; }

    .bench-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .bench-grid .bench-card { margin-bottom: 0; }
    .bench-grid .card-media { height: 130px; }
    .bench-grid .card-comment, .bench-grid .card-criteria, .bench-grid .card-tags { display: none; }
    .bench-grid .card-footer { flex-direction: column; align-items: flex-start; gap: 6px; }
    .bench-grid .card-name { font-size: 0.95rem; }
    .bench-grid .admin-delete-btn { font-size: 0.6rem; padding: 4px 8px; top: 6px; right: 6px; }

    .sort-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .sort-bar::-webkit-scrollbar { display: none; }

    /* --- Barre compacte "Trier & filtrer" (vue liste) ---
       Regroupe le tri et le rayon derrière un bouton repliable, pour que les
       cartes de bancs remontent nettement plus haut dans la page. */
    .list-tools-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .list-tools-toggle {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px;
      font-size: 0.75rem; font-weight: 700; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .list-tools-toggle.open { border-color: var(--forest); color: var(--forest2); }
    .list-tools-toggle:active { transform: scale(0.96); }
    .list-tools-chevron { font-size: 0.55rem; transition: transform 0.2s; }
    .list-tools-toggle.open .list-tools-chevron { transform: rotate(180deg); }
    .list-tools-summary {
      font-size: 0.7rem; color: var(--ink3); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .list-tools-panel { animation: toolsIn 0.2s ease both; }
    @keyframes toolsIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sort-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink3); white-space: nowrap; flex-shrink: 0; }
    .sort-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--surface); font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 600; color: var(--ink2); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s;
    }
    .sort-btn.active { background: var(--forest); color: white; border-color: var(--forest); }
    .sort-btn:active { transform: scale(0.94); }
    .view-toggle { display: flex; gap: 2px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 999px; padding: 3px; margin-left: auto; flex-shrink: 0; }

    .quick-actions-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .quick-action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--surface); font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 0.8rem; color: var(--forest2); cursor: pointer; transition: all 0.15s;
    }
    .quick-action-btn:hover { border-color: var(--forest3); color: var(--forest); }
    .quick-action-btn:active { transform: scale(0.96); background: var(--forest); color: #fff; border-color: var(--forest); }
    .view-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }
    .view-btn.active { background: var(--surface); box-shadow: 0 1px 4px rgba(28,23,18,0.1); }
    .location-note { font-size: 0.68rem; color: var(--ink3); margin: -8px 0 14px; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
    .page-btn {
      min-width: 36px; height: 36px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
    }
    .page-btn.active { background: var(--forest); color: white; border-color: var(--forest); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 48px 20px; color: var(--ink3); }
    .empty-state .empty-icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.6; }
    .empty-state .empty-title { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--ink2); margin-bottom: 4px; }
    .empty-state .empty-text { font-size: 0.82rem; max-width: 260px; line-height: 1.5; }

    .map-wrap { position: relative; height: calc(100dvh - var(--nav-h) - 220px); min-height: 380px; margin-top: 16px; }
    #map-container { height: 100%; width: 100%; border-radius: var(--r); overflow: hidden; z-index: 1; position: relative; }
    #map-container .leaflet-control-attribution { font-size: 8px; }
    #map-container .leaflet-tile-pane { filter: saturate(0.92) sepia(0.06) contrast(1.02); }
    #map-container .leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow) !important; border: none !important; }
    #map-container .leaflet-control-zoom a { color: var(--forest) !important; }
    .locate-btn {
      position: absolute; bottom: 16px; right: 16px; z-index: 5;
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--surface); box-shadow: var(--shadow-deep); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .locate-btn:active { transform: scale(0.92); }
    .map-empty-note { font-size: 0.72rem; color: var(--ink3); text-align: center; margin-top: 10px; }
    .map-reset-link {
      background: none; border: none; padding: 0; margin-left: 4px;
      color: var(--forest2); font-weight: 700; text-decoration: underline;
      cursor: pointer; font-size: inherit; font-family: 'Inter', sans-serif;
    }

    /* --- Bouton "Filtrer" (vue carte) --- */
    .map-filter-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px 7px 12px;
      font-size: 0.78rem; font-weight: 700; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .map-filter-btn.has-active { border-color: rgba(74,140,106,0.5); color: var(--forest2); }
    .map-filter-btn:active { transform: scale(0.96); }
    .map-filter-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .map-filter-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--forest); color: #fff; font-size: 0.62rem; font-weight: 800;
    }

    /* --- Volet latéral de filtres (drawer, glisse depuis la droite) ---
       Même logique que .sheet-overlay/.sheet-panel (bottom sheet) mais ancré à
       droite plutôt qu'en bas : justify-content: flex-end pousse le panneau
       contre le bord droit, et l'animation glisse en translateX au lieu de
       translateY. */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; justify-content: flex-end; animation: fadeIn 0.2s both;
    }
    .drawer-panel {
      background: var(--surface); width: min(86vw, 340px); height: 100%;
      overflow-y: auto; padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-deep); animation: drawerIn 0.28s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 10px; }
    .filter-hint { font-size: 0.72rem; color: var(--ink3); margin-top: 6px; }
    .filter-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .filter-switch-row .form-label { margin-bottom: 0; }

    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px 20px; text-align: center; margin-bottom: 16px; }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 0 auto 12px;
    }
    .profile-name { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--forest); margin-bottom: 2px; }
    .profile-sub { font-size: 0.78rem; color: var(--ink3); margin-bottom: 18px; }
    .profile-stats { display: flex; gap: 10px; }
    .profile-stat { flex: 1; background: var(--bg); border-radius: var(--r-sm); padding: 12px 8px; }
    .profile-stat-num { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--forest2); }
    .profile-stat-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); font-weight: 700; margin-top: 2px; }
    .profile-logout {
      width: 100%; margin-top: 16px; padding: 12px; border-radius: 999px; border: 1.5px solid rgba(158,59,31,0.25);
      background: rgba(158,59,31,0.06); color: var(--rust); font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: 'Inter', sans-serif;
    }

    /* --- GAMIFICATION (badges + progression) --- */
    .gami-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    .gami-tier-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .gami-tier-icon { font-size: 2rem; line-height: 1; }
    .gami-tier-name { font-family: 'Poppins', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--forest); }
    .gami-tier-sub { font-size: 0.72rem; color: var(--ink3); margin-top: 1px; }
    .gami-progress-track { width: 100%; height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
    .gami-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 999px; transition: width 0.4s ease; }
    .gami-progress-label { font-size: 0.68rem; color: var(--ink3); margin-top: 6px; text-align: right; }
    .gami-section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink3); font-weight: 700; margin: 18px 0 10px; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
    .badge-item {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 6px;
    }
    .badge-item.locked { opacity: 0.38; filter: grayscale(0.6); }
    .badge-icon { font-size: 1.6rem; line-height: 1; }
    .badge-label { font-size: 0.62rem; font-weight: 700; color: var(--ink2); line-height: 1.2; }
    .badge-item.locked .badge-label { color: var(--ink3); }

    /* --- SOUS-PALIERS DE BADGE (Bronze / Argent / Or / Platine) ---
       Les badges thématiques et qualité progressent maintenant à travers 4 sous-paliers.
       Chaque palier a sa propre teinte de bordure/fond et une petite pastille sous le libellé. */
    .badge-item.tier-bronze { opacity: 1; filter: none; border-color: rgba(205,127,50,0.45); background: linear-gradient(160deg, rgba(205,127,50,0.14), var(--bg)); }
    .badge-item.tier-argent { opacity: 1; filter: none; border-color: rgba(180,180,180,0.55); background: linear-gradient(160deg, rgba(190,190,190,0.18), var(--bg)); }
    .badge-item.tier-or { opacity: 1; filter: none; border-color: rgba(212,160,84,0.6); background: linear-gradient(160deg, rgba(242,201,126,0.24), var(--bg)); }
    .badge-item.tier-platine {
      opacity: 1; filter: none; border-color: rgba(163,196,210,0.75);
      background: linear-gradient(160deg, rgba(210,230,238,0.32), var(--bg));
      box-shadow: 0 0 0 1px rgba(163,196,210,0.3) inset;
    }
    .badge-tier-pill {
      font-size: 0.52rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 999px; margin-top: 2px; line-height: 1.5; white-space: nowrap;
    }
    .badge-tier-pill.tier-locked { background: var(--surface2); color: var(--ink3); }
    .badge-tier-pill.tier-bronze { background: rgba(205,127,50,0.2); color: #935c26; }
    .badge-tier-pill.tier-argent { background: rgba(150,150,150,0.22); color: #63666b; }
    .badge-tier-pill.tier-or { background: rgba(242,201,126,0.3); color: #93691c; }
    .badge-tier-pill.tier-platine { background: rgba(163,196,210,0.35); color: #3f6472; }
    html[data-theme="dark"] .badge-tier-pill.tier-bronze { color: #e6a568; }
    html[data-theme="dark"] .badge-tier-pill.tier-argent { color: #dcdcdc; }
    html[data-theme="dark"] .badge-tier-pill.tier-or { color: #f2c97e; }
    html[data-theme="dark"] .badge-tier-pill.tier-platine { color: #cfe7f0; }
    .badge-detail-tier-pill { display: inline-block; font-size: 0.62rem; padding: 4px 12px; margin-bottom: 10px; }
    .badge-detail-progress-track {
      width: 100%; height: 8px; border-radius: 999px; background: var(--bg);
      border: 1px solid var(--border); overflow: hidden; margin: 4px 0 6px;
    }
    .badge-detail-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 999px; transition: width 0.4s ease; }
    .badge-detail-progress-label { font-size: 0.68rem; color: var(--ink3); text-align: left; margin-bottom: 14px; }
    .badge-detail-levels { text-align: left; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .badge-level-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.76rem; font-weight: 600; padding: 8px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); color: var(--ink3);
    }
    .badge-level-row.reached { color: var(--ink); border-color: rgba(74,140,106,0.4); background: rgba(74,140,106,0.08); }
    .badge-level-row .lvl-check { color: var(--forest2); font-weight: 800; margin-left: 4px; }

    .badge-detail-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.2s both;
    }
    .badge-detail-card {
      background: var(--surface); border-radius: var(--r); padding: 24px; max-width: 300px; width: 100%;
      text-align: center; box-shadow: var(--shadow-deep);
    }
    .badge-detail-icon { font-size: 2.6rem; margin-bottom: 8px; }
    .badge-detail-name { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--forest); margin-bottom: 4px; }
    .badge-detail-desc { font-size: 0.8rem; color: var(--ink2); margin-bottom: 4px; }
    .badge-detail-status { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
    .badge-detail-status.unlocked { color: var(--forest2); }
    .badge-detail-status.locked { color: var(--ink3); }

    /* --- BANDEAU DE DÉBLOCAGE DE BADGE (icône + nom, auto-disparaît après 4s) --- */
    .badge-banner-wrap {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 300; width: min(92vw, 380px);
      pointer-events: none; /* laisse passer les interactions sous le bandeau, sauf sur le bandeau lui-même */
    }
    .badge-banner {
      pointer-events: auto;
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 16px;
      background: linear-gradient(135deg, var(--forest), var(--forest2));
      border: 1px solid rgba(242,201,126,0.35);
      box-shadow: 0 12px 32px rgba(28,23,18,0.35);
      cursor: pointer;
      animation: badgeBannerIn 0.5s cubic-bezier(0.22,1.4,0.4,1) both;
    }
    .badge-banner.leaving { animation: badgeBannerOut 0.28s ease-in both; }
    @keyframes badgeBannerIn {
      0% { opacity: 0; transform: translateY(-60px) scale(0.94); }
      60% { opacity: 1; transform: translateY(5px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes badgeBannerOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-24px); }
    }
    .badge-banner-icon {
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px;
      background: rgba(242,201,126,0.16); border: 1px solid rgba(242,201,126,0.3);
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .badge-banner-text { min-width: 0; }
    .badge-banner-title {
      font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--gold3);
    }
    .badge-banner-name {
      font-family: 'Poppins', sans-serif; font-size: 0.94rem; font-weight: 700; color: #fff;
      margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: flex-end; animation: fadeIn 0.2s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-panel {
      background: var(--surface); width: 100%; max-height: 88dvh; overflow-y: auto;
      border-radius: 24px 24px 0 0; padding: 10px 20px calc(28px + env(safe-area-inset-bottom));
      animation: sheetUp 0.28s cubic-bezier(0.22,1,0.36,1) both; box-shadow: var(--shadow-deep);
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; }
    .sheet-close { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink2); font-size: 1rem; cursor: pointer; flex-shrink: 0; }

    function isValidEmail(email) {
      const parts = email.split('@');
      if (parts.length !== 2) return false;
      const local = parts[0];
      const domain = parts[1];
      if (local.length < 4) return false;
      const domainParts = domain.split('.');
      if (domainParts.length < 2) return false;
      const tld = domainParts[domainParts.length - 1];
      if (tld.length < 2) return false;
      const domainRegex = /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/;
      return domainRegex.test(domain);
    }

    function haversineKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    // --- SOUS-PALIERS DE BADGE (Bronze → Argent → Or → Platine) ---

    const BADGE_TIER_LEVELS = [

    // Calcule, pour un badge à sous-paliers, le palier actuellement atteint (ou null si aucun),
    // le prochain palier à débloquer, et le pourcentage de progression vers celui-ci.
    function getBadgeTierInfo(badge, ctx) {
      const value = badge.getValue(ctx);
      let current = null;
      let next = null;
      for (const lvl of badge.levels) {
        if (value >= lvl.threshold) current = lvl;
        else { next = lvl; break; }
      }
      const prevThreshold = current ? current.threshold : 0;
      const progressPct = next
        ? Math.min(100, Math.max(0, Math.round(((value - prevThreshold) / (next.threshold - prevThreshold)) * 100)))
        : 100;
      return { value, current, next, progressPct };
    }

    // Construit le contexte de calcul des badges à partir de la liste complète des bancs
    // (nécessaire pour le badge "Pionnier", qui compare l'utilisateur aux autres) et de l'utilisateur courant.
    function computeGamificationContext(benches, user) {
      const myBenches = user ? benches.filter(b => b.userId === user.id) : [];

      const categoryCounts = myBenches.reduce((acc, b) => {
        acc[b.category] = (acc[b.category] || 0) + 1;
        return acc;
      }, {});

      const favoritesCount = benches.filter(b => b.favorite).length;

      // Plus longue série de jours consécutifs : on regarde les jours calendaires (distincts)
      // où l'utilisateur a ajouté au moins un banc, et on retient la plus longue série trouvée
      // (utilisé pour déterminer le sous-palier du badge "Fidèle").
      const uniqueDays = Array.from(new Set(myBenches.map(b => new Date(b.dateAdded).toDateString())))
        .map(d => new Date(d).getTime())
        .sort((a, b) => a - b);
      let maxStreakDays = uniqueDays.length > 0 ? 1 : 0;
      let streak = uniqueDays.length > 0 ? 1 : 0;
      for (let i = 1; i < uniqueDays.length; i++) {
        const diffDays = Math.round((uniqueDays[i] - uniqueDays[i - 1]) / 86400000);
        streak = diffDays === 1 ? streak + 1 : 1;
        if (streak > maxStreakDays) maxStreakDays = streak;
      }

      // Pionnier : pour chaque ville, on retient le banc le plus ancien (date_added) ; le nombre
      // de villes où ce "premier banc" appartient à l'utilisateur détermine son sous-palier.
      let pioneerCitiesCount = 0;
      if (user) {
        const firstByLocation = new Map();
        benches.forEach(b => {
          const key = (b.location || '').trim().toLowerCase();
          if (!key) return;
          const existing = firstByLocation.get(key);
          if (!existing || new Date(b.dateAdded) < new Date(existing.dateAdded)) {
            firstByLocation.set(key, b);
          }
        });
        pioneerCitiesCount = Array.from(firstByLocation.values()).filter(b => b.userId === user.id).length;
      }

      // Total de fois où les bancs publiés par l'utilisateur ont été mis en favori
      // par la communauté (compteur global maintenu par trigger SQL).
      const favoritesReceived = myBenches.reduce((sum, b) => sum + (b.favoritesCount || 0), 0);

      return { myBenches, categoryCounts, favoritesCount, favoritesReceived, maxStreakDays, pioneerCitiesCount };
    }

    // Détermine le niveau actuel et le prochain niveau à débloquer, pour la barre de progression.
    function getTierProgress(count) {
      let currentTier = null;
      let nextTier = null;
      for (const tier of TIER_BADGES) {
        if (count >= tier.threshold) currentTier = tier;
        else { nextTier = tier; break; }

    // (bronze, argent, or, platine) a son propre notifyId, afin qu'une progression d'un palier
    // au suivant redéclenche bien une nouvelle célébration. Utilisé par le détecteur global de
    // déblocage (au niveau de App), pour que la célébration puisse s'afficher quelle que soit
    // la page sur laquelle se trouve l'utilisateur au moment du déblocage.
    function getAllUnlockedBadges(benches, user) {
      const ctx = computeGamificationContext(benches, user);
      const totalCount = ctx.myBenches.length;
      const unlocked = [];
      TIER_BADGES.forEach(b => {
        if (totalCount >= b.threshold) unlocked.push({ ...b, notifyId: b.id });

      [...CATEGORY_BADGES, ...QUALITY_BADGES].forEach(b => {

        if (info.current) {
          unlocked.push({ ...b, tierReached: info.current.tier, notifyId: `${b.id}:${info.current.tier}` });
        }
      });
      return unlocked;
    }

              </div>

    // ============================================================

    // ============================================================
    function ImageCarousel({ images, altText }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const safeImages = images && images.length > 0 ? images : [
        "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80"
      ];
      const prevSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === 0 ? safeImages.length - 1 : prev - 1)); };
      const nextSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === safeImages.length - 1 ? 0 : prev + 1)); };
      const goToSlide = (index, e) => { e.stopPropagation(); setCurrentIndex(index); };
      return (
        <div className="card-media">
          <img src={safeImages[currentIndex]} alt={`${altText} - photo ${currentIndex + 1}`} className="carousel-img" />
          {safeImages.length > 1 && (
            <>
              <button className="carousel-btn prev" onClick={prevSlide} aria-label="Photo précédente">‹</button>
              <button className="carousel-btn next" onClick={nextSlide} aria-label="Photo suivante">›</button>
              <div className="carousel-dots">
                {safeImages.map((_, idx) => (
                  <button key={idx} className={`carousel-dot ${idx === currentIndex ? 'active' : ''}`} onClick={(e) => goToSlide(idx, e)} aria-label={`Aller à la photo ${idx + 1}`} />
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

      // ============================================================
      // 6. EFFETS : SESSION UTILISATEUR
      // ============================================================
      useEffect(() => {

      // Charge les bancs réels depuis Supabase une fois connecté
      useEffect(() => {
        if (isLoggedIn) loadBenches();

      // ============================================================
      // DÉTECTION GLOBALE DES NOUVEAUX BADGES DÉBLOQUÉS
      // ============================================================
      // Contrairement à une détection locale au composant Profil (qui ne se déclenche
      // que si on est déjà sur cette page), cet effet vit au niveau de App : il tourne
      // à chaque changement de la liste des bancs, quelle que soit la page affichée.
      // On compare les badges actuellement débloqués à l'historique connu (mémorisé en
      // localStorage, par compte) pour ne célébrer que les VRAIS nouveaux déblocages.
      useEffect(() => {
        if (!user || benchesLoading) return;
        try {
          const storageKey = `mybench-seen-badges-${user.id}`;

          // Première initialisation pour cet utilisateur : on charge son historique connu
          // (une seule fois par session, pas à chaque changement de bancs).
          if (seenBadgeIdsRef.current === null) {
            try {
              const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
              seenBadgeIdsRef.current = new Set(stored);
            } catch (err) {
              seenBadgeIdsRef.current = new Set();
            }
          }

          const unlockedNow = getAllUnlockedBadges(benches, user);
          const newlyUnlocked = unlockedNow.filter(b => !seenBadgeIdsRef.current.has(b.notifyId));

          if (newlyUnlocked.length > 0) {
            newlyUnlocked.forEach(b => seenBadgeIdsRef.current.add(b.notifyId));
            try {
              localStorage.setItem(storageKey, JSON.stringify(Array.from(seenBadgeIdsRef.current)));
            } catch (err) {
              console.error("Impossible d'enregistrer les badges vus (localStorage indisponible) :", err);
            }
            setCelebrationQueue(q => [...q, ...newlyUnlocked]);
          }
        } catch (err) {
          // Un souci dans la détection de badge ne doit jamais casser le reste de l'appli.
          console.error('Erreur lors de la détection des badges débloqués :', err);
        }
      }, [benches, user, benchesLoading]);

      // Réinitialise l'historique local à la déconnexion, pour repartir sur un état
      // neutre si un autre compte se connecte ensuite sur le même appareil.
      useEffect(() => {
        if (!user) seenBadgeIdsRef.current = null;
      }, [user]);

      function dismissCelebration() {
        setCelebrationQueue(q => q.slice(1));
      }

      async function loadBenches() {
        setBenchesLoading(true);

        // Supabase/PostgREST plafonne une requête à 1000 lignes par défaut : au-delà,
        // les bancs excédentaires disparaîtraient silencieusement. On récupère donc
        // les résultats page par page jusqu'à épuisement.
        // NB : on charge volontairement TOUS les bancs (et non une pagination
        // classique), car plusieurs fonctionnalités raisonnent sur l'ensemble du jeu
        // de données : marqueurs de la carte, statistiques, et surtout les badges
        // (le badge "Pionnier" compare l'utilisateur à tous les autres contributeurs).
        const PAGE = 1000;
        const MAX_PAGES = 20; // garde-fou : 20 000 bancs max, évite une boucle infinie
        let data = [];
        for (let page = 0; page < MAX_PAGES; page++) {
          const { data: chunk, error } = await db
            .from('benches')
            .select('*')
            .order('date_added', { ascending: false })
            .range(page * PAGE, page * PAGE + PAGE - 1);
          if (error) {
            showToast("Impossible de charger les bancs : " + error.message);
            setBenchesLoading(false);
            return;
          }
          data = data.concat(chunk || []);
          if (!chunk || chunk.length < PAGE) break; // dernière page atteinte
        }

        // Récupère les favoris propres à l'utilisateur actuellement connecté
        let favoriteIds = new Set();
        if (user) {
          const { data: favData, error: favError } = await db
            .from('favorites')
            .select('bench_id')
            .eq('user_id', user.id);
          if (favError) {
            console.error('Erreur récupération favoris:', favError);
          } else {
            favoriteIds = new Set((favData || []).map(f => f.bench_id));
          }
        }

        setBenches((data || []).map(row => ({
          id: row.id,
          name: row.name,
          location: row.location,
          lat: row.lat,
          lng: row.lng,
          category: row.category,
          rating: row.rating,
          comment: row.comment || '',
          criteria: { confort: row.confort, solidite: row.solidite },
          author: row.author,
          userId: row.user_id,
          tags: row.tags || [],
          dateAdded: row.date_added,
          favorite: favoriteIds.has(row.id),
          // Compteur global (tous utilisateurs), maintenu par trigger SQL sur la
          // table favorites. Vaut 0 si la migration favorites_count n'a pas encore
          // été appliquée (colonne absente => row.favorites_count === undefined).
          favoritesCount: row.favorites_count || 0,
          images: row.images || [],
        })));
        setBenchesLoading(false);
      }

      async function checkUserProfile(user) {
        if (!db) return;
        const { data, error } = await db.from('profiles').select('pseudo, pseudo_changes').eq('id', user.id).maybeSingle();
        if (error) {
          console.error('Erreur récupération profil:', error);
          return;

        if (data?.pseudo) {
          setPseudo(data.pseudo);

        }
      }

      // ============================================================
      // 7. AUTHENTIFICATION
      // ============================================================
      async function handleAuthSubmit(e) {
        e.preventDefault();
        if (authSubmitting) return; // Empêche un second envoi pendant que le premier est en cours
        setAuthError('');
        setAuthSuccess('');

        if (!email || !password) {
          setAuthError('Veuillez remplir tous les champs.');
          return;
        }

        if (!isValidEmail(email)) {
          setAuthError('L\'email doit contenir au moins 4 caractères avant le @ et un domaine valide (ex: abcd@domaine.com).');
          return;
        }

        setAuthSubmitting(true);
        try {
          if (authMode === 'login') {
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
              if (error.message.includes('Invalid login credentials')) {
                setAuthError('Email ou mot de passe incorrect.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            await checkUserProfile(data.user);
            setAuthSuccess('Connexion réussie !');
          } else if (authMode === 'register') {
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) {
              if (error.message.includes('User already registered')) {
                setAuthError('Désolé, cette adresse email est déjà utilisée.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            if (data.user) {
              setUser(data.user);
              setShowPseudoPage(true);
              setAuthSuccess('Inscription réussie ! Choisissez votre pseudo.');
            }
          } else if (authMode === 'forgot') {
            const { error } = await db.auth.resetPasswordForEmail(email);
            if (error) {
              setAuthError(error.message);
              return;
            }
            setAuthSuccess('Un email de réinitialisation a été envoyé à votre adresse.');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthSubmitting(false);
        }
      }

      // ============================================================
      // 8. GESTION DU PSEUDO
      // ============================================================
      async function isPseudoAvailable(pseudoToCheck) {
        const { data, error } = await db.from('profiles').select('pseudo').eq('pseudo', pseudoToCheck).maybeSingle();
        if (error) {
          console.error('Erreur vérification pseudo:', error);
          return false;
        }
        return !data;
      }

      async function handlePseudoChange(newPseudo) {
        setPseudo(newPseudo);
        pseudoCheckValueRef.current = newPseudo;
        setPseudoSuggestions([]);
        setSelectedSuggestion(null);
        setAuthError('');

        if (pseudoDebounceRef.current) clearTimeout(pseudoDebounceRef.current);
        if (!newPseudo.trim()) return;

        pseudoDebounceRef.current = setTimeout(async () => {
          const available = await isPseudoAvailable(newPseudo);
          // Si l'utilisateur a retapé entre-temps, ce résultat est obsolète : on l'ignore.
          if (pseudoCheckValueRef.current !== newPseudo) return;

          if (!available) {
            const suggestions = [];
            for (let i = 1; i <= 2; i++) {
              const candidate = newPseudo + i;
              const avail = await isPseudoAvailable(candidate);
              if (avail) suggestions.push(candidate);
            }
            // Nouvelle vérification après les appels ci-dessus, toujours pour éviter l'obsolescence.
            if (pseudoCheckValueRef.current !== newPseudo) return;
            setPseudoSuggestions(suggestions);
            setSelectedSuggestion(null);
            setAuthError('Ce pseudo est déjà pris. Voici quelques suggestions :');
          } else {
            setPseudoSuggestions([]);
            setSelectedSuggestion(null);
            setAuthError('');
          }
        }, 500);
      }

      // ============================================================
      // GESTION DU COMPTE (écran Paramètres)
      // ============================================================

      // Change le pseudo de l'utilisateur, dans la limite de 5 modifications.
      // L'identifiant du compte (user.id) n'est jamais touché : seule la colonne
      // `pseudo` de la table profiles change, et l'application répercute ensuite
      // ce nouveau nom sur la colonne `author` des bancs déjà publiés, pour que
      // les contributions passées restent attribuées au bon utilisateur.
      async function handleChangePseudo(e) {
        e.preventDefault();
        if (pseudoSaving) return;
        setPseudoMsg(null);

        const candidate = newPseudoInput.trim();
        if (!candidate) {
          setPseudoMsg({ type: 'error', text: 'Veuillez saisir un nouveau pseudo.' });
          return;
        }
        if (candidate === pseudo) {
          setPseudoMsg({ type: 'error', text: 'Ce pseudo est identique à l\'actuel.' });
          return;
        }
        if (candidate.length < 3) {
          setPseudoMsg({ type: 'error', text: 'Le pseudo doit faire au moins 3 caractères.' });
          return;
        }
        if (pseudoChanges >= PSEUDO_CHANGE_LIMIT) {
          setPseudoMsg({ type: 'error', text: 'Vous avez atteint la limite de 5 changements de pseudo.' });
          return;
        }

        setPseudoSaving(true);
        const available = await isPseudoAvailable(candidate);
        if (!available) {
          setPseudoSaving(false);
          setPseudoMsg({ type: 'error', text: 'Ce pseudo est déjà pris.' });
          return;
        }

        // Le compteur pseudo_changes est incrémenté côté serveur par un trigger :
        // on ne l'envoie donc pas ici, on le relit après coup.
        const { data, error } = await db
          .from('profiles')
          .update({ pseudo: candidate })
          .eq('id', user.id)
          .select('pseudo, pseudo_changes')
          .single();

        if (error) {
          setPseudoSaving(false);
          setPseudoMsg({ type: 'error', text: 'Erreur : ' + error.message });
          return;
        }

        // Répercussion sur les bancs déjà publiés (colonne `author`).
        const { error: benchErr } = await db
          .from('benches')
          .update({ author: candidate })
          .eq('user_id', user.id);
        if (benchErr) {
          console.error('Erreur mise à jour auteur des bancs:', benchErr);
          showToast("Pseudo changé, mais certains bancs affichent encore l'ancien nom.");
        }

        setPseudo(data.pseudo);
        setPseudoChanges(data.pseudo_changes || 0);
        setBenches(bs => bs.map(b => b.userId === user.id ? { ...b, author: candidate } : b));
        setNewPseudoInput('');
        setPseudoSaving(false);
        setPseudoMsg({
          type: 'ok',
          text: `Pseudo mis à jour. Il vous reste ${Math.max(0, PSEUDO_CHANGE_LIMIT - (data.pseudo_changes || 0))} changement(s).`
        });
      }

      // Change le mot de passe d'un utilisateur DÉJÀ connecté.
      // Supabase n'exige pas l'ancien mot de passe pour updateUser, mais on le
      // vérifie quand même via signInWithPassword : sans ça, un appareil laissé
      // déverrouillé permettrait à n'importe qui de changer le mot de passe.
      async function handleChangePassword(e) {
        e.preventDefault();
        if (pwdSaving) return;
        setPwdMsg(null);

        if (!currentPwd || !newPwd || !confirmPwd) {
          setPwdMsg({ type: 'error', text: 'Merci de remplir tous les champs.' });
          return;
        }
        if (newPwd.length < 6) {
          setPwdMsg({ type: 'error', text: 'Le nouveau mot de passe doit faire au moins 6 caractères.' });
          return;
        }
        if (newPwd !== confirmPwd) {
          setPwdMsg({ type: 'error', text: 'Les deux nouveaux mots de passe ne correspondent pas.' });
          return;
        }
        if (newPwd === currentPwd) {
          setPwdMsg({ type: 'error', text: 'Le nouveau mot de passe est identique à l\'actuel.' });
          return;
        }

        setPwdSaving(true);
        const { error: signInError } = await db.auth.signInWithPassword({
          email: user.email,
          password: currentPwd,
        });
        if (signInError) {
          setPwdSaving(false);
          setPwdMsg({ type: 'error', text: 'Mot de passe actuel incorrect.' });
          return;
        }

        const { error } = await db.auth.updateUser({ password: newPwd });
        setPwdSaving(false);
        if (error) {
          setPwdMsg({ type: 'error', text: 'Erreur : ' + error.message });
          return;
        }
        setCurrentPwd('');
        setNewPwd('');
        setConfirmPwd('');
        setPwdMsg({ type: 'ok', text: 'Mot de passe modifié avec succès.' });
      }

      // Supprime définitivement le compte via la fonction SQL delete_own_account
      // (security definer : le client n'a pas le droit de toucher à auth.users).
      // Les bancs publiés NE SONT PAS supprimés : la clé étrangère est en
      // "on delete set null", ils deviennent orphelins mais restent visibles,
      // avec le pseudo conservé dans la colonne `author`.
      async function handleDeleteAccount() {
        if (deletingAccount) return;
        if (deleteConfirmText.trim().toUpperCase() !== 'SUPPRIMER') {
          showToast('Tapez SUPPRIMER pour confirmer.');
          return;
        }
        setDeletingAccount(true);
        const { error } = await db.rpc('delete_own_account');
        if (error) {
          setDeletingAccount(false);
          showToast('Erreur lors de la suppression : ' + error.message);
          return;
        }
        await db.auth.signOut();
        setDeletingAccount(false);
        showToast('Votre compte a été supprimé. Vos bancs restent en ligne.');
      }

      // Relance une demande d'autorisation de localisation depuis les paramètres.
      function requestLocationPermission() {
        locateMe(false);
      }

      function updateDefaultView(v) {
        setDefaultView(v);
        localStorage.setItem('mybench-default-view', v);
      }

      function updateDefaultSort(s) {
        setDefaultSort(s);
        localStorage.setItem('mybench-default-sort', s);
      }

      async function handleSavePseudo(e) {
        e.preventDefault();
        let finalPseudo = pseudo;
        if (selectedSuggestion) {
          finalPseudo = selectedSuggestion;
          setPseudo(selectedSuggestion);
        }
        if (!finalPseudo.trim()) {
          setAuthError('Veuillez saisir un pseudo.');
          return;
        }

        const available = await isPseudoAvailable(finalPseudo);
        if (!available) {
          setAuthError('Ce pseudo est déjà pris. Veuillez en choisir un autre.');
          return;
        }

        const { error } = await db.from('profiles').upsert({ id: user.id, pseudo: finalPseudo.trim() });
        if (error) {
          setAuthError('Erreur lors de l\'enregistrement du pseudo : ' + error.message);
          return;
        }
        setPseudo(finalPseudo.trim());
        setIsLoggedIn(true);
        setShowPseudoPage(false);
        setAuthSuccess('Pseudo enregistré !');
      }

      // ============================================================
      // 9. FONCTIONS DE L'APPLICATION
      // ============================================================
      function showToast(msg) { setToast(msg); }

      async function handleLogout() {
        setMenuOpen(false);
        setSelectedBench(null);
        setConfirmingDelete(false);
        setShowAddForm(false);
        setView('list');
        setQuery('');
        setActiveCategory('tous');

        await db.auth.signOut();
        setUser(null);
        setPseudo(null);
        setPseudoChanges(0);
        setIsLoggedIn(false);
        setShowPseudoPage(false);
        setBenches([]);
        setBenchesLoading(true);
        setAuthMode('login');
        setEmail('');
        setPassword('');
        setAuthError('');
        setAuthSuccess('');
      }

      async function handleDeleteBench(benchId) {
        const bench = benches.find(b => b.id === benchId);
        const isAdmin = user && user.email === ADMIN_EMAIL;
        const isAuthor = user && bench && user.id === bench.userId;
        if (!user || (!isAdmin && !isAuthor)) {
          showToast("Tu ne peux supprimer que tes propres bancs.");
          return;
        }
        // Pas de window.confirm() ici : la confirmation se fait en amont, via le
        // bouton à 2 clics ("Supprimer" puis "Confirmer") côté appelant (fiche
        // détail ou carte grille). Éviter une double confirmation redondante.

        const { error } = await db.from('benches').delete().eq('id', benchId);
        if (error) {
          showToast("Erreur lors de la suppression : " + error.message);
        } else {
          setBenches(prev => prev.filter(b => b.id !== benchId));
          if (selectedBench && selectedBench.id === benchId) setSelectedBench(null);
          // La contrainte `on delete cascade` supprime déjà les signalements liés
          // côté base : on répercute la même chose côté UI pour éviter d'afficher
          // des signalements fantômes dans l'écran admin.
          setReports(rs => rs.filter(r => r.bench_id !== benchId));
          showToast("Banc supprimé avec succès.");
        }
      }

      function showUserStats(authorPseudo) {
        if (!authorPseudo) return;
        const userBenches = benches.filter(b => b.author === authorPseudo);
        const count = userBenches.length;
        const avg = count > 0 ? (userBenches.reduce((s, b) => s + b.rating, 0) / count).toFixed(1) : 0;
        setUserStats({ pseudo: authorPseudo, count, avg });
        setSelectedUserPseudo(authorPseudo);
      }

      // ============================================================
      // 10. COMPOSANT BenchCard (avec pseudo cliquable)
      // ============================================================
      function BenchCard({ item, isMostFavorited }) {
        const recent = (Date.now() - new Date(item.dateAdded).getTime()) < 3 * 86400000;
        const isAdmin = user && user.email === ADMIN_EMAIL;
        // Confirmation à 2 clics locale à CETTE carte (état propre à chaque instance de
        // BenchCard, donc jamais partagée entre deux bancs différents) : remplace l'ancien
        // window.confirm() natif, redondant avec le mécanisme déjà utilisé en fiche détail.
        const [confirmingCardDelete, setConfirmingCardDelete] = useState(false);
        // Désarme automatiquement après quelques secondes d'inactivité : une fois armé,
        // un second clic supprime immédiatement, donc il faut un moyen d'annuler sans
        // avoir à re-cliquer sur "Supprimer" (ce qui déclencherait la suppression).
        useEffect(() => {
          if (!confirmingCardDelete) return;
          const t = setTimeout(() => setConfirmingCardDelete(false), 4000);
          return () => clearTimeout(t);
        }, [confirmingCardDelete]);

        return (
          <div className="bench-card" onClick={() => setSelectedBench(item)}>
            <div style={ { position: 'relative' } }>
              <ImageCarousel images={item.images} altText={item.name} />
              <button
                className={`heart-btn ${item.favorite ? 'is-fav' : ''}`}
                onClick={(e) => toggleFavorite(item.id, e)}
                aria-label={item.favorite ? "Retirer des favoris" : "Ajouter aux favoris"}
              >
                {item.favorite ? '❤️' : '🤍'}
              </button>
              {recent && <div className="card-badge-moment">Nouveau</div>}
              <div className="score-ring">
                <span className="score-ring-num">{item.rating}</span>
                <span className="score-ring-label">Note</span>
              </div>
              {isMostFavorited && <div className="card-badge-favorite">❤️ Coup de cœur</div>}
              {isAdmin && (
                <button
                  className={`admin-delete-btn ${confirmingCardDelete ? 'confirming' : ''}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    if (confirmingCardDelete) {
                      handleDeleteBench(item.id);
                    } else {
                      setConfirmingCardDelete(true);
                    }
                  }}
                >
                  {confirmingCardDelete ? '🗑️ Confirmer ?' : '🗑️ Supprimer'}
                </button>
              )}
            </div>
            <div className="card-body">
              <div className="card-top">
                <div className="card-name">{item.name}</div>
                <div className="card-rating">
                  <span className="stars">{starsFor(item.rating)}</span>
                  <span className="rating-num">{item.rating}</span>
                </div>
              </div>
              {item.comment && <div className="card-comment">"{item.comment}"</div>}
              <div className="card-criteria">
                <div className="crit-row">
                  <span className="crit-label">Confort</span>
                  <div className="crit-bar-wrap">
                    <div className="crit-bar"><div className="crit-fill" style={ { width: item.criteria.confort + '%' } }></div></div>
                    <span className="crit-val">{item.criteria.confort}%</span>
                  </div>
                </div>
                <div className="crit-row">
                  <span className="crit-label">Solidité</span>
                  <div className="crit-bar-wrap">
                    <div className="crit-bar"><div className="crit-fill" style={ { width: item.criteria.solidite + '%' } }></div></div>
                    <span className="crit-val">{item.criteria.solidite}%</span>
                  </div>
                </div>
              </div>
              {item.tags && item.tags.length > 0 && (
                <div className="card-tags">
                  {item.tags.map((tag, idx) => <span className="tag" key={idx}>{tag}</span>)}
                </div>

              <div className="card-footer">
                <span className="card-author">
                  Par{' '}
                  <strong
                    className="clickable-pseudo"
                    onClick={(e) => {
