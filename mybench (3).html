<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bench</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M80 300 L60 360 L68 360 L90 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M130 350 L120 400 L128 400 L138 350 Z' fill='%232c2c2c'/%3E%3Cpath d='M410 290 L360 280 L362 288 L415 298 Z' fill='%232c2c2c'/%3E%3Cpath d='M460 280 L460 310 L468 310 L468 280 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 260 Q 200 380 440 250 L 440 230 Q 210 360 70 240 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 240 L 80 240 L 80 300 L 70 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M440 240 L 450 240 L 450 290 L 440 290 Z' fill='%232c2c2c'/%3E%3Cpath d='M90 280 L 480 220 L 495 230 L 120 310 Z' fill='%23b05c3a'/%3E%3Cpath d='M90 280 L 120 310 L 120 300 L 90 270 Z' fill='%239c4e2f'/%3E%3Cpath d='M40 220 L 410 160 L 410 120 L 50 180 Z' fill='%23b05c3a'/%3E%3Cpath d='M45 180 L 400 120 L 400 80 L 55 140 Z' fill='%23c46a45'/%3E%3Ccircle cx='65' cy='190' r='5' fill='%23808080'/%3E%3Ccircle cx='65' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='110' cy='280' r='5' fill='%23808080'/%3E%3Ccircle cx='150' cy='295' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='135' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='175' r='5' fill='%23808080'/%3E%3Ccircle cx='450' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='470' cy='225' r='5' fill='%23808080'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* --- TOUT LE CSS EXISTANT (inchangé) --- */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2ede4;
      --surface: #faf7f2;
      --surface2: #f0ebe1;
      --ink: #1c1712;
      --ink2: #5a5044;
      --ink3: #9c8f80;
      --forest: #1d3d2c;
      --forest2: #2e6047;
      --forest3: #4a8c6a;
      --gold: #b8813a;
      --gold2: #d4a054;
      --gold3: #f2c97e;
      --rust: #9e3b1f;
      --border: rgba(90,80,68,0.14);
      --shadow: 0 2px 20px rgba(28,23,18,0.10);
      --shadow-deep: 0 8px 40px rgba(28,23,18,0.18);
      --toast-bg: #1c1712;
      --nav-bg: rgba(250,247,242,0.96);
      --r: 20px;
      --r-sm: 12px;
      --nav-h: 74px;
    }
    /* --- MODE SOMBRE ---
       Comme presque tout le design utilise déjà des variables CSS (--bg, --surface, --ink...),
       il suffit de redéfinir ces variables quand l'attribut data-theme="dark" est posé sur <html>
       pour que TOUT le site change de thème automatiquement, sans dupliquer les styles. */
    html[data-theme="dark"] {
      --bg: #14170f;
      --surface: #1d2318;
      --surface2: #262d1f;
      --ink: #f2ede2;
      --ink2: #c9c1af;
      --ink3: #8d8672;
      --border: rgba(242,201,126,0.13);
      --shadow: 0 2px 20px rgba(0,0,0,0.35);
      --shadow-deep: 0 10px 44px rgba(0,0,0,0.55);
      --nav-bg: rgba(20,23,15,0.94);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    #root { height: 100%; display: flex; flex-direction: column; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--forest3);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }


    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 calc(var(--nav-h) + 16px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .screen::-webkit-scrollbar { display: none; }

    .app-hero {
      position: relative;
      background: var(--forest);
      padding: 52px 20px 28px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .app-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 10% 0%, rgba(184,129,58,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(74,140,106,0.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-deco {
      position: absolute;
      width: 6rem;
      height: 6rem;
      opacity: 0.05;
      bottom: 10px;
      right: 10px;
      transform: rotate(-15deg);
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }
    .hero-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }
    .hero-logo img { width: 1.1rem; height: 1.1rem; opacity: 0.8; }
    .hero-logo em { color: var(--gold3); font-style: normal; }
    .user-menu-wrap { position: relative; }
    .user-menu-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 5px 12px 5px 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-menu-btn:active { background: rgba(255,255,255,0.18); }
    .user-avatar {
      width: 26px; height: 26px;
      background: var(--gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .user-menu-chevron {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.4);
      transition: transform 0.2s;
    }
    .user-menu-btn[aria-expanded="true"] .user-menu-chevron { transform: rotate(180deg); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-deep);
      overflow: hidden;
      z-index: 60;
      min-width: 190px;
      animation: dropIn 0.18s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dropdown-user-info {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-user-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink3);
      margin-bottom: 2px;
    }
    .dropdown-user-name {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest);
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      color: var(--ink2);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .dropdown-item:active { background: var(--bg); }
    .dropdown-item.danger { color: var(--rust); }
    .dropdown-item .item-icon { font-size: 1rem; width: 20px; text-align: center; }

    .hero-greeting { position: relative; }
    .hero-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold3);
      margin-bottom: 5px;
      opacity: 0.85;
    }
    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 18px;
    }
    .hero-title em { font-style: normal; color: var(--gold3); }
    .hero-stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .hero-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .hero-stat-num {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      line-height: 1;
    }
    .hero-stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .screen-content { padding: 20px 16px 0; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: var(--r-sm);
      border: none;
      background: none;
    }
    .nav-item .nav-icon {
      font-size: 1.3rem;
      line-height: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-item .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink3);
      transition: color 0.2s;
    }
    .nav-item.active .nav-icon { transform: scale(1.2); }
    .nav-item.active .nav-label { color: var(--forest); font-weight: 700; }
    .fab {
      width: 58px; height: 58px;
      background: var(--forest);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(29,61,44,0.4);
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      margin-bottom: 4px;
      color: white;
    }
    .fab:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(29,61,44,0.3); }

    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--ink3);
      pointer-events: none;
    }
    .search-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 12px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-field:focus { border-color: var(--forest3); box-shadow: 0 0 0 3px rgba(74,140,106,0.12); }
    .search-field::placeholder { color: var(--ink3); }
    .search-clear {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: var(--ink3);
      border: none;
      color: white;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      cursor: pointer;
      line-height: 1;
    }
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink2);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      scroll-snap-align: start;
      font-family: 'Inter', sans-serif;
    }
    .chip.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .chip:active { transform: scale(0.94); }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--forest);
    }
    .section-count {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: white;
      font-size: 0.62rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      padding: 0 6px;
    }

    .bench-card {
      background: var(--surface);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      animation: slideup 0.4s cubic-bezier(0.22,1,0.36,1) both;
      will-change: transform;
      transition: transform 0.2s, box-shadow 0.3s;
      backface-visibility: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      display: block;
      position: relative;
    }
    .bench-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-deep); }
    @keyframes slideup {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-media {
      position: relative;
      height: 200px;
      background: var(--surface2);
      overflow: hidden;
    }
    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(28,23,18,0.5);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      font-size: 1rem;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
    }
    .carousel-btn:hover { background: rgba(28,23,18,0.8); }
    .carousel-btn:active { transform: translateY(-50%) scale(0.9); }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .carousel-dot.active {
      background: #fff;
      width: 14px;
      border-radius: 999px;
    }

    .card-badge-moment {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(28,23,18,0.72);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      z-index: 2;
    }
    .heart-btn {
      position: absolute;
      top: 10px; left: 10px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(28,23,18,0.55);
      backdrop-filter: blur(6px);
      border: none;
      color: #fff;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 4;
      transition: transform 0.15s, background 0.15s;
    }
    .heart-btn:active { transform: scale(0.88); }
    .heart-btn.is-fav { background: rgba(158,59,31,0.85); }

    .score-ring {
      position: absolute;
      bottom: 12px; left: 12px;
      width: 42px; height: 42px;
      background: rgba(28,23,18,0.7);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid rgba(184,129,58,0.6);
      z-index: 2;
    }
    .score-ring-num { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--gold3); line-height: 1; }
    .score-ring-label { font-size: 0.42rem; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    .card-body { padding: 14px 16px 16px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .card-name { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--ink); line-height: 1.2; flex: 1; }
    .card-rating { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stars { color: var(--gold); font-size: 0.85rem; letter-spacing: -1px; }
    .rating-num { font-size: 0.85rem; font-weight: 700; color: var(--ink2); }
    .card-comment {
      font-size: 0.83rem; color: var(--ink2); font-style: italic; line-height: 1.5;
      margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-criteria {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px;
      margin-bottom: 12px; background: var(--bg); border-radius: var(--r-sm); padding: 10px 12px;
    }
    .crit-row { display: flex; justify-content: space-between; align-items: center; }
    .crit-label { font-size: 0.7rem; color: var(--ink3); }
    .crit-bar-wrap { display: flex; align-items: center; gap: 5px; }
    .crit-bar { width: 36px; height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .crit-fill { height: 100%; background: var(--forest3); border-radius: 999px; }
    .crit-val { font-size: 0.68rem; font-weight: 700; color: var(--forest2); }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(74,140,106,0.1); border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: var(--forest2); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-author { font-size: 0.68rem; color: var(--ink3); }
    .card-author strong { color: var(--ink2); }
    .card-location { font-size: 0.68rem; color: var(--ink3); }

    .admin-delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(158, 59, 31, 0.85);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .admin-delete-btn:hover { background: var(--rust); }
    .admin-delete-btn:active { transform: scale(0.94); }

    .view-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: none; background: transparent; cursor: pointer; font-size: 0.9rem; transition: background 0.15s; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }

    .empty-state .empty-title { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--ink2); margin-bottom: 4px; }
    .empty-state .empty-text { font-size: 0.82rem; max-width: 260px; line-height: 1.5; }

    .map-wrap { position: relative; height: calc(100dvh - var(--nav-h) - 220px); min-height: 380px; margin-top: 16px; }
    #map-container { height: 100%; width: 100%; border-radius: var(--r); overflow: hidden; z-index: 1; position: relative; }
    #map-container .leaflet-control-attribution { font-size: 8px; }

    #map-container .leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow) !important; border: none !important; }
    #map-container .leaflet-control-zoom a { color: var(--forest) !important; }
    .locate-btn {

    }

    .map-empty-note { font-size: 0.72rem; color: var(--ink3); text-align: center; margin-top: 10px; }

    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 24px 20px; text-align: center; margin-bottom: 16px; }

    .profile-sub { font-size: 0.78rem; color: var(--ink3); margin-bottom: 18px; }

    .profile-stat-num { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--forest2); }
    .profile-stat-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); font-weight: 700; margin-top: 2px; }
    .profile-logout {
      width: 100%; margin-top: 16px; padding: 12px; border-radius: 999px; border: 1.5px solid rgba(158,59,31,0.25);
      background: rgba(158,59,31,0.06); color: var(--rust); font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: 'Inter', sans-serif;
    }

    /* --- GAMIFICATION (badges + progression) --- */
    .gami-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    .gami-tier-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .gami-tier-icon { font-size: 2rem; line-height: 1; }
    .gami-tier-name { font-family: 'Poppins', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--forest); }
    .gami-tier-sub { font-size: 0.72rem; color: var(--ink3); margin-top: 1px; }
    .gami-progress-track { width: 100%; height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
    .gami-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold3)); border-radius: 999px; transition: width 0.4s ease; }
    .gami-progress-label { font-size: 0.68rem; color: var(--ink3); margin-top: 6px; text-align: right; }
    .gami-section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink3); font-weight: 700; margin: 18px 0 10px; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
    .badge-item {

    .badge-label { font-size: 0.62rem; font-weight: 700; color: var(--ink2); line-height: 1.2; }
    .badge-item.locked .badge-label { color: var(--ink3); }

    .badge-detail-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.2s both;

    .badge-detail-card {

    .badge-detail-icon { font-size: 2.6rem; margin-bottom: 8px; }

    .badge-detail-desc { font-size: 0.8rem; color: var(--ink2); margin-bottom: 4px; }
    .badge-detail-status { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
    .badge-detail-status.unlocked { color: var(--forest2); }
    .badge-detail-status.locked { color: var(--ink3); }

    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(28,23,18,0.5); backdrop-filter: blur(2px);
      z-index: 100; display: flex; align-items: flex-end; animation: fadeIn 0.2s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-panel {
      background: var(--surface); width: 100%; max-height: 88dvh; overflow-y: auto;
      border-radius: 24px 24px 0 0; padding: 10px 20px calc(28px + env(safe-area-inset-bottom));

    }

    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }

    .sheet-close { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink2); font-size: 1rem; cursor: pointer; flex-shrink: 0; }
    .detail-media { height: 220px; border-radius: var(--r-sm); overflow: hidden; margin-bottom: 16px; position: relative; }
    .detail-name { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--ink); line-height: 1.15; }
    .detail-meta { font-size: 0.78rem; color: var(--ink3); margin: 6px 0 16px; }

    .detail-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-secondary, .btn-primary, .btn-danger {
      flex: 1; padding: 13px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      border: 1.5px solid transparent; font-family: 'Inter', sans-serif; transition: transform 0.15s, background 0.2s;
    }
    .btn-primary { background: var(--forest); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--ink2); border-color: var(--border); }
    .btn-danger { background: rgba(158,59,31,0.08); color: var(--rust); border-color: rgba(158,59,31,0.25); }
    .btn-danger.confirming { background: var(--rust); color: #fff; }
    .btn-primary:active, .btn-secondary:active, .btn-danger:active { transform: scale(0.97); }

    .form-field { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); margin-bottom: 6px; }
    .form-input, .form-textarea {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--ink); outline: none;
      transition: border-color 0.2s;

    .form-row { display: flex; gap: 12px; }

    .star-picker { display: flex; gap: 6px; }

    .star-picker button.filled { color: var(--gold); }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input[type="range"] { flex: 1; accent-color: var(--forest3); }
    .range-val { font-size: 0.75rem; font-weight: 700; color: var(--forest2); width: 34px; text-align: right; }
    .form-error { color: var(--rust); font-size: 0.78rem; margin-bottom: 12px; }
    .geo-btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 8px 14px; font-size: 0.78rem; font-weight: 600; color: var(--ink2);
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .geo-btn.done { color: var(--forest2); border-color: rgba(74,140,106,0.4); }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--toast-bg); color: #fff; padding: 11px 20px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; z-index: 200; box-shadow: var(--shadow-deep);
      animation: toastIn 0.25s cubic-bezier(0.22,1,0.36,1) both; max-width: 88vw; text-align: center;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .home-screen {
      position: relative;
      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, #2e6047 0%, var(--forest) 55%, #142a1e 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .home-blob-1 { width: 320px; height: 320px; background: var(--gold); top: -80px; left: -60px; }
    .home-blob-2 { width: 260px; height: 260px; background: var(--forest3); bottom: 60px; right: 40px; animation-duration: 20s; animation-delay: -4s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 25px) scale(1.12); }
    }
    .home-watermark {
      position: absolute;
      width: 22rem;
      height: 22rem;
      opacity: 0.05;
      right: -4rem;
      bottom: -3rem;
      transform: rotate(-12deg);
      pointer-events: none;
      animation: bob 6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(-12deg) translateY(-14px); }
    }
    .home-content {
      position: relative;
      z-index: 2;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .home-content > * {
      opacity: 0;
      animation: homeFadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes homeFadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .home-logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation-name: homeFadeUp, badgeFloat;
      animation-duration: 0.7s, 3.2s;
      animation-timing-function: cubic-bezier(0.22,1,0.36,1), ease-in-out;
      animation-iteration-count: 1, infinite;
      animation-delay: inherit, 0.9s;
    }
    .home-logo-badge img { width: 30px; height: 30px; }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .home-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold3);
      margin-bottom: 10px;
      opacity: 0.9;
    }
    .home-title {
      font-family: 'Poppins', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .home-subtitle {
      font-size: 0.92rem;
      color: rgba(255,255,255,0.72);
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .auth-form {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,0.15);

      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
      transition: color 0.2s;

    .auth-form .btn-primary {
      width: 100%;
      margin-top: 6px;
      background: var(--gold3);
      color: var(--forest);
      font-weight: 800;
    }
    .auth-form .btn-primary:hover { background: #f2d48a; }
    .auth-form .btn-primary:active { transform: scale(0.97); }

    .home-hint {
      margin-top: 14px;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.4);
    }

    .pseudo-page {

      height: 100%;
      width: 100%;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, #2e6047 0%, var(--forest) 55%, #142a1e 100%);

      align-items: center;

    .clickable-pseudo {

      margin: 16px 0;

    .user-stat-card {
      background: var(--bg);

    .user-stat-number {
      font-family: 'Poppins', sans-serif;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ============================================================
    // 1. CONFIGURATION SUPABASE

    const SUPABASE_URL = "https://kxiwylpjbevysbjgjbss.supabase.co";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================

    // ============================================================
    function isValidEmail(email) {
      const parts = email.split('@');
      if (parts.length !== 2) return false;
      const local = parts[0];
      const domain = parts[1];
      if (local.length < 4) return false;
      const domainParts = domain.split('.');
      if (domainParts.length < 2) return false;
      const tld = domainParts[domainParts.length - 1];
      if (tld.length < 2) return false;
      const domainRegex = /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/;
      return domainRegex.test(domain);
    }

    // ============================================================
    // 3. DONNÉES ET UTILITAIRES
    // ============================================================
    const benchSVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M80 300 L60 360 L68 360 L90 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M130 350 L120 400 L128 400 L138 350 Z' fill='%232c2c2c'/%3E%3Cpath d='M410 290 L360 280 L362 288 L415 298 Z' fill='%232c2c2c'/%3E%3Cpath d='M460 280 L460 310 L468 310 L468 280 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 260 Q 200 380 440 250 L 440 230 Q 210 360 70 240 Z' fill='%232c2c2c'/%3E%3Cpath d='M70 240 L 80 240 L 80 300 L 70 300 Z' fill='%232c2c2c'/%3E%3Cpath d='M440 240 L 450 240 L 450 290 L 440 290 Z' fill='%232c2c2c'/%3E%3Cpath d='M90 280 L 480 220 L 495 230 L 120 310 Z' fill='%23b05c3a'/%3E%3Cpath d='M90 280 L 120 310 L 120 300 L 90 270 Z' fill='%239c4e2f'/%3E%3Cpath d='M40 220 L 410 160 L 410 120 L 50 180 Z' fill='%23b05c3a'/%3E%3Cpath d='M45 180 L 400 120 L 400 80 L 55 140 Z' fill='%23c46a45'/%3E%3Ccircle cx='65' cy='190' r='5' fill='%23808080'/%3E%3Ccircle cx='65' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='110' cy='280' r='5' fill='%23808080'/%3E%3Ccircle cx='150' cy='295' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='135' r='5' fill='%23808080'/%3E%3Ccircle cx='390' cy='175' r='5' fill='%23808080'/%3E%3Ccircle cx='450' cy='230' r='5' fill='%23808080'/%3E%3Ccircle cx='470' cy='225' r='5' fill='%23808080'/%3E%3C/svg%3E`;
    const benchImageSrc = benchSVG;

    const CATEGORY_META = {
      parc: { label: 'Parc', icon: '🌳' },
      urbain: { label: 'Urbain', icon: '🏙️' },
      mer: { label: 'Bord de mer', icon: '🌊' },

    };

    const PAGE_SIZE = 4;

    function daysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }
    function haversineKm(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }
    function starsFor(rating) {
      const r = Math.round(rating);
      return '★'.repeat(r) + '☆'.repeat(5 - r);

    function formatDate(iso) {

    // Les bancs ne sont plus codés en dur : ils sont chargés depuis

    // ============================================================

    // Paliers généraux : débloqués selon le nombre total de bancs ajoutés par l'utilisateur.
    const TIER_BADGES = [
      { id: 'tier1', icon: '🟢', label: 'Chercheur de Repos', threshold: 1 },
      { id: 'tier2', icon: '🥈', label: 'Dénicheur de Bancs', threshold: 5 },
      { id: 'tier3', icon: '🥇', label: 'Cartographe des Parcs', threshold: 15 },
      { id: 'tier4', icon: '💎', label: 'Maître de la Pause', threshold: 30 },
      { id: 'tier5', icon: '👑', label: 'Légende de l\'Assise', threshold: 50 },
    ];

    // Badges thématiques : basés sur la catégorie des bancs ajoutés par l'utilisateur.
    const CATEGORY_BADGES = [
      { id: 'forestier', icon: '🌲', label: 'Garde-Forestier', desc: '3 bancs en bois', check: (ctx) => (ctx.categoryCounts.bois || 0) >= 3 },
      { id: 'loupdemer', icon: '🌊', label: 'Loup de Mer', desc: '3 bancs au bord de mer', check: (ctx) => (ctx.categoryCounts.mer || 0) >= 3 },
      { id: 'citadin', icon: '🏙️', label: 'Citadin Posé', desc: '5 bancs en ville', check: (ctx) => (ctx.categoryCounts.urbain || 0) >= 5 },
      { id: 'mainverte', icon: '🌻', label: 'Main Verte', desc: '5 bancs en parc', check: (ctx) => (ctx.categoryCounts.parc || 0) >= 5 },
      { id: 'passepartout', icon: '🌈', label: 'Passe-Partout', desc: 'Au moins un banc dans chaque catégorie', check: (ctx) => Object.keys(CATEGORY_META).every(cat => (ctx.categoryCounts[cat] || 0) >= 1) },
    ];

    // Badges qualité & interaction : basés sur le contenu des fiches et l'activité du compte.
    const QUALITY_BADGES = [
      { id: 'pepite', icon: '💎', label: 'Pépite Cachée', desc: 'Confort et solidité au-dessus de 90% sur un banc', check: (ctx) => ctx.myBenches.some(b => b.criteria.confort > 90 && b.criteria.solidite > 90) },
      { id: 'photographe', icon: '📸', label: 'Photographe Né', desc: '3 photos ou plus sur une même fiche', check: (ctx) => ctx.myBenches.some(b => (b.images || []).length >= 3) },
      { id: 'romancier', icon: '📖', label: 'Romancier', desc: 'Un commentaire de plus de 100 caractères', check: (ctx) => ctx.myBenches.some(b => (b.comment || '').length > 100) },
      { id: 'verifie', icon: '🕒', label: 'Vérifié récemment', desc: 'Un banc ajouté ces 3 derniers mois', check: (ctx) => ctx.myBenches.some(b => (Date.now() - new Date(b.dateAdded).getTime()) < 90 * 86400000) },
      { id: 'collectionneur', icon: '📌', label: 'Collectionneur', desc: '10 favoris', check: (ctx) => ctx.favoritesCount >= 10 },
      { id: 'fidele', icon: '☕', label: 'Fidèle', desc: '3 jours d\'affilée à contribuer', check: (ctx) => ctx.hasThreeDayStreak },
      { id: 'pionnier', icon: '📍', label: 'Pionnier', desc: 'Premier banc ajouté dans une ville', check: (ctx) => ctx.isPioneerSomewhere },
    ];

    // Construit le contexte de calcul des badges à partir de la liste complète des bancs
    // (nécessaire pour le badge "Pionnier", qui compare l'utilisateur aux autres) et de l'utilisateur courant.
    function computeGamificationContext(benches, user) {
      const myBenches = user ? benches.filter(b => b.userId === user.id) : [];

      const categoryCounts = myBenches.reduce((acc, b) => {
        acc[b.category] = (acc[b.category] || 0) + 1;
        return acc;
      }, {});

      const favoritesCount = benches.filter(b => b.favorite).length;

      // Série de jours consécutifs : on regarde les jours calendaires (distincts) où
      // l'utilisateur a ajouté au moins un banc, et on cherche 3 jours de suite.
      const uniqueDays = Array.from(new Set(myBenches.map(b => new Date(b.dateAdded).toDateString())))
        .map(d => new Date(d).getTime())
        .sort((a, b) => a - b);
      let hasThreeDayStreak = false;
      let streak = uniqueDays.length > 0 ? 1 : 0;
      for (let i = 1; i < uniqueDays.length; i++) {
        const diffDays = Math.round((uniqueDays[i] - uniqueDays[i - 1]) / 86400000);
        streak = diffDays === 1 ? streak + 1 : 1;
        if (streak >= 3) { hasThreeDayStreak = true; break; }
      }

      // Pionnier : pour chaque ville, on retient le banc le plus ancien (date_added) ;
      // si l'un de ces "premiers bancs" appartient à l'utilisateur, il est pionnier quelque part.
      let isPioneerSomewhere = false;
      if (user) {
        const firstByLocation = new Map();
        benches.forEach(b => {
          const key = (b.location || '').trim().toLowerCase();
          if (!key) return;
          const existing = firstByLocation.get(key);
          if (!existing || new Date(b.dateAdded) < new Date(existing.dateAdded)) {
            firstByLocation.set(key, b);
          }
        });
        isPioneerSomewhere = Array.from(firstByLocation.values()).some(b => b.userId === user.id);
      }

      return { myBenches, categoryCounts, favoritesCount, hasThreeDayStreak, isPioneerSomewhere };
    }

    // Détermine le palier actuel et le prochain palier à débloquer, pour la barre de progression.
    function getTierProgress(count) {
      let currentTier = null;
      let nextTier = null;
      for (const tier of TIER_BADGES) {
        if (count >= tier.threshold) currentTier = tier;
        else { nextTier = tier; break; }
      }
      return { currentTier, nextTier };
    }

    // ============================================================
    // 3ter. COMPOSANT GamificationCard (profil)
    // ============================================================
    function GamificationCard({ benches, user }) {
      const [openBadge, setOpenBadge] = useState(null); // badge affiché en détail (overlay)

      const ctx = useMemo(() => computeGamificationContext(benches, user), [benches, user]);
      const totalCount = ctx.myBenches.length;
      const { currentTier, nextTier } = useMemo(() => getTierProgress(totalCount), [totalCount]);

      const prevThreshold = currentTier ? currentTier.threshold : 0;
      const progressPct = nextTier
        ? Math.min(100, Math.round(((totalCount - prevThreshold) / (nextTier.threshold - prevThreshold)) * 100))
        : 100;

      function renderBadge(badge, unlocked) {
        return (
          <button
            key={badge.id}
            type="button"
            className={`badge-item ${unlocked ? '' : 'locked'}`}
            onClick={() => setOpenBadge({ ...badge, unlocked })}
          >
            <span className="badge-icon">{badge.icon}</span>
            <span className="badge-label">{badge.label}</span>
          </button>
        );
      }

      return (
        <div className="gami-card">
          <div className="gami-tier-row">
            <span className="gami-tier-icon">{currentTier ? currentTier.icon : '🌱'}</span>
            <div>
              <div className="gami-tier-name">{currentTier ? currentTier.label : 'Pas encore de banc ajouté'}</div>
              <div className="gami-tier-sub">{totalCount} banc{totalCount > 1 ? 's' : ''} ajouté{totalCount > 1 ? 's' : ''}</div>
            </div>
          </div>
          <div className="gami-progress-track">
            <div className="gami-progress-fill" style={{ width: `${progressPct}%` }} />
          </div>
          <div className="gami-progress-label">
            {nextTier ? `${totalCount}/${nextTier.threshold} vers "${nextTier.label}"` : 'Niveau maximum atteint 👑'}
          </div>

          <div className="gami-section-title">Paliers</div>
          <div className="badge-grid">
            {TIER_BADGES.map(b => renderBadge(b, totalCount >= b.threshold))}
          </div>

          <div className="gami-section-title">Badges thématiques</div>
          <div className="badge-grid">
            {CATEGORY_BADGES.map(b => renderBadge(b, b.check(ctx)))}
          </div>

          <div className="gami-section-title">Qualité & interaction</div>
          <div className="badge-grid">
            {QUALITY_BADGES.map(b => renderBadge(b, b.check(ctx)))}
          </div>

          {openBadge && (
            <div className="badge-detail-overlay" onClick={() => setOpenBadge(null)}>
              <div className="badge-detail-card" onClick={(e) => e.stopPropagation()}>
                <div className="badge-detail-icon" style={{ opacity: openBadge.unlocked ? 1 : 0.35, filter: openBadge.unlocked ? 'none' : 'grayscale(0.6)' }}>{openBadge.icon}</div>
                <div className="badge-detail-name">{openBadge.label}</div>
                <div className="badge-detail-desc">{openBadge.desc || `${openBadge.threshold} banc${openBadge.threshold > 1 ? 's' : ''} ajouté${openBadge.threshold > 1 ? 's' : ''}`}</div>
                <div className={`badge-detail-status ${openBadge.unlocked ? 'unlocked' : 'locked'}`}>
                  {openBadge.unlocked ? '✓ Débloqué' : '🔒 Verrouillé'}
                </div>
                <button className="btn-secondary" style={{ width: '100%' }} onClick={() => setOpenBadge(null)}>Fermer</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const EMPTY_FORM = {
      name: '', location: '', category: 'parc', rating: 5,
      confort: 70, solidite: 70, comment: '',
      tags: [],
      lat: null, lng: null,
      img1: '', img2: '', img3: ''   // stockent les data URLs

    // ============================================================
    // 4. COMPOSANT CARROUSEL
    // ============================================================
    function ImageCarousel({ images, altText }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const safeImages = images && images.length > 0 ? images : [
        "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?auto=format&fit=crop&w=800&q=80"

      const prevSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === 0 ? safeImages.length - 1 : prev - 1)); };
      const nextSlide = (e) => { e.stopPropagation(); setCurrentIndex((prev) => (prev === safeImages.length - 1 ? 0 : prev + 1)); };
      const goToSlide = (index, e) => { e.stopPropagation(); setCurrentIndex(index); };
      return (
        <div className="card-media">
          <img src={safeImages[currentIndex]} alt={`${altText} - photo ${currentIndex + 1}`} className="carousel-img" />

              <div className="carousel-dots">
                {safeImages.map((_, idx) => (

    // ============================================================

    function App() {

      // --- États de l'application ---

      const [view, setView] = useState('list');

      const [page, setPage] = useState(1);

      const [confirmingDelete, setConfirmingDelete] = useState(false);
      const [showAddForm, setShowAddForm] = useState(false);

      // --- Pour les stats utilisateur ---

      // --- Mode sombre ---
      const [darkMode, setDarkMode] = useState(() => {

      // --- Autocomplétion de ville (formulaire d'ajout) ---

      const [authSubmitting, setAuthSubmitting] = useState(false);
      const [addSubmitting, setAddSubmitting] = useState(false);

      // --- Taille de texte (accessibilité) ---
      const [fontScale, setFontScale] = useState(() => localStorage.getItem('mybench-font-scale') || 'normal');

      // --- Rayon de recherche réglable ---

      const pseudoDebounceRef = useRef(null);
      const pseudoCheckValueRef = useRef('');

      const menuRef = useRef(null);

      // ============================================================
      // 6. EFFETS : SESSION UTILISATEUR
      // ============================================================
      useEffect(() => {
        db.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            setUser(session.user);
            checkUserProfile(session.user);
          }
        });
        const { data: authListener } = db.auth.onAuthStateChange(async (_event, session) => {
          if (session?.user) {
            setUser(session.user);
            await checkUserProfile(session.user);
          } else {
            setUser(null);
            setPseudo(null);
            setIsLoggedIn(false);
            setShowPseudoPage(false);
          }
        });
        return () => authListener.subscription.unsubscribe();
      }, []);

      // Charge les bancs réels depuis Supabase une fois connecté
      useEffect(() => {
        if (isLoggedIn) loadBenches();
      }, [isLoggedIn]);

      async function loadBenches() {
        setBenchesLoading(true);
        const { data, error } = await db.from('benches').select('*').order('date_added', { ascending: false });
        if (error) {
          showToast("Impossible de charger les bancs : " + error.message);
          setBenchesLoading(false);
          return;
        }

        // Récupère les favoris propres à l'utilisateur actuellement connecté
        let favoriteIds = new Set();
        if (user) {
          const { data: favData, error: favError } = await db
            .from('favorites')
            .select('bench_id')
            .eq('user_id', user.id);
          if (favError) {
            console.error('Erreur récupération favoris:', favError);
          } else {
            favoriteIds = new Set((favData || []).map(f => f.bench_id));
          }
        }

        setBenches((data || []).map(row => ({
          id: row.id,
          name: row.name,
          location: row.location,
          lat: row.lat,
          lng: row.lng,
          category: row.category,
          rating: row.rating,
          comment: row.comment || '',
          criteria: { confort: row.confort, solidite: row.solidite },
          author: row.author,
          userId: row.user_id,
          tags: row.tags || [],
          dateAdded: row.date_added,
          favorite: favoriteIds.has(row.id),
          images: row.images || [],
        })));
        setBenchesLoading(false);
      }

      async function checkUserProfile(user) {
        if (!db) return;
        const { data, error } = await db.from('profiles').select('pseudo').eq('id', user.id).maybeSingle();
        if (error) {
          console.error('Erreur récupération profil:', error);
          return;
        }
        if (data?.pseudo) {
          setPseudo(data.pseudo);
          setIsLoggedIn(true);
          setShowPseudoPage(false);
        } else {
          setShowPseudoPage(true);
          setIsLoggedIn(false);
        }
      }

      // ============================================================
      // 7. AUTHENTIFICATION
      // ============================================================
      async function handleAuthSubmit(e) {
        e.preventDefault();
        if (authSubmitting) return; // Empêche un second envoi pendant que le premier est en cours
        setAuthError('');
        setAuthSuccess('');

        if (!email || !password) {
          setAuthError('Veuillez remplir tous les champs.');
          return;
        }

        if (!isValidEmail(email)) {
          setAuthError('L\'email doit contenir au moins 4 caractères avant le @ et un domaine valide (ex: abcd@domaine.com).');
          return;
        }

        setAuthSubmitting(true);
        try {
          if (authMode === 'login') {
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
              if (error.message.includes('Invalid login credentials')) {
                setAuthError('Email ou mot de passe incorrect.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            await checkUserProfile(data.user);
            setAuthSuccess('Connexion réussie !');
          } else if (authMode === 'register') {
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) {
              if (error.message.includes('User already registered')) {
                setAuthError('Désolé, cette adresse email est déjà utilisée.');
              } else {
                setAuthError(error.message);
              }
              return;
            }
            if (data.user) {
              setUser(data.user);
              setShowPseudoPage(true);
              setAuthSuccess('Inscription réussie ! Choisissez votre pseudo.');
            }
          } else if (authMode === 'forgot') {
            const { error } = await db.auth.resetPasswordForEmail(email);
            if (error) {
              setAuthError(error.message);
              return;
            }
            setAuthSuccess('Un email de réinitialisation a été envoyé à votre adresse.');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthSubmitting(false);
        }
      }

      // ============================================================
      // 8. GESTION DU PSEUDO
      // ============================================================
      async function isPseudoAvailable(pseudoToCheck) {
        const { data, error } = await db.from('profiles').select('pseudo').eq('pseudo', pseudoToCheck).maybeSingle();
        if (error) {
          console.error('Erreur vérification pseudo:', error);
          return false;
        }
        return !data;
      }

      async function handlePseudoChange(newPseudo) {
        setPseudo(newPseudo);
        pseudoCheckValueRef.current = newPseudo;
        setPseudoSuggestions([]);
        setSelectedSuggestion(null);
        setAuthError('');

        if (pseudoDebounceRef.current) clearTimeout(pseudoDebounceRef.current);
        if (!newPseudo.trim()) return;

        pseudoDebounceRef.current = setTimeout(async () => {
          const available = await isPseudoAvailable(newPseudo);
          // Si l'utilisateur a retapé entre-temps, ce résultat est obsolète : on l'ignore.
          if (pseudoCheckValueRef.current !== newPseudo) return;

          if (!available) {
            const suggestions = [];
            for (let i = 1; i <= 2; i++) {
              const candidate = newPseudo + i;
              const avail = await isPseudoAvailable(candidate);
              if (avail) suggestions.push(candidate);
            }
            // Nouvelle vérification après les appels ci-dessus, toujours pour éviter l'obsolescence.
            if (pseudoCheckValueRef.current !== newPseudo) return;
            setPseudoSuggestions(suggestions);
            setSelectedSuggestion(null);
            setAuthError('Ce pseudo est déjà pris. Voici quelques suggestions :');
          } else {
            setPseudoSuggestions([]);
            setSelectedSuggestion(null);
            setAuthError('');
          }
        }, 500);
      }

      async function handleSavePseudo(e) {
        e.preventDefault();
        let finalPseudo = pseudo;
        if (selectedSuggestion) {
          finalPseudo = selectedSuggestion;
          setPseudo(selectedSuggestion);
        }
        if (!finalPseudo.trim()) {
          setAuthError('Veuillez saisir un pseudo.');
          return;
        }

        const available = await isPseudoAvailable(finalPseudo);
        if (!available) {
          setAuthError('Ce pseudo est déjà pris. Veuillez en choisir un autre.');
          return;
        }

        const { error } = await db.from('profiles').upsert({ id: user.id, pseudo: finalPseudo.trim() });
        if (error) {
          setAuthError('Erreur lors de l\'enregistrement du pseudo : ' + error.message);
          return;
        }
        setPseudo(finalPseudo.trim());
        setIsLoggedIn(true);
        setShowPseudoPage(false);
        setAuthSuccess('Pseudo enregistré !');
      }

      async function handleDeleteBench(benchId) {
        const bench = benches.find(b => b.id === benchId);
        const isAdmin = user && user.email === ADMIN_EMAIL;
        const isAuthor = user && bench && user.id === bench.userId;
        if (!user || (!isAdmin && !isAuthor)) {
          showToast("Tu ne peux supprimer que tes propres bancs.");
          return;
        }
        if (!confirm("Es-tu sûr de vouloir supprimer ce banc ?")) return;

        const { error } = await db.from('benches').delete().eq('id', benchId);
        if (error) {
          showToast("Erreur lors de la suppression : " + error.message);
        } else {
          setBenches(prev => prev.filter(b => b.id !== benchId));
          if (selectedBench && selectedBench.id === benchId) setSelectedBench(null);
          showToast("Banc supprimé avec succès.");
        }
      }

      function showUserStats(authorPseudo) {
        if (!authorPseudo) return;
        const userBenches = benches.filter(b => b.author === authorPseudo);
        const count = userBenches.length;
        const avg = count > 0 ? (userBenches.reduce((s, b) => s + b.rating, 0) / count).toFixed(1) : 0;
        setUserStats({ pseudo: authorPseudo, count, avg });
        setSelectedUserPseudo(authorPseudo);
      }

      function Pagination() {
        if (totalPages <= 1) return null;
        return (
          <div className="pagination">
            <button className="page-btn" disabled={pageSafe === 1} onClick={() => setPage(p => Math.max(1, p - 1))}>←</button>

      // ============================================================
      // 12. LOGIQUE DE FILTRE, TRI, MAP
      // ============================================================
      useEffect(() => {

        };
        const onKey = (e) => {

        document.addEventListener("keydown", onKey);

      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      // Applique le thème sur toute la page (via l'attribut data-theme sur <html>,
      // que tout le CSS écoute grâce aux variables --bg/--surface/--ink etc.)
      // et retient le choix de l'utilisateur pour sa prochaine visite.
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        localStorage.setItem('mybench-theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      // La taille de texte ajuste la taille de police de la page <html> :
      // comme presque toutes les tailles du site sont en "rem" (relatives à cette base),
      // tout le texte de l'application s'agrandit ou se réduit proportionnellement.
      useEffect(() => {
        const sizes = { petit: '87.5%', normal: '100%', grand: '115%' };
        document.documentElement.style.fontSize = sizes[fontScale] || sizes.normal;
        localStorage.setItem('mybench-font-scale', fontScale);
      }, [fontScale]);

      useEffect(() => { setPage(1); }, [query, activeCategory, sortBy, view]);

      const baseList = view === 'favoris' ? benches.filter(b => b.favorite)
        : view === 'contributions' ? benches.filter(b => user && b.userId === user.id)
        : benches;
      const filteredSorted = useMemo(() => {
        let out = baseList;
        if (view === 'list') {
          if (query.trim()) {
            const q = query.trim().toLowerCase();
            out = out.filter(b => b.name.toLowerCase().includes(q) || b.location.toLowerCase().includes(q));
          }
          if (activeCategory !== 'tous') {
            out = out.filter(b => b.category === activeCategory);
          }
          if (searchRadiusKm != null && userLocation) {
            out = out.filter(b => b.lat != null && b.lng != null && haversineKm(userLocation, b) <= searchRadiusKm);
          }
          out = [...out];
          if (sortBy === 'note') out.sort((a, b) => b.rating - a.rating);
          else if (sortBy === 'recent') out.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
          else if (sortBy === 'distance') {
            if (userLocation) {
              out.sort((a, b) => {
                const da = (a.lat != null) ? haversineKm(userLocation, a) : Infinity;
                const db = (b.lat != null) ? haversineKm(userLocation, b) : Infinity;
                return da - db;
              });
            } else {
              out.sort((a, b) => a.location.localeCompare(b.location));
            }
          }
        }
        return out;
      }, [baseList, query, activeCategory, sortBy, userLocation, view, searchRadiusKm]);

      const totalPages = Math.max(1, Math.ceil(filteredSorted.length / PAGE_SIZE));
      const pageSafe = Math.min(page, totalPages);
      const pageItems = filteredSorted.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);
      const avgRating = benches.length ? (benches.reduce((s, b) => s + b.rating, 0) / benches.length).toFixed(1) : 0;

      // Leaflet
      useEffect(() => {
        if (view !== 'map') return;
        const t = setTimeout(() => {
          if (!mapInstance.current && document.getElementById('map-container')) {
            const worldBounds = L.latLngBounds([-89, -180], [89, 180]);
            mapInstance.current = L.map('map-container', {
              zoomControl: true,

              maxZoom: 18,
              maxBounds: worldBounds,
              maxBoundsViscosity: 1.0,

            }).setView([46.6, 2.4], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              minZoom: 2,
              maxZoom: 18,
              noWrap: true,
              bounds: worldBounds,
              detectRetina: true,
              attribution: '&copy; OpenStreetMap'
            }).addTo(mapInstance.current);
            markersLayer.current = L.layerGroup().addTo(mapInstance.current);
          }
          if (mapInstance.current) {
            mapInstance.current.invalidateSize();
            renderMarkers();
          }
        }, 100);
        return () => {
          clearTimeout(t);
          if (mapInstance.current) {
            mapInstance.current.remove();
            mapInstance.current = null;
          }
        };
      }, [view]);

      useEffect(() => {

      function renderMarkers() {
        if (!markersLayer.current) return;
        markersLayer.current.clearLayers();
        const withCoords = benches.filter(b => b.lat != null && b.lng != null);
        withCoords.forEach(b => {
          const icon = L.divIcon({
            className: '',
            html: `<div style="width:34px;height:34px;background:#1d3d2c;border:2px solid #f2c97e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(28,23,18,0.35);"><img src="${benchImageSrc}" style="width:16px;height:16px;transform:rotate(45deg);"/></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 32]
          });
          const m = L.marker([b.lat, b.lng], { icon }).addTo(markersLayer.current);
          m.on('click', () => setSelectedBench(b));
        });
        if (withCoords.length && mapInstance.current) {
          const bounds = L.latLngBounds(withCoords.map(b => [b.lat, b.lng]));
          mapInstance.current.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
        }
      }

      function locateMe(forSort) {
        if (!navigator.geolocation) {
          showToast("Localisation non disponible sur cet appareil");
          return;
        }
        setLocationStatus('pending');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setUserLocation(loc);
            setLocationStatus('granted');
            if (mapInstance.current) {
              mapInstance.current.flyTo([loc.lat, loc.lng], 12);
              if (userMarker.current) userMarker.current.remove();
              userMarker.current = L.circleMarker([loc.lat, loc.lng], {
                radius: 8, color: '#b8813a', fillColor: '#f2c97e', fillOpacity: 0.9, weight: 2
              }).addTo(mapInstance.current);
            }
            if (forSort) showToast("Tri par distance activé");
          },
          () => {
            setLocationStatus('denied');
            showToast("Localisation refusée ou indisponible");
          },
          { timeout: 8000 }
        );
      }

      function handleSortClick(key) {
        setSortBy(key);
        if (key === 'distance' && !userLocation) locateMe(true);
      }

      function handleRadiusClick(km) {

      async function toggleFavorite(id, e) {
        if (e) e.stopPropagation();
        if (!user) {
          showToast("Connectez-vous pour gérer vos favoris");
          return;
        }

        const bench = benches.find(b => b.id === id);
        const wasFavorite = !!(bench && bench.favorite);

        // Mise à jour optimiste de l'UI
        setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: !wasFavorite } : b));
        setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: !wasFavorite } : sb);

        if (wasFavorite) {
          const { error } = await db.from('favorites').delete().eq('user_id', user.id).eq('bench_id', id);
          if (error) {
            console.error('Erreur suppression favori:', error);
            showToast("Erreur lors de la mise à jour des favoris");
            // Rollback en cas d'échec
            setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: wasFavorite } : b));
            setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: wasFavorite } : sb);
          }
        } else {
          const { error } = await db.from('favorites').insert({ user_id: user.id, bench_id: id });
          if (error) {
            console.error('Erreur ajout favori:', error);
            showToast("Erreur lors de la mise à jour des favoris");
            // Rollback en cas d'échec
            setBenches(bs => bs.map(b => b.id === id ? { ...b, favorite: wasFavorite } : b));
            setSelectedBench(sb => sb && sb.id === id ? { ...sb, favorite: wasFavorite } : sb);
          }
        }
      }

      // Construit un lien Google Maps : itinéraire précis si on a des coordonnées GPS,
      // sinon une simple recherche par nom + ville.
      function getMapsUrl(bench) {
        if (bench.lat != null && bench.lng != null) {
          return `https://www.google.com/maps/dir/?api=1&destination=${bench.lat},${bench.lng}`;
        }
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(bench.name + ', ' + bench.location)}`;

      // Partage un banc : utilise le partage natif du téléphone si disponible,
      // sinon copie un texte + lien dans le presse-papiers.
      async function shareBench(bench) {
        const shareText = `${bench.name} — ${bench.location} (${bench.rating}/5) sur My Bench`;
        const shareUrl = window.location.href;
        if (navigator.share) {
          try {
            await navigator.share({ title: bench.name, text: shareText, url: shareUrl });
          } catch (err) {
            // L'utilisateur a annulé le partage : on ne fait rien.
          }
        } else if (navigator.clipboard) {
          try {
            await navigator.clipboard.writeText(`${shareText} — ${shareUrl}`);
            showToast('Lien copié dans le presse-papiers !');
          } catch (err) {
            showToast("Impossible de copier le lien.");
          }
        } else {
          showToast("Le partage n'est pas disponible sur cet appareil.");
        }
      }

      function openAddForm() {
        setFormData(EMPTY_FORM);
        setFormError('');
        setCitySuggestions([]);
        setShowCitySuggestions(false);
        photoFilesRef.current = {};
        setShowAddForm(true);
      }

      // Gestion des fichiers photo.
      // On garde un aperçu local en base64 (juste pour l'affichage, jamais envoyé en DB),
      // et on conserve le fichier brut à part : c'est LUI qui sera envoyé à Supabase Storage
      // au moment de la soumission du formulaire (voir uploadBenchPhotos).
      function handlePhotoFile(index, file) {
        const key = `img${index + 1}`;
        if (!file) {
          // Supprimer l'image si aucun fichier sélectionné
          setFormData(f => ({ ...f, [key]: '' }));
          delete photoFilesRef.current[key];
          return;
        }
        photoFilesRef.current[key] = file;
        const reader = new FileReader();
        reader.onloadend = () => {
          setFormData(f => ({ ...f, [key]: reader.result }));
        };
        reader.readAsDataURL(file);
      }

      // Envoie les fichiers photo en attente vers le bucket Supabase Storage "bench-photos"
      // et renvoie la liste des URLs publiques, dans l'ordre img1/img2/img3.
      // NB : le bucket doit exister et être configuré en lecture publique côté Supabase.
      async function uploadBenchPhotos(userId) {
        const keys = ['img1', 'img2', 'img3'];
        const urls = [];
        for (const key of keys) {
          const file = photoFilesRef.current[key];
          if (!file) continue;
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
          const path = `${userId}/${Date.now()}-${key}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
          const { error: uploadError } = await db.storage.from('bench-photos').upload(path, file, {
            cacheControl: '3600',
            upsert: false,
          });
          if (uploadError) {
            throw new Error(`Échec de l'envoi de la photo (${key}) : ${uploadError.message}`);
          }
          const { data: publicUrlData } = db.storage.from('bench-photos').getPublicUrl(path);
          urls.push(publicUrlData.publicUrl);
        }
        return urls;
      }

      // Géocode une adresse/ville texte en coordonnées lat/lng via Nominatim (OpenStreetMap)
      async function geocodeLocation(query) {
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`
          );
          if (!res.ok) return null;
          const results = await res.json();
          if (results && results.length > 0) {
            return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
          }
        } catch (err) {
          console.error('Erreur géocodage:', err);
        }
        return null;
      }

      // Appelle Nominatim pour proposer jusqu'à 4 villes correspondant au texte tapé.
      async function fetchCitySuggestions(text) {
        if (!text || text.trim().length < 2) {
          setCitySuggestions([]);
          setShowCitySuggestions(false);
          return;
        }
        setCitySearching(true);
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=4&q=${encodeURIComponent(text.trim())}`
          );
          if (!res.ok) throw new Error('Réponse invalide');
          const results = await res.json();
          setCitySuggestions((results || []).slice(0, 4).map(r => ({
            label: r.display_name,
            lat: parseFloat(r.lat),
            lng: parseFloat(r.lon),
          })));
          setShowCitySuggestions(true);
        } catch (err) {
          console.error('Erreur autocomplétion ville:', err);
          setCitySuggestions([]);
        } finally {
          setCitySearching(false);
        }
      }

      // On attend 400ms après la dernière frappe avant d'interroger Nominatim,
      // pour ne pas envoyer une requête à chaque lettre tapée.
      function handleLocationInputChange(value) {
        // On efface les coordonnées précédentes : tant que l'utilisateur n'a pas
        // choisi une nouvelle suggestion (ou n'a pas cliqué sur "Ma position"),
        // le texte tapé ne correspond plus forcément à une position connue.
        setFormData(f => ({ ...f, location: value, lat: null, lng: null }));
        if (cityDebounceRef.current) clearTimeout(cityDebounceRef.current);
        cityDebounceRef.current = setTimeout(() => fetchCitySuggestions(value), 400);
      }

      // Quand l'utilisateur choisit une suggestion, on récupère directement ses coordonnées :
      // plus besoin de re-géocoder au moment de l'envoi du formulaire, c'est plus fiable.
      function selectCitySuggestion(suggestion) {
        setFormData(f => ({ ...f, location: suggestion.label, lat: suggestion.lat, lng: suggestion.lng }));
        setCitySuggestions([]);
        setShowCitySuggestions(false);
      }

      async function handleAddSubmit(e) {
        e.preventDefault();
        if (addSubmitting) return; // Empêche l'ajout en double si on clique deux fois
        if (!formData.name.trim() || !formData.location.trim()) {
          setFormError("Le nom du banc et la ville sont obligatoires.");
          return;
        }
        // Vérifier qu'au moins une photo est présente
        const hasAtLeastOnePhoto = ['img1', 'img2', 'img3'].some(key => photoFilesRef.current[key]);
        if (!hasAtLeastOnePhoto) {
          setFormError("Veuillez ajouter au moins une photo.");
          return;
        }

        setAddSubmitting(true);
        try {
          // On envoie d'abord les photos vers Supabase Storage : la base ne stocke
          // plus que des URLs publiques, jamais de base64 (ça évitait de saturer Postgres).
          const finalImages = await uploadBenchPhotos(user.id);
          // Si on n'a pas déjà des coordonnées (via géolocalisation GPS),
          // on géocode le texte saisi dans le champ "Ville" pour pouvoir
          // placer le banc sur la carte.
          let finalLat = formData.lat;
          let finalLng = formData.lng;
          if (finalLat == null || finalLng == null) {
            const geo = await geocodeLocation(formData.location.trim());
            if (geo) {
              finalLat = geo.lat;
              finalLng = geo.lng;
            } else {
              showToast("Ville introuvable : le banc sera ajouté sans position sur la carte");
            }
          }

          const authorName = pseudo || user?.email || 'Anonyme';

          const { data, error } = await db.from('benches').insert({
            name: formData.name.trim(),
            location: formData.location.trim(),
            category: formData.category,
            rating: formData.rating,
            comment: formData.comment.trim(),
            confort: formData.confort,
            solidite: formData.solidite,
            author: authorName,
            user_id: user.id,
            tags: formData.tags,
            lat: finalLat,
            lng: finalLng,
            images: finalImages,
          }).select().single();

          if (error) {
            setFormError("Erreur lors de l'ajout du banc : " + error.message);
            return;
          }

          const newBench = {
            id: data.id,
            name: data.name,
            location: data.location,
            lat: data.lat,
            lng: data.lng,
            category: data.category,
            rating: data.rating,
            comment: data.comment || '',
            criteria: { confort: data.confort, solidite: data.solidite },
            author: data.author,
            userId: data.user_id,
            tags: data.tags || [],
            dateAdded: data.date_added,
            favorite: false,
            images: data.images || [],
          };
          setBenches(bs => [newBench, ...bs]);
          setShowAddForm(false);
          setView('list');
          setActiveCategory('tous');
          showToast("Banc ajouté avec succès");
        } catch (err) {
          setFormError("Erreur lors de l'ajout du banc : " + err.message);
        } finally {
          setAddSubmitting(false);
        }
      }

      function useMyPositionForForm() {

        navigator.geolocation.getCurrentPosition(

          () => showToast("Impossible de récupérer votre position"),
          { timeout: 8000 }
        );
      }
